<style id="juken-rpg-dark-fantasy-theme">

/* =========================================================
   ASCEND
   Dark Fantasy × Study RPG
   CURRENT THEME OVERRIDE
========================================================= */

:root {
  --bg-dark: #080a10;
  --bg-main: #0c0f17;
  --bg-card: #121722;
  --bg-card-hover: #171d2b;
  --bg-input: #0b0e15;

  --border: rgba(255,255,255,.08);
  --border-light: rgba(255,255,255,.13);

  --text-main: #f3f5f8;
  --text-sub: #a8afbd;
  --text-muted: #6f7786;

  --accent: #7c5cff;
  --accent-light: #9b83ff;
  --accent-dark: #5940d8;

  --cyan: #35c9ff;
  --green: #42d392;
  --yellow: #ffd166;
  --orange: #ff9f43;
  --red: #ff5d73;

  --shadow:
    0 12px 40px rgba(0,0,0,.35);

  --radius: 18px;
  --radius-small: 12px;

  --transition:
    180ms cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   BASE
========================================================= */

html {
  min-height: 100%;
  background: var(--bg-dark) !important;
}

body {
  margin: 0 !important;
  min-height: 100vh;

  color: var(--text-main) !important;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(124,92,255,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 30%,
      rgba(53,201,255,.06),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #080a10 0%,
      #0b0e16 50%,
      #090b11 100%
    ) !important;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif !important;

  -webkit-font-smoothing:
    antialiased;

  text-rendering:
    optimizeLegibility;
}


body::before {
  content: "";

  position: fixed;
  inset: 0;

  pointer-events: none;
  z-index: -1;

  background-image:
    radial-gradient(
      rgba(255,255,255,.035) 1px,
      transparent 1px
    );

  background-size:
    26px 26px;

  mask-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.8),
      transparent 90%
    );

  opacity: .35;
}


button,
input,
select,
textarea {
  font: inherit;
}


button {
  cursor: pointer;
}


.hidden {
  display: none !important;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
  width: 7px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background:
    rgba(255,255,255,.12);

  border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
  background:
    rgba(255,255,255,.22);
}


/* =========================================================
   APP / PAGE WIDTH
========================================================= */

#app {
  min-height: 100vh;

  padding-bottom:
    calc(
      76px +
      env(safe-area-inset-bottom)
    ) !important;
}


#app > div,
#app > main {
  width:
    min(
      calc(100% - 28px),
      1080px
    );

  margin-left: auto !important;
  margin-right: auto !important;
}


/* =========================================================
   GENERIC CARD
========================================================= */

.card,
#app > div > div {
  color: var(--text-main);
}


.card {
  background:
    linear-gradient(
      145deg,
      rgba(18,23,34,.96),
      rgba(13,17,26,.96)
    ) !important;

  border:
    1px solid var(--border) !important;

  border-radius:
    var(--radius) !important;

  box-shadow:
    0 8px 28px rgba(0,0,0,.16),
    inset 0 1px rgba(255,255,255,.035) !important;
}


/* =========================================================
   CONTENT SECTIONS
========================================================= */

#app section {
  position: relative;

  margin-bottom: 18px !important;

  border-radius:
    var(--radius) !important;

  border:
    1px solid var(--border) !important;

  background:
    linear-gradient(
      145deg,
      rgba(18,23,34,.94),
      rgba(13,17,26,.94)
    ) !important;

  box-shadow:
    0 8px 28px rgba(0,0,0,.16),
    inset 0 1px rgba(255,255,255,.035) !important;

  overflow: hidden;

  transition:
    border-color var(--transition),
    transform var(--transition),
    box-shadow var(--transition);
}


#app section:hover {
  border-color:
    rgba(255,255,255,.105) !important;
}


/* =========================================================
   HEADINGS
========================================================= */

#app h1,
#app h2,
#app h3,
#app h4 {
  color: var(--text-main);
}


#app h1 {
  letter-spacing: -.02em;
}


#app h2 {
  font-weight: 850;
}


/* =========================================================
   INPUTS
========================================================= */

#app input,
#app select,
#app textarea {
  width: 100%;

  color:
    var(--text-main) !important;

  background:
    var(--bg-input) !important;

  border:
    1px solid var(--border) !important;

  border-radius:
    11px !important;

  padding:
    12px 13px !important;

  outline: none;

  transition:
    border-color var(--transition),
    box-shadow var(--transition),
    background var(--transition);
}


#app input:focus,
#app select:focus,
#app textarea:focus {
  border-color:
    rgba(124,92,255,.65) !important;

  box-shadow:
    0 0 0 3px rgba(124,92,255,.12),
    0 0 24px rgba(124,92,255,.08) !important;

  background:
    #0d1019 !important;
}


/* =========================================================
   BUTTONS
========================================================= */

#app button:not(
  .persistent-main-nav-btn
):not(
  .persistent-top-tab
) {
  border-radius:
    11px !important;

  transition:
    transform var(--transition),
    box-shadow var(--transition),
    filter var(--transition),
    background var(--transition),
    border-color var(--transition);
}


#app button:not(
  .persistent-main-nav-btn
):not(
  .persistent-top-tab
):hover {
  transform:
    translateY(-2px);
}


/* =========================================================
   PLAYER / HOME STYLE
========================================================= */

#app section:first-of-type {
  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(124,92,255,.16),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      #151a28,
      #0e121c
    ) !important;
}


/* XPっぽい横バー */
#app div[style*="height:7px"],
#app div[style*="height: 7px"],
#app div[style*="height:8px"],
#app div[style*="height: 8px"] {
  background:
    rgba(0,0,0,.42) !important;

  border-radius:
    999px !important;
}


/* 紫〜シアンの進捗 */
#app div[style*="width:${xpPercent}%"] {
  background:
    linear-gradient(
      90deg,
      #694cf1,
      #a994ff,
      #35c9ff
    ) !important;

  box-shadow:
    0 0 15px
    rgba(124,92,255,.4) !important;
}


/* =========================================================
   TOP TAB NAVIGATION
========================================================= */

#persistent-top-tabs {
  position: sticky !important;

  top: -12px !important;

  z-index: 80 !important;

  width:
    min(
      calc(100% - 28px),
      1080px
    ) !important;

  margin:
    0 auto
    18px !important;

  padding:
    5px !important;

  gap:
    7px !important;

  background:
    rgba(0,0,0,.18) !important;

  border:
    1px solid
    var(--border) !important;

  border-radius:
    13px !important;

  box-shadow:
    none !important;

  backdrop-filter:
    blur(16px);
}


.persistent-top-tab {
  min-height:
    42px !important;

  border:
    0 !important;

  border-radius:
    9px !important;

  padding:
    10px 13px !important;

  color:
    var(--text-muted) !important;

  background:
    transparent !important;

  font-size:
    12px !important;

  font-weight:
    800 !important;

  transition:
    background var(--transition),
    color var(--transition),
    transform var(--transition) !important;
}


.persistent-top-tab:hover {
  color:
    var(--text-main) !important;

  background:
    rgba(255,255,255,.05) !important;
}


.persistent-top-tab.active {
  color:
    white !important;

  background:
    linear-gradient(
      135deg,
      rgba(124,92,255,.85),
      rgba(89,64,216,.85)
    ) !important;

  border:
    0 !important;

  box-shadow:
    0 5px 16px
    rgba(124,92,255,.18) !important;
}


/* =========================================================
   BOTTOM NAVIGATION
   ★ 浮かせない
========================================================= */

#persistent-bottom-nav {
  position:
    fixed !important;

  left:
    0 !important;

  right:
    0 !important;

  bottom:
    0 !important;

  transform:
    none !important;

  z-index:
    9999 !important;

  width:
    100% !important;

  max-width:
    none !important;

  min-height:
    70px !important;

  display:
    grid !important;

  grid-template-columns:
    repeat(
      6,
      minmax(0,1fr)
    ) !important;

  gap:
    4px !important;

  padding:
    7px
    max(
      7px,
      calc(
        (100vw - 1080px) / 2
      )
    )
    calc(
      7px +
      env(safe-area-inset-bottom)
    ) !important;

  background:
    rgba(11,14,21,.96) !important;

  border:
    0 !important;

  border-top:
    1px solid
    var(--border-light) !important;

  border-radius:
    0 !important;

  box-shadow:
    0 -8px 30px
    rgba(0,0,0,.35) !important;

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);
}


.persistent-main-nav-btn {
  min-width: 0 !important;

  min-height:
    56px !important;

  display:
    flex !important;

  flex-direction:
    column !important;

  align-items:
    center !important;

  justify-content:
    center !important;

  gap:
    3px !important;

  padding:
    5px 2px !important;

  border:
    0 !important;

  border-radius:
    13px !important;

  color:
    var(--text-muted) !important;

  background:
    transparent !important;

  transition:
    color var(--transition),
    background var(--transition),
    transform var(--transition) !important;
}


.persistent-main-nav-btn:hover {
  color:
    var(--text-main) !important;

  background:
    rgba(255,255,255,.045) !important;
}


.persistent-main-nav-btn
.nav-icon {
  font-size:
    19px !important;

  line-height:
    1 !important;

  transition:
    transform .25s
    cubic-bezier(.16,1,.3,1);
}


.persistent-main-nav-btn
.nav-label {
  font-size:
    9px !important;

  line-height:
    1 !important;

  font-weight:
    800 !important;
}


.persistent-main-nav-btn.active {
  color:
    #fff !important;

  background:
    linear-gradient(
      145deg,
      rgba(124,92,255,.28),
      rgba(124,92,255,.09)
    ) !important;

  box-shadow:
    inset 0 0 0 1px
    rgba(124,92,255,.15) !important;
}


.persistent-main-nav-btn.active
.nav-icon {
  transform:
    translateY(-1px)
    scale(1.08);

  filter:
    drop-shadow(
      0 0 8px
      rgba(124,92,255,.45)
    ) !important;
}


/* 以前の青い上ラインを削除 */
.persistent-main-nav-btn.active::before {
  display:
    none !important;
}


/* =========================================================
   QUEST / LIST ITEMS
========================================================= */

#app [style*="background:#0b1019"],
#app [style*="background: #0b1019"],
#app [style*="background:#111722"],
#app [style*="background: #111722"] {
  background:
    rgba(255,255,255,.025) !important;

  border-color:
    var(--border) !important;
}


/* =========================================================
   BOSS
========================================================= */

#app [style*="255,56,100"],
#app [style*="255, 56, 100"] {
  border-color:
    rgba(255,93,115,.18) !important;
}


/* =========================================================
   OTHER MENU BUTTONS
========================================================= */

#other-profile,
#other-shop,
#other-locker,
#other-titles,
#other-settings {
  min-height:
    64px !important;

  padding:
    15px 17px !important;

  text-align:
    left !important;

  color:
    var(--text-main) !important;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.018)
    ) !important;

  border:
    1px solid
    var(--border) !important;

  box-shadow:
    none !important;
}


#other-profile:hover,
#other-shop:hover,
#other-locker:hover,
#other-titles:hover,
#other-settings:hover {
  background:
    linear-gradient(
      145deg,
      rgba(124,92,255,.1),
      rgba(255,255,255,.025)
    ) !important;

  border-color:
    rgba(124,92,255,.25) !important;
}


/* =========================================================
   AUTH
========================================================= */

#auth-screen {
  min-height:
    100vh;

  background:
    transparent !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  #app > div,
  #app > main {
    width:
      min(
        calc(100% - 18px),
        1080px
      );
  }


  #persistent-top-tabs {
    width:
      calc(100% - 18px) !important;

    margin-bottom:
      14px !important;
  }


  #persistent-bottom-nav {
    padding-left:
      3px !important;

    padding-right:
      3px !important;
  }


  .persistent-main-nav-btn {
    min-height:
      53px !important;
  }


  .persistent-main-nav-btn
  .nav-icon {
    font-size:
      17px !important;
  }


  .persistent-main-nav-btn
  .nav-label {
    font-size:
      8px !important;
  }

}


/* =========================================================
   VERY SMALL
========================================================= */

@media (max-width: 380px) {

  .persistent-main-nav-btn
  .nav-icon {
    font-size:
      16px !important;
  }


  .persistent-main-nav-btn
  .nav-label {
    font-size:
      7px !important;
  }

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes rpgScreenEnter {

  from {
    opacity: 0;
    transform:
      translateY(8px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}


#app > div {
  animation:
    rpgScreenEnter
    .35s
    cubic-bezier(.16,1,.3,1);
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (
  prefers-reduced-motion:
  reduce
) {

  *,
  *::before,
  *::after {
    animation-duration:
      .01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      .01ms !important;
  }

}

</style>

  width: 128px;
  height: 128px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  color: var(--boss-color);

  font-size: 54px;
  font-weight: 1000;

  background:
    radial-gradient(
      circle at 40% 30%,
      rgba(255,255,255,.09),
      rgba(var(--boss-color-rgb), .11) 45%,
      rgba(0,0,0,.15) 70%
    );

  border:
    1px solid
    rgba(var(--boss-color-rgb), .32);

  box-shadow:
    0 0 24px rgba(var(--boss-color-rgb), .18),
    0 0 65px rgba(var(--boss-color-rgb), .08),
    inset 0 0 24px rgba(var(--boss-color-rgb), .08);

  text-shadow:
    0 0 18px rgba(var(--boss-color-rgb), .55);

  animation:
    bossFloat
    3.2s ease-in-out infinite;
}


/* =========================================================
   HEADER
========================================================= */

.boss-main-info {
  display: grid;
  gap: 15px;

  padding: 18px;
}


.boss-name-row {
  display: flex;

  align-items: flex-start;
  justify-content: space-between;

  gap: 12px;
}


.boss-name-wrap {
  min-width: 0;
}


.boss-caption {
  margin-bottom: 4px;

  color: var(--boss-color);

  font-size: 9px;
  font-weight: 900;

  letter-spacing: .18em;

  opacity: .8;
}


.boss-ui-name {
  display: block;

  color: #f5f7ff;

  font-size: 1.38rem;
  font-weight: 950;

  line-height: 1.25;

  text-shadow:
    0 0 22px rgba(var(--boss-color-rgb), .15);
}


.boss-level-badge {
  flex: 0 0 auto;

  padding: 7px 10px;

  border-radius: 9px;

  color: var(--boss-color);

  background:
    rgba(var(--boss-color-rgb), .08);

  border:
    1px solid
    rgba(var(--boss-color-rgb), .20);

  font-size: 11px;
  font-weight: 900;
}


/* =========================================================
   WEAKNESS
========================================================= */

.boss-weakness-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0,1fr));

  gap: 8px;
}


.boss-info-chip {
  min-width: 0;

  padding: 10px 11px;

  border-radius: 11px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.07);
}


.boss-info-chip span {
  display: block;

  margin-bottom: 4px;

  color: #6f7786;

  font-size: 9px;

  font-weight: 800;
}


.boss-info-chip strong {
  display: block;

  overflow: hidden;

  text-overflow: ellipsis;

  color: #e9edf5;

  font-size: 12px;

  white-space: nowrap;
}


.boss-info-chip.weakness strong {
  color: var(--boss-color);
}


/* =========================================================
   HP
========================================================= */

.boss-hp-area {
  display: grid;
  gap: 7px;
}


.boss-hp-label {
  display: flex;

  justify-content: space-between;

  gap: 15px;

  color: #a8afbd;

  font-size: 11px;

  font-weight: 800;
}


.boss-hp-label strong {
  color: #f3f5f8;

  font-variant-numeric:
    tabular-nums;
}


.boss-hp-track {
  position: relative;

  height: 15px;

  padding: 2px;

  overflow: hidden;

  border-radius: 999px;

  background:
    rgba(0,0,0,.48);

  border:
    1px solid
    rgba(255,255,255,.055);
}


.boss-hp-fill {
  position: relative;

  height: 100%;

  overflow: hidden;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      var(--boss-color-2),
      var(--boss-color)
    );

  box-shadow:
    0 0 15px
    rgba(var(--boss-color-rgb), .28);

  transition:
    width .8s cubic-bezier(.16,1,.3,1);
}


.boss-hp-fill::after {
  content: "";

  position: absolute;

  top: 0;
  bottom: 0;

  width: 45%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.28),
      transparent
    );

  transform:
    skewX(-20deg);

  animation:
    bossHpShine
    2.5s linear infinite;
}


/* =========================================================
   CONTRIBUTION
========================================================= */

.boss-contribution-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0,1fr));

  gap: 8px;

  padding-top: 13px;

  border-top:
    1px solid
    rgba(255,255,255,.07);
}


.boss-contribution-item {
  min-width: 0;

  text-align: center;

  padding: 8px 4px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.018);
}


.boss-contribution-item span {
  display: block;

  margin-bottom: 4px;

  color: #6f7786;

  font-size: 8px;

  font-weight: 800;
}


.boss-contribution-item strong {
  display: block;

  overflow: hidden;

  color: #f3f5f8;

  font-size: 12px;

  text-overflow: ellipsis;

  white-space: nowrap;
}


.boss-contribution-item.rate strong {
  color: var(--boss-color);
}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes bossCardEnter {

  from {
    opacity: 0;

    transform:
      translateY(12px)
      scale(.975);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }

}


@keyframes bossFloat {

  0%,
  100% {
    transform:
      translateY(0)
      scale(1);
  }

  50% {
    transform:
      translateY(-9px)
      scale(1.025);
  }

}


@keyframes bossAuraPulse {

  0%,
  100% {
    transform:
      scale(.92);

    opacity: .55;
  }

  50% {
    transform:
      scale(1.12);

    opacity: 1;
  }

}


@keyframes bossAuraRing {

  0%,
  100% {
    transform:
      scale(.86)
      rotate(0deg);

    opacity: .35;
  }

  50% {
    transform:
      scale(1.06)
      rotate(8deg);

    opacity: .8;
  }

}


@keyframes bossHpShine {

  from {
    left: -60%;
  }

  to {
    left: 130%;
  }

}


/* 英語ボスだけ少し機械的に */
.boss-theme-english .boss-visual {

  animation:
    bossEnglishFloat
    3.4s steps(1,end) infinite;

}


@keyframes bossEnglishFloat {

  0%,
  88%,
  100% {
    transform:
      translate(0,0);
  }

  90% {
    transform:
      translate(-2px,1px);
  }

  92% {
    transform:
      translate(2px,-1px);
  }

  94% {
    transform:
      translate(-1px,0);
  }

}


/* 理科ボスはたまに閃光 */
.boss-theme-science .boss-visual {

  animation:
    bossScienceFloat
    3s linear infinite;

}


@keyframes bossScienceFloat {

  0%,
  8%,
  12%,
  100% {
    transform:
      translateY(0);

    filter:
      brightness(1);
  }

  9% {
    transform:
      translateY(-2px);

    filter:
      brightness(1.8);
  }

  10% {
    transform:
      translateY(1px);

    filter:
      brightness(1.15);
  }

  55% {
    transform:
      translateY(-8px);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:600px) {

  .boss-stage {
    min-height: 205px;
  }


  .boss-visual {
    width: 110px;
    height: 110px;

    font-size: 46px;
  }


  .boss-main-info {
    padding: 15px;
  }


  .boss-ui-name {
    font-size: 1.18rem;
  }


  .boss-weakness-grid {
    grid-template-columns: 1fr;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  .boss-battle-card,
  .boss-stage::before,
  .boss-aura,
  .boss-visual,
  .boss-hp-fill::after {
    animation: none !important;
  }

}

</style>
