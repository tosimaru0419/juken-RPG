async function checkNormalTitles(user, suppliedData = null) {
  const userRef = doc(db, "users", user.uid);

  let data = suppliedData;

  if (!data) {
    const snap = await getDoc(userRef);

    if (!snap.exists()) return [];

    data = snap.data();
  }

  const owned = getOwnedTitlesArray(data);
  const before = new Set(owned);

  const levelInfo =
    calculateLevelFromTotalXp(
      Number(data.xp || 0)
    );

  const level = levelInfo.level;
  const totalMinutes =
    Number(data.totalStudyMinutes || 0);

  const hours = totalMinutes / 60;

  const subjects =
    getSubjectMinutesEntries(data);

  const studiedSubjects =
    subjects.filter(s => s.minutes > 0);

  const inventory =
    data.inventory || {};

  const ownedItemTypes =
    Object.entries(inventory)
      .filter(([, count]) => Number(count || 0) > 0)
      .length;

  // ==========================================================
  // レベル
  // ==========================================================

  if (level >= 5) addOwnedTitleById(owned, "normal-01");
  if (level >= 10) addOwnedTitleById(owned, "normal-02");
  if (level >= 25) addOwnedTitleById(owned, "normal-03");
  if (level >= 50) addOwnedTitleById(owned, "normal-04");
  if (level >= 75) addOwnedTitleById(owned, "normal-05");

  if (
    level >= 100 ||
    Number(data.stars || 0) >= 1
  ) {
    addOwnedTitleById(owned, "normal-06");
  }

  // ==========================================================
  // 累計勉強時間
  // ==========================================================

  if (hours >= 10) addOwnedTitleById(owned, "normal-07");
  if (hours >= 50) addOwnedTitleById(owned, "normal-08");
  if (hours >= 100) addOwnedTitleById(owned, "normal-09");
  if (hours >= 250) addOwnedTitleById(owned, "normal-10");
  if (hours >= 500) addOwnedTitleById(owned, "normal-11");
  if (hours >= 1000) addOwnedTitleById(owned, "normal-12");

  // ==========================================================
  // 連続勉強
  // ※ consecutiveStudyDays を次の工程で自動記録する
  // ==========================================================

  const streak =
    Number(data.consecutiveStudyDays || 0);

  if (streak >= 3) addOwnedTitleById(owned, "normal-13");
  if (streak >= 7) addOwnedTitleById(owned, "normal-14");
  if (streak >= 14) addOwnedTitleById(owned, "normal-15");
  if (streak >= 30) addOwnedTitleById(owned, "normal-16");
  if (streak >= 60) addOwnedTitleById(owned, "normal-17");
  if (streak >= 100) addOwnedTitleById(owned, "normal-18");

  // ==========================================================
  // 教科
  // ==========================================================

  const systems = new Set(
    studiedSubjects
      .map(s => subjectSystemForTitle(s.subject))
      .filter(Boolean)
  );

  if (
    ["数学", "国語", "地歴公民", "理科", "英語"]
      .every(system => systems.has(system))
  ) {
    addOwnedTitleById(owned, "normal-19");
  }

  const humanitiesSubjects = new Set([
    "現代文",
    "古文",
    "漢文",
    "日本史",
    "世界史",
    "地理",
    "政治・経済",
    "倫理",
    "公共",
  ]);

  const scienceSubjects = new Set([
    "数学IA",
    "数学IIBC",
    "数学III",
    "化学",
    "化学基礎",
    "物理",
    "物理基礎",
    "生物",
    "生物基礎",
    "地学",
    "地学基礎",
  ]);

  const hasHumanities =
    studiedSubjects.some(
      s => humanitiesSubjects.has(s.subject)
    );

  const hasScience =
    studiedSubjects.some(
      s => scienceSubjects.has(s.subject)
    );

  if (hasHumanities && hasScience) {
    addOwnedTitleById(owned, "normal-20");
  }

  if (subjects.length > 0) {
    const levels =
      subjects.map(s => s.level);

    const minLevel =
      Math.min(...levels);

    const maxLevel =
      Math.max(...levels);

    if (
      subjects.some(
        s =>
          s.level === minLevel &&
          s.minutes >= 600
      )
    ) {
      addOwnedTitleById(owned, "normal-21");
    }

    if (
      subjects.some(
        s =>
          s.level === maxLevel &&
          s.minutes >= 600
      )
    ) {
      addOwnedTitleById(owned, "normal-22");
    }
  }

  if (
    subjects.filter(s => s.minutes >= 600).length >= 5
  ) {
    addOwnedTitleById(owned, "normal-23");
  }

  // ==========================================================
  // ボス
  // ※ bossStats はボス履歴接続時に更新
  // ==========================================================

  const bossStats =
    data.bossStats || {};

  if (Number(bossStats.participation || 0) >= 1)
    addOwnedTitleById(owned, "normal-24");

  if (Number(bossStats.defeats || 0) >= 1)
    addOwnedTitleById(owned, "normal-25");

  if (Number(bossStats.weakHits || 0) >= 1)
    addOwnedTitleById(owned, "normal-26");

  if (Number(bossStats.soloDefeats || 0) >= 1)
    addOwnedTitleById(owned, "normal-27");

  if (Number(bossStats.mvp || 0) >= 1)
    addOwnedTitleById(owned, "normal-28");

  if (
    Array.isArray(bossStats.defeatedLv10Systems) &&
    bossStats.defeatedLv10Systems.length >= 1
  ) {
    addOwnedTitleById(owned, "normal-29");
  }

  if (
    Array.isArray(bossStats.defeatedSystems) &&
    new Set(bossStats.defeatedSystems).size >= 5
  ) {
    addOwnedTitleById(owned, "normal-30");
  }

  // ==========================================================
  // コイン
  // ==========================================================

  const lifetimeCoins =
    Number(data.lifetimeCoinsEarned || 0);

  if (lifetimeCoins >= 10000)
    addOwnedTitleById(owned, "normal-31");

  if (lifetimeCoins >= 50000)
    addOwnedTitleById(owned, "normal-32");

  if (lifetimeCoins >= 100000)
    addOwnedTitleById(owned, "normal-33");

  // ==========================================================
  // アイテム・ショップ
  // ==========================================================

  if (ownedItemTypes >= 5)
    addOwnedTitleById(owned, "normal-34");

  if (ownedItemTypes >= 10)
    addOwnedTitleById(owned, "normal-35");

  if (Number(data.shopPurchaseCount || 0) >= 1)
    addOwnedTitleById(owned, "normal-36");

  // ==========================================================
  // ログイン
  // ==========================================================

  if (Number(data.loginDays || 0) >= 30)
    addOwnedTitleById(owned, "normal-39");

  // ==========================================================
  // 称号収集
  // ==========================================================

  if (normalTitleCountFromNames(owned) >= 10)
    addOwnedTitleById(owned, "normal-37");

  if (normalTitleCountFromNames(owned) >= 20)
    addOwnedTitleById(owned, "normal-38");

  if (normalTitleCountFromNames(owned) >= 30)
    addOwnedTitleById(owned, "normal-40");

  const newlyUnlocked =
    owned.filter(name => !before.has(name));

  if (newlyUnlocked.length > 0) {
    await updateDoc(userRef, {
      titles: owned,
      shopPurchaseCount:
        Number(data.shopPurchaseCount || 0) + 1,
      updatedAt: Date.now(),
    });
  }

  return newlyUnlocked;
}

      Number(data.xp || 0)
    );

  if (levelInfo.level < 100) {
    throw new Error("Lv.100到達後に転生できます。");
  }

  const currentStars =
    Number(data.stars || 0);

  await setDoc(
    userRef,
    {
      stars: currentStars + 1,

      // 転生後はLv.1相当
      xp: 0,

      lastReincarnationAt:
        serverTimestamp(),

      updatedAt:
        serverTimestamp(),
    },
    { merge: true }
  );

  return currentStars + 1;
}

const XP_ITEM_EFFECTS = {
  "経験の書": {
    multiplier: 1.5,
    durationMinutes: 60,
  },

  "上級経験の書": {
    multiplier: 2,
    durationMinutes: 30,
  },

  "極経験の書": {
    multiplier: 3,
    durationMinutes: 15,
  },

  "長時間経験の書": {
    multiplier: 1.5,
    durationMinutes: 90,
  },

  "超長時間経験の書": {
    multiplier: 1.5,
    durationMinutes: 120,
  },

  "連続の心得": {
    multiplier: 1.2,
    durationMinutes: null,
  },
};

function calculateStudyXp(minutes, itemName) {
  const baseMinutes = Math.max(0, Number(minutes || 0));

  if (!itemName || !XP_ITEM_EFFECTS[itemName]) {
    return baseMinutes;
  }

  const effect = XP_ITEM_EFFECTS[itemName];

  // 連続の心得：次のタイマー全体
  if (effect.durationMinutes == null) {
    return Math.floor(
      baseMinutes * effect.multiplier
    );
  }

  // その他：効果時間内だけ倍率
  const boostedMinutes =
    Math.min(baseMinutes, effect.durationMinutes);

  const normalMinutes =
    Math.max(0, baseMinutes - boostedMinutes);

  return (
    Math.floor(boostedMinutes * effect.multiplier) +
    normalMinutes
  );
}

const DAILY_QUEST_MINUTES = [15, 30, 45, 60];


function getJstWeekKey() {
  const now = new Date(
    new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" })
  );

  const day = now.getDay();
  const diffToMonday = (day + 6) % 7;

  const monday = new Date(now);
  monday.setDate(now.getDate() - diffToMonday);
  monday.setHours(0, 0, 0, 0);

  const y = monday.getFullYear();
  const m = String(monday.getMonth() + 1).padStart(2, "0");
  const d = String(monday.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

async function ensureWeeklyQuest(user, data) {
  const weekKey = getJstWeekKey();

  if (data.weeklyQuestWeekKey === weekKey) {
    return data;
  }

  const ref = doc(db, "users", user.uid);

  await setDoc(
    ref,
    {
      weeklyQuestWeekKey: weekKey,
      weeklyQuestProgress: 0,
      weeklyQuestCompleted: false,
      weeklyQuestRewardGranted: false,
      updatedAt: serverTimestamp(),
    },
    { merge: true }
  );

  return {
    ...data,
    weeklyQuestWeekKey: weekKey,
    weeklyQuestProgress: 0,
    weeklyQuestCompleted: false,
    weeklyQuestRewardGranted: false,
  };
}

function getJstDateKey() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).formatToParts(new Date());

  const values = Object.fromEntries(
    parts.map(part => [part.type, part.value])
  );

  return `${values.year}-${values.month}-${values.day}`;
}

function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}


function seededNumberFromString(text) {
  let hash = 2166136261;

  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }

  return (hash >>> 0) / 4294967296;
}

function getRareQuestForToday() {
  const dateKey = getJstDateKey();

  // 全ユーザー共通・約5%
  const appearanceRoll =
    seededNumberFromString(`rare-appear-${dateKey}`);

  if (appearanceRoll >= 0.05) {
    return null;
  }

  const typeRoll =
    seededNumberFromString(`rare-type-${dateKey}`);

  const slotRoll =
    seededNumberFromString(`rare-slot-${dateKey}`);

  const minutes =
    typeRoll < 0.5 ? 120 : 180;

  const slot =
    Math.floor(slotRoll * 3);

  return {
    id: `rare-${dateKey}`,
    rare: true,
    minutes,
    subject: null,
    progress: 0,
    completed: false,
    rewardGranted: false,
    slot,
  };
}

function chooseWeightedSubject(data) {
  const subjects = Array.isArray(data.selectedSubjects)
    ? data.selectedSubjects
    : [];

  if (!subjects.length) return null;

  const weightedPool = [];

  for (const subject of subjects) {
    const minutes =
      Number(data.subjectStudyMinutes?.[subject] ?? 0);

    const level =
      Math.floor(minutes / 45) + 1;

    // Lvが低い教科ほど出やすくする
    const weight = Math.max(1, 8 - Math.min(level, 7));

    for (let i = 0; i < weight; i++) {
      weightedPool.push(subject);
    }
  }

  return randomItem(weightedPool);
}

function legacyQuestSubjectKey(value) {
  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/[._+\-]+/g, " ")
    .replace(/\s+/g, " ");
}


function displayQuestSubjectName(subject) {
  if (!subject) return "";

  const raw =
    String(subject).trim();

  const key =
    legacyQuestSubjectKey(raw);

  return (
    LEGACY_QUEST_SUBJECT_JA[key] ||
    raw
  );
}


function questSubjectSystem(subject) {
  const ja =
    displayQuestSubjectName(subject);

  if (
    [
      "数学",
      "国語",
      "地歴公民",
      "理科",
      "英語",
    ].includes(ja)
  ) {
    return ja;
  }

  return (
    SUBJECT_BOSS_SYSTEM[ja] ||
    ""
  );
}


function questSubjectMatches(
  questSubject,
  studiedSubject
) {
  if (!questSubject) return true;

  const questJa =
    displayQuestSubjectName(
      questSubject
    );

  const studiedJa =
    displayQuestSubjectName(
      studiedSubject
    );

  if (questJa === studiedJa) {
    return true;
  }

  const questSystem =
    questSubjectSystem(questJa);

  const studiedSystem =
    questSubjectSystem(studiedJa);

  return Boolean(
    questSystem &&
    studiedSystem &&
    questSystem === studiedSystem
  );
}


function createDailyQuest(data, index) {
  const minutes = randomItem(DAILY_QUEST_MINUTES);

  // 約60%で教科指定、40%で教科指定なし
  const hasSubject =
    Math.random() < 0.6 &&
    Array.isArray(data.selectedSubjects) &&
    data.selectedSubjects.length > 0;

  const subject = hasSubject
    ? chooseWeightedSubject(data)
    : null;

  return {
    id: `daily-${getJstDateKey()}-${index}`,
    minutes,
    subject,
    progress: 0,
    completed: false,
  };
}

async function ensureDailyQuests(user, data) {
  const today = getJstDateKey();

  if (
    data.dailyQuestDate === today &&
    Array.isArray(data.dailyQuests) &&
    data.dailyQuests.length === 3
  ) {
    return data;
  }

  const dailyQuests = [
    createDailyQuest(data, 0),
    createDailyQuest(data, 1),
    createDailyQuest(data, 2),
  ];

  const rareQuest = getRareQuestForToday();

  if (rareQuest) {
    dailyQuests[rareQuest.slot] = rareQuest;
  }

  const ref = doc(db, "users", user.uid);

  await setDoc(
    ref,
    {
      dailyQuestDate: today,
      dailyQuests,
      dailyQuestReplaceUsed: false,
      updatedAt: serverTimestamp(),
    },
    { merge: true }
  );

  return {
    ...data,
    dailyQuestDate: today,
    dailyQuests,
    dailyQuestReplaceUsed: false,
  };
}

function dailyQuestReward(minutes) {
  const rewards = {
    15: { xp: 50, coins: 100 },
    30: { xp: 100, coins: 200 },
    45: { xp: 150, coins: 300 },
    60: { xp: 200, coins: 400 },
  };

  return rewards[minutes] || { xp: 0, coins: 0 };
}

let timerState = {
  subject: "",
  xpItem: "",
  startedAt: null,
  elapsedBeforePause: 0,
  paused: false,

  studyLinkRankEligibleMs: 0,
  studyLinkRankEligibleStartedAt: null,

  studyLinkEligibleMsByBoost: {
    0: 0,
    1: 0,
    2: 0,
    3: 0,
  },

  studyLinkEligibleBoostLevel: 0,
  studyLinkCurrentBoostLevel: 0,

  intervalId: null,
};

function formatTimer(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const h = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
  const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
  const sec = String(totalSeconds % 60).padStart(2, "0");
  return `${h}:${m}:${sec}`;
}

function currentElapsedMs() {
  if (!timerState.startedAt) return timerState.elapsedBeforePause;

  if (timerState.paused) {
    return timerState.elapsedBeforePause;
  }

  return timerState.elapsedBeforePause + (Date.now() - timerState.startedAt);
}

function stopTimerInterval() {
  if (timerState.intervalId) {
    clearInterval(timerState.intervalId);
    timerState.intervalId = null;
  }
}

function startTimerInterval() {
  stopTimerInterval();

  timerState.intervalId = setInterval(() => {
    const el = $("timer-display");
    if (el) {
      el.textContent = formatTimer(currentElapsedMs());
    }
  }, 500);
}

    page(
      card(`
        <h1 style="margin:0">勉強記録の確認</h1>

        <p>教科：<strong>${timerState.subject}</strong></p>
        <p>勉強時間：<strong>${totalMinutes}分</strong></p>

        ${
          timerState.xpItem
            ? `<p>使用アイテム：<strong>${timerState.xpItem}</strong></p>`
            : ""
        }

        <button id="timer-confirm" style="${buttonStyle(true)}">
          この内容で保存
        </button>

        <button id="timer-cancel" style="${buttonStyle(false)}">
          保存せず戻る
        </button>

        <p id="confirm-error" style="margin:0;color:#ff8b8b"></p>
      `)
    );

    $("timer-cancel").onclick = async () => {
      await clearActiveTimer(user);

      timerState = {
        subject: "",
        xpItem: "",
        startedAt: null,
        elapsedBeforePause: 0,
        paused: false,

        studyLinkRankEligibleMs: 0,
        studyLinkRankEligibleStartedAt: null,

        studyLinkEligibleMsByBoost: {
          0: 0,
          1: 0,
          2: 0,
          3: 0,
        },

        studyLinkEligibleBoostLevel: 0,
        studyLinkCurrentBoostLevel: 0,

        intervalId: null,
      };

      await returnAfterStudyLinkTimerV1(user);
    };

    $("timer-confirm").onclick = async () => {
      try {
        $("confirm-error").textContent = "";

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          throw new Error("ユーザーデータが見つかりません。");
        }

        const current = userSnap.data();

        const inventoryBeforeUse = {
          ...(current.inventory || {}),
        };

        if (timerState.xpItem) {
          const owned =
            Number(inventoryBeforeUse[timerState.xpItem] ?? 0);

          if (owned <= 0) {
            throw new Error(
              "選択したXPアイテムを所持していません。"
            );
          }

          inventoryBeforeUse[timerState.xpItem] =
            owned - 1;
        }

        const newStudyMinutes =
          Number(current.totalStudyMinutes ?? 0) + totalMinutes;

        const newMonthlyStudyMinutes =
          Number(current.monthlyStudyMinutes ?? 0) + totalMinutes;


        // ============================================
        // STUDY LINK RANK BONUS
        //
        // 実際の勉強時間はmonthlyStudyMinutesのまま。
        // LINK ACTIVEだった時間の20%だけ別保存する。
        // ============================================

        const rankCreditedStudyMs =
          Math.max(
            0,
            totalMinutes * 60 * 1000
          );


        // ============================================
        // STUDY LINK RANK BONUS
        //
        // NORMAL    x1.20  -> +20%
        // BOOST I   x1.30  -> +30%
        // BOOST II  x1.40  -> +40%
        // BOOST III x1.50  -> +50%
        // ============================================

        const studyLinkRankMsByBoost =
          getStudyLinkEligibleTimeMsByBoostV1();


        const rawStudyLinkRankEligibleMs =
          [0, 1, 2, 3].reduce(
            (sum, level) => {

              return (
                sum +
                Math.max(
                  0,
                  Number(
                    studyLinkRankMsByBoost[level] ??
                    0
                  )
                )
              );

            },
            0
          );


        // 保存される実勉強時間を超えないよう補正
        const studyLinkRankTimeScale =
          rawStudyLinkRankEligibleMs > 0
            ? Math.min(
                1,
                rankCreditedStudyMs /
                rawStudyLinkRankEligibleMs
              )
            : 0;


        const studyLinkRankBonusRates = {
          0: 0.20,
          1: 0.30,
          2: 0.40,
          3: 0.50,
        };


        const studyLinkRankBonusMinutesThisSave =
          Math.round(
            (
              [0, 1, 2, 3].reduce(
                (
                  bonus,
                  level
                ) => {

                  const levelMs =
                    Math.max(
                      0,
                      Number(
                        studyLinkRankMsByBoost[level] ??
                        0
                      )
                    ) *
                    studyLinkRankTimeScale;


                  return (
                    bonus +
                    (
                      levelMs /
                      60000 *
                      studyLinkRankBonusRates[level]
                    )
                  );

                },
                0
              )
            ) *
            10000
          ) /
          10000;


        const newMonthlyStudyLinkBonusMinutes =
          Math.max(
            0,
            Number(
              current.monthlyStudyLinkBonusMinutes ??
              0
            )
          ) +
          studyLinkRankBonusMinutesThisSave;


        const newRankedScoreMinutes =
          newMonthlyStudyMinutes +
          newMonthlyStudyLinkBonusMinutes;


        const newXp =
          Number(current.xp ?? 0) + totalMinutes;

        const subjectStudyMinutes = {
          ...(current.subjectStudyMinutes || {}),
        };

        const previousSubjectMinutes =
          Number(subjectStudyMinutes[timerState.subject] ?? 0);

        subjectStudyMinutes[timerState.subject] =
          previousSubjectMinutes + totalMinutes;

        const subjectLevels = {
          ...(current.subjectLevels || {}),
        };

        subjectLevels[timerState.subject] =
          Math.floor(
            subjectStudyMinutes[timerState.subject] / 45
          ) + 1;

        let questRewardXp = 0;
        let questRewardCoins = 0;

        const dailyQuests = Array.isArray(current.dailyQuests)
          ? current.dailyQuests.map((quest) => {
              if (quest.completed) return quest;

              const subjectMatches =
                !quest.subject ||
                questSubjectMatches(quest.subject, timerState.subject);

              if (!subjectMatches) return quest;

              const newProgress =
                Math.min(
                  Number(quest.progress ?? 0) + totalMinutes,
                  Number(quest.minutes ?? 0)
                );

              const justCompleted =
                newProgress >= Number(quest.minutes ?? 0);

              if (justCompleted && !quest.rewardGranted) {
                if (quest.rare) {
                  if (Number(quest.minutes) === 180) {
                    questRewardXp += 2000;
                    questRewardCoins += 5000;
                  } else {
                    questRewardXp += 1000;
                    questRewardCoins += 2500;
                  }
                } else {
                  const reward =
                    dailyQuestReward(Number(quest.minutes ?? 0));

                  questRewardXp += reward.xp;
                  questRewardCoins += reward.coins;
                }
              }

              return {
                ...quest,
                progress: newProgress,
                completed: justCompleted,
                rewardGranted:
                  justCompleted ? true : Boolean(quest.rewardGranted),
              };
            })
          : [];

        const currentWeekKey = getJstWeekKey();

        const weeklyBaseProgress =
          current.weeklyQuestWeekKey === currentWeekKey
            ? Number(current.weeklyQuestProgress ?? 0)
            : 0;

        const weeklyQuestProgress =
          Math.min(weeklyBaseProgress + totalMinutes, 600);

        const weeklyQuestCompleted =
          weeklyQuestProgress >= 600;

        const weeklyWasAlreadyGranted =
          current.weeklyQuestWeekKey === currentWeekKey &&
          Boolean(current.weeklyQuestRewardGranted);

        const weeklyJustCompleted =
          weeklyQuestCompleted && !weeklyWasAlreadyGranted;

        const weeklyRewardXp =
          weeklyJustCompleted ? 1000 : 0;

        const weeklyRewardCoins =
          weeklyJustCompleted ? 2500 : 0;

        const WEEKLY_RANDOM_ITEMS = [
          "経験の書",
          "上級経験の書",
          "極経験の書",
          "長時間経験の書",
          "超長時間経験の書",
          "連続の心得",
          "ボスLvアップ",
          "ボスLvダウン",
          "ランダム弱点追加",
          "選択弱点追加",
        ];

        const inventory = {
          ...inventoryBeforeUse,
        };

        const RARE_RANDOM_ITEMS = [
          "経験の書",
          "上級経験の書",
          "極経験の書",
          "長時間経験の書",
          "超長時間経験の書",
          "連続の心得",
          "ボスLvアップ",
          "ボスLvダウン",
          "ランダム弱点追加",
          "選択弱点追加",
        ];

        const completedRareQuest =
          dailyQuests.find(
            (quest) =>
              quest.rare &&
              quest.completed &&
              quest.rewardGranted &&
              !current.dailyQuests?.find(
                (oldQuest) =>
                  oldQuest.id === quest.id &&
                  oldQuest.rewardGranted
              )
          );

        if (completedRareQuest) {
          const itemCount =
            Number(completedRareQuest.minutes) === 180 ? 3 : 2;

          for (let i = 0; i < itemCount; i++) {
            const itemName =
              RARE_RANDOM_ITEMS[
                Math.floor(Math.random() * RARE_RANDOM_ITEMS.length)
              ];

            inventory[itemName] =
              Number(inventory[itemName] ?? 0) + 1;
          }
        }

        if (weeklyJustCompleted) {
          const randomItemName =
            WEEKLY_RANDOM_ITEMS[
              Math.floor(Math.random() * WEEKLY_RANDOM_ITEMS.length)
            ];

          inventory[randomItemName] =
            Number(inventory[randomItemName] ?? 0) + 1;
        }

        const todayKey = getJstDateKey();

        const sameXpDay =
          current.dailyXpDate === todayKey;

        const previousDailyXp =
          sameXpDay
            ? Number(current.dailyXpEarned ?? 0)
            : 0;

        const boostAlreadyActive =
          sameXpDay &&
          Boolean(current.rareXpBoostActive);

        const completedThreeHourRare =
          dailyQuests.some((quest) => {
            if (!quest.rare) return false;
            if (Number(quest.minutes) !== 180) return false;
            if (!quest.completed || !quest.rewardGranted) return false;

            const oldQuest =
              Array.isArray(current.dailyQuests)
                ? current.dailyQuests.find(q => q.id === quest.id)
                : null;

            return !oldQuest?.rewardGranted;
          });

        const studyXpThisSave =
          calculateStudyXp(
            totalMinutes,
            timerState.xpItem
          );


        // ============================================
        // STUDY LINK XP BONUS
        //
        // LINK ACTIVEだった実勉強時間だけ +10%
        // クエストXP / Weekly XPには掛けない。
        //
        // 端数XPはremainderとして次回へ繰り越す。
        // ============================================

        const xpCreditedStudyMs =
          Math.max(
            0,
            totalMinutes * 60 * 1000
          );


        // ============================================
        // STUDY LINK XP BONUS
        //
        // NORMAL    x1.10 -> +10%
        // BOOST I   x1.15 -> +15%
        // BOOST II  x1.20 -> +20%
        // BOOST III x1.25 -> +25%
        //
        // クエストXP / Weekly XPには直接掛けない。
        // 端数XPはremainderとして次回へ繰り越す。
        // ============================================

        const studyLinkXpMsByBoost =
          getStudyLinkEligibleTimeMsByBoostV1();


        const rawStudyLinkXpEligibleMs =
          [0, 1, 2, 3].reduce(
            (sum, level) => {

              return (
                sum +
                Math.max(
                  0,
                  Number(
                    studyLinkXpMsByBoost[level] ??
                    0
                  )
                )
              );

            },
            0
          );


        // tracker時間が保存される実勉強時間を
        // 超えないように補正
        const studyLinkXpTimeScale =
          rawStudyLinkXpEligibleMs > 0
            ? Math.min(
                1,
                xpCreditedStudyMs /
                rawStudyLinkXpEligibleMs
              )
            : 0;


        const studyLinkXpBonusRates = {
          0: 0.10,
          1: 0.15,
          2: 0.20,
          3: 0.25,
        };


        const previousStudyLinkXpRemainder =
          Math.max(
            0,
            Number(
              current.studyLinkXpRemainder ??
              0
            )
          );


        const weightedStudyLinkXpBonus =
          [0, 1, 2, 3].reduce(
            (
              bonus,
              level
            ) => {

              const levelMs =
                Math.max(
                  0,
                  Number(
                    studyLinkXpMsByBoost[level] ??
                    0
                  )
                ) *
                studyLinkXpTimeScale;


              return (
                bonus +
                (
                  levelMs /
                  60000 *
                  studyLinkXpBonusRates[level]
                )
              );

            },
            0
          );


        const rawStudyLinkXpBonus =
          previousStudyLinkXpRemainder +
          weightedStudyLinkXpBonus;


        const studyLinkXpBonusThisSave =
          Math.floor(
            rawStudyLinkXpBonus
          );


        const newStudyLinkXpRemainder =
          rawStudyLinkXpBonus -
          studyLinkXpBonusThisSave;


        const baseXpThisSave =
          studyXpThisSave +
          studyLinkXpBonusThisSave +
          questRewardXp +
          weeklyRewardXp;

        let xpFromThisSave = baseXpThisSave;

        if (boostAlreadyActive) {
          xpFromThisSave = Math.floor(baseXpThisSave * 1.5);
        }

        let rareCompletionBonusXp = 0;

        if (completedThreeHourRare && !boostAlreadyActive) {
          rareCompletionBonusXp =
            Math.floor((previousDailyXp + baseXpThisSave) * 0.5);
        }

        const finalXp =
          Number(current.xp ?? 0) +
          xpFromThisSave +
          rareCompletionBonusXp;

        const newDailyXpEarned =
          previousDailyXp +
          xpFromThisSave +
          rareCompletionBonusXp;

        // ============================================
        // STUDY COINS
        //
        // 通常勉強:
        //   1分 = 5 COINS
        //
        // STUDY LINK:
        //   LINK ACTIVE時間の勉強COINSを +10%
        // ============================================

        const studyCoinsThisSave =
          Math.max(
            0,
            totalMinutes * 5
          );


        const coinCreditedStudyMs =
          Math.max(
            0,
            totalMinutes * 60 * 1000
          );


        // ============================================
        // STUDY LINK GOLD BONUS
        //
        // NORMAL    x1.10 -> +10%
        // BOOST I   x1.15 -> +15%
        // BOOST II  x1.20 -> +20%
        // BOOST III x1.25 -> +25%
        //
        // 通常勉強:
        //   1分 = 5 COINS
        //
        // 端数COINSはremainderとして次回へ繰り越す。
        // ============================================

        const studyLinkCoinMsByBoost =
          getStudyLinkEligibleTimeMsByBoostV1();


        const rawStudyLinkCoinEligibleMs =
          [0, 1, 2, 3].reduce(
            (sum, level) => {

              return (
                sum +
                Math.max(
                  0,
                  Number(
                    studyLinkCoinMsByBoost[level] ??
                    0
                  )
                )
              );

            },
            0
          );


        const studyLinkCoinTimeScale =
          rawStudyLinkCoinEligibleMs > 0
            ? Math.min(
                1,
                coinCreditedStudyMs /
                rawStudyLinkCoinEligibleMs
              )
            : 0;


        const studyLinkCoinBonusRates = {
          0: 0.10,
          1: 0.15,
          2: 0.20,
          3: 0.25,
        };


        const previousStudyLinkCoinRemainder =
          Math.max(
            0,
            Number(
              current.studyLinkCoinRemainder ??
              0
            )
          );


        const weightedStudyLinkCoinBonus =
          [0, 1, 2, 3].reduce(
            (
              bonus,
              level
            ) => {

              const levelMs =
                Math.max(
                  0,
                  Number(
                    studyLinkCoinMsByBoost[level] ??
                    0
                  )
                ) *
                studyLinkCoinTimeScale;


              return (
                bonus +
                (
                  levelMs /
                  60000 *
                  5 *
                  studyLinkCoinBonusRates[level]
                )
              );

            },
            0
          );


        const rawStudyLinkCoinBonus =
          previousStudyLinkCoinRemainder +
          weightedStudyLinkCoinBonus;


        const studyLinkCoinBonusThisSave =
          Math.floor(
            rawStudyLinkCoinBonus
          );


        const newStudyLinkCoinRemainder =
          rawStudyLinkCoinBonus -
          studyLinkCoinBonusThisSave;


        const coinsEarnedThisSave =
          studyCoinsThisSave +
          studyLinkCoinBonusThisSave +
          questRewardCoins +
          weeklyRewardCoins;


        const finalCoins =
          Number(
            current.coins ?? 0
          ) +
          coinsEarnedThisSave;

        // ============================================
        // 今日の勉強記録（JST）
        // ============================================

        const sameStudyDay =
          current.dailyStudyDate === todayKey;

        const todayStudyMinutes =
          (sameStudyDay
            ? Number(current.todayStudyMinutes ?? 0)
            : 0
          ) + totalMinutes;

        const todaySubjectStudyMinutes =
          sameStudyDay
            ? {
                ...(current.todaySubjectStudyMinutes || {}),
              }
            : {};

        todaySubjectStudyMinutes[timerState.subject] =
          Number(
            todaySubjectStudyMinutes[timerState.subject] ?? 0
          ) + totalMinutes;

        // ============================================
        // 3時間レアクエスト履歴
        // ============================================

        const rareHistory =
          Array.isArray(current.rareHistory)
            ? [...current.rareHistory]
            : [];

        if (
          completedThreeHourRare &&
          !boostAlreadyActive &&
          !rareHistory.some(entry =>
            entry.dateKey === todayKey &&
            Number(entry.targetMinutes || 0) === 180
          )
        ) {
          rareHistory.push({
            dateKey: todayKey,
            targetMinutes: 180,
          });
        }

        const rareXpBoostActive =
          boostAlreadyActive || completedThreeHourRare;

        const sameRewardDay =
          current.dailyRewardFlagDate === todayKey;

        const todayEarnedXpFlag =
          (sameRewardDay
            ? current.todayEarnedXpFlag === true
            : false
          ) ||
          (
            xpFromThisSave +
            rareCompletionBonusXp
          ) > 0;

        const todayEarnedCoinsFlag =
          (sameRewardDay
            ? current.todayEarnedCoinsFlag === true
            : false
          ) ||
          coinsEarnedThisSave > 0;

        const previousInventory =
          current.inventory || {};

        const itemEarnedThisSave =
          Object.keys(inventory).some(name =>
            Number(inventory[name] || 0) >
            Number(previousInventory[name] || 0)
          );

        const todayEarnedItemFlag =
          (sameRewardDay
            ? current.todayEarnedItemFlag === true
            : false
          ) ||
          itemEarnedThisSave;

        await setDoc(
          userRef,
          {
            totalStudyMinutes: newStudyMinutes,

            monthlyStudyMinutes:
              newMonthlyStudyMinutes,

            monthlyStudyLinkBonusMinutes:
              newMonthlyStudyLinkBonusMinutes,

            rankedScoreMinutes:
              newRankedScoreMinutes,

            xp: finalXp,
            coins: finalCoins,

            lifetimeCoinsEarned:
              Number(
                current.lifetimeCoinsEarned ?? 0
              ) +
              coinsEarnedThisSave,

            studyLinkCoinRemainder:
              newStudyLinkCoinRemainder,

            dailyXpDate: todayKey,
            dailyXpEarned: newDailyXpEarned,

            studyLinkXpRemainder:
              newStudyLinkXpRemainder,

            rareXpBoostActive,

            dailyStudyDate: todayKey,
            todayStudyMinutes,
            todaySubjectStudyMinutes,

            dailyRewardFlagDate: todayKey,
            todayEarnedXpFlag,
            todayEarnedCoinsFlag,
            todayEarnedItemFlag,

            rareHistory,

            subjectStudyMinutes,
            subjectLevels,
            dailyQuests,

            weeklyQuestWeekKey: currentWeekKey,
            weeklyQuestProgress,
            weeklyQuestCompleted,
            weeklyQuestRewardGranted:
              weeklyWasAlreadyGranted || weeklyJustCompleted,

            inventory,

            updatedAt: serverTimestamp(),
          },
          { merge: true }
        );

        // ------------------------------
        // ボスダメージ
        // ------------------------------

        const cycle = getPartyCycleInfo();

        if (
          cycle.phase === "boss" &&
          totalMinutes > 0
        ) {
          const party = await getMyParty(user);

          if (party) {
            const latestPartySnap =
              await getDoc(
                doc(db, "parties", party.id)
              );

            if (latestPartySnap.exists()) {
              const latestParty =
                latestPartySnap.data();

              if (
                latestParty.boss &&
                !latestParty.boss.defeated
              ) {
                const subjectSystem =
                  getBossSystemForSubject(
                    timerState.subject
                  );

                const addedWeaknessSubjects =
                  Array.isArray(latestParty.addedWeaknessSubjects)
                    ? latestParty.addedWeaknessSubjects
                    : [];

                const isSystemWeakness =
                  subjectSystem &&
                  subjectSystem ===
                    latestParty.boss.weaknessSystem;

                const isAddedWeakness =
                  addedWeaknessSubjects.includes(
                    timerState.subject
                  );

                const isWeakness =
                  isSystemWeakness || isAddedWeakness;

                const damagePerMinute =
                  isWeakness ? 150 : 100;


                // ============================================
                // STUDY LINK BOSS BONUS
                //
                // BASE:
                //   NORMAL   100 / min
                //   WEAKNESS 150 / min
                //
                // LINK ACTIVE区間のみ +15%
                // ============================================

                const baseBossDamage =
                  totalMinutes *
                  damagePerMinute;


                const bossCreditedStudyMs =
                  Math.max(
                    0,
                    totalMinutes * 60 * 1000
                  );


                // ============================================
                // STUDY LINK BOSS BONUS
                //
                // NORMAL    x1.15 -> +15%
                // BOOST I   x1.25 -> +25%
                // BOOST II  x1.35 -> +35%
                // BOOST III x1.50 -> +50%
                //
                // damagePerMinute:
                //   NORMAL   100 / min
                //   WEAKNESS 150 / min
                //
                // 弱点倍率適用後のdamagePerMinuteへ
                // LINK BONUSを掛ける。
                // ============================================

                const studyLinkBossMsByBoost =
                  getStudyLinkEligibleTimeMsByBoostV1();


                const rawStudyLinkBossEligibleMs =
                  [0, 1, 2, 3].reduce(
                    (sum, level) => {

                      return (
                        sum +
                        Math.max(
                          0,
                          Number(
                            studyLinkBossMsByBoost[level] ??
                            0
                          )
                        )
                      );

                    },
                    0
                  );


                const studyLinkBossTimeScale =
                  rawStudyLinkBossEligibleMs > 0
                    ? Math.min(
                        1,
                        bossCreditedStudyMs /
                        rawStudyLinkBossEligibleMs
                      )
                    : 0;


                const studyLinkBossBonusRates = {
                  0: 0.15,
                  1: 0.25,
                  2: 0.35,
                  3: 0.50,
                };


                const previousStudyLinkBossDamageRemainder =
                  Math.max(
                    0,
                    Number(
                      current.studyLinkBossDamageRemainder ??
                      0
                    )
                  );


                const weightedStudyLinkBossDamageBonus =
                  [0, 1, 2, 3].reduce(
                    (
                      bonus,
                      level
                    ) => {

                      const levelMs =
                        Math.max(
                          0,
                          Number(
                            studyLinkBossMsByBoost[level] ??
                            0
                          )
                        ) *
                        studyLinkBossTimeScale;


                      return (
                        bonus +
                        (
                          levelMs /
                          60000 *
                          damagePerMinute *
                          studyLinkBossBonusRates[level]
                        )
                      );

                    },
                    0
                  );


                const rawStudyLinkBossDamageBonus =
                  previousStudyLinkBossDamageRemainder +
                  weightedStudyLinkBossDamageBonus;


                const studyLinkBossDamageBonusThisSave =
                  Math.floor(
                    rawStudyLinkBossDamageBonus
                  );


                const newStudyLinkBossDamageRemainder =
                  rawStudyLinkBossDamageBonus -
                  studyLinkBossDamageBonusThisSave;


                const damage =
                  baseBossDamage +
                  studyLinkBossDamageBonusThisSave;

                const oldHp =
                  Number(
                    latestParty.boss.currentHp ?? 0
                  );

                const newHp =
                  Math.max(0, oldHp - damage);

                const defeated =
                  newHp <= 0;

                const contributions = {
                  ...(latestParty.bossContributions || {}),
                };

                contributions[user.uid] =
                  Number(contributions[user.uid] ?? 0) +
                  damage;

                await setDoc(
                  doc(db, "parties", party.id),
                  {
                    boss: {
                      ...latestParty.boss,
                      currentHp: newHp,
                      defeated,
                    },

                    bossContributions: contributions,

                    updatedAt: serverTimestamp(),
                  },
                  { merge: true }
                );

                // ============================================
                // ボス戦績：参加 / 弱点攻撃
                // ============================================

                const bossStatsUserSnap =
                  await getDoc(userRef);

                if (bossStatsUserSnap.exists()) {
                  const bossStatsUserData =
                    bossStatsUserSnap.data();

                  const bossStats = {
                    ...(bossStatsUserData.bossStats || {}),
                  };

                  const participatedBossKeys =
                    Array.isArray(bossStats.participatedBossKeys)
                      ? [...bossStats.participatedBossKeys]
                      : [];

                  const participationKey =
                    `${latestParty.bossCycleKey || cycle.cycleKey}_${party.id}`;

                  if (
                    !participatedBossKeys.includes(
                      participationKey
                    )
                  ) {
                    participatedBossKeys.push(
                      participationKey
                    );

                    bossStats.participation =
                      Number(bossStats.participation || 0) + 1;
                  }

                  bossStats.participatedBossKeys =
                    participatedBossKeys;

                  if (isWeakness && damage > 0) {
                    bossStats.weakHits =
                      Number(bossStats.weakHits || 0) + 1;
                  }

                  await setDoc(
                    userRef,
                    {
                      bossStats,

                      studyLinkBossDamageRemainder:
                        newStudyLinkBossDamageRemainder,

                      updatedAt: serverTimestamp(),
                    },
                    { merge: true }
                  );
                }
              }
            }
          }
        }

        await checkAllTitles(user);

        await clearActiveTimer(user);

        timerState = {
          subject: "",
          xpItem: "",
          startedAt: null,
          elapsedBeforePause: 0,
          paused: false,

          studyLinkRankEligibleMs: 0,
          studyLinkRankEligibleStartedAt: null,

          studyLinkEligibleMsByBoost: {
            0: 0,
            1: 0,
            2: 0,
            3: 0,
          },

          studyLinkEligibleBoostLevel: 0,
          studyLinkCurrentBoostLevel: 0,

          intervalId: null,
        };

        await returnAfterStudyLinkTimerV1(user);
      } catch (error) {
        $("confirm-error").textContent =
          error?.message || "保存に失敗しました。";
      }
    };
  };
}



// ASCEND PARTY FRIENDS FIXED DOM START

/*
  ============================================================
  PARTY / FRIENDS / REQUESTS
  FIXED DOM MODE
  ============================================================

  通常の page():
      body
       └ main
          └ section
             を毎回作り直す

  この3画面内:
      body
       └ main
          └ section   ← 残す
             ├ tabs   ← 残す
             └ 内容だけ交換

  Firebaseロジックには触れない。
*/

let ascendPartyFriendsSoftRender = false;


/*
  元のpage()を保存
*/
const ascendOriginalPage =
  page;


/*
  page()をラップ
*/
page = function(content) {

  /*
    PARTY / FRIENDS内部以外では
    今までのpage()をそのまま使う
  */
  if (!ascendPartyFriendsSoftRender) {

    return ascendOriginalPage(
      content
    );

  }


  const section =
    document.querySelector(
      "body > main > section"
    );


  const tabs =
    document.getElementById(
      "party-main-tabs"
    );


  /*
    想定しているDOMじゃなければ
    安全のため通常描画へフォールバック
  */
  if (
    !section ||
    !tabs ||
    tabs.parentElement !== section
  ) {

    return ascendOriginalPage(
      content
    );

  }


  /*
    card(...)で渡されたHTMLを
    一旦メモリ上だけで解析
  */
  const template =
    document.createElement(
      "template"
    );


  template.innerHTML =
    String(content ?? "")
      .trim();


  const incomingSection =
    template.content.querySelector(
      "section"
    );


  if (!incomingSection) {

    return ascendOriginalPage(
      content
    );

  }


  /*
    新しい中身をFragmentへ移動
  */
  const fragment =
    document.createDocumentFragment();


  while (
    incomingSection.firstChild
  ) {

    fragment.appendChild(
      incomingSection.firstChild
    );

  }


  /*
    ★ATOMIC SWAP

    旧版のように1要素ずつ削除すると、
    途中状態をSafariが描画して
    UIが一瞬崩れることがある。

    tabs + 新しい内容を
    1回のDOM操作で置換する。
  */
  /*
    タブを先頭に置くと、
    mountPartyFriendsTabs() が呼ばれるまで

      tabs
      h1

    の順番になり一瞬レイアウトが崩れる。

    最初から

      h1
      tabs
      content

    の完成形で一発挿入する。
  */

  const finalFragment =
    document.createDocumentFragment();

  let tabsInserted = false;


  while (fragment.firstChild) {

    const node =
      fragment.firstChild;

    finalFragment.appendChild(
      node
    );


    if (
      !tabsInserted &&
      node.nodeType === Node.ELEMENT_NODE &&
      node.matches?.("h1")
    ) {

      finalFragment.appendChild(
        tabs
      );

      tabsInserted = true;

    }

  }


  /*
    h1が無い特殊ケースだけ先頭へ
  */
  if (!tabsInserted) {

    finalFragment.prepend(
      tabs
    );

  }


  section.replaceChildren(
    finalFragment
  );


  /*
    タブ切替時は上へ
  */
  section.scrollTop = 0;


  return;

};


/*
  元のPARTY/Friend routerを保存
*/
const ascendOriginalShowPartyFriendsMainPage =
  showPartyFriendsMainPage;


/*
  routerをラップ
*/
showPartyFriendsMainPage =
  async function(
    user,
    tab = "party"
  ) {

    const section =
      document.querySelector(
        "body > main > section"
      );


    const tabs =
      document.getElementById(
        "party-main-tabs"
      );


    /*
      HOME等からPARTYへ初めて入る時は
      従来方式。

      ここではView Transitionも残す。
    */
    const alreadyInsidePartyArea =
      Boolean(
        section &&
        tabs &&
        tabs.parentElement === section
      );


    if (!alreadyInsidePartyArea) {

      return await
        ascendOriginalShowPartyFriendsMainPage(
          user,
          tab
        );

    }


    /*
      ========================================================
      ここから内部タブ切替
      ========================================================
    */

    const previousSoftRender =
      ascendPartyFriendsSoftRender;


    const previousTransitionState =
      partyViewTransitionRunning;


    /*
      page()の全再構築を止める
    */
    ascendPartyFriendsSoftRender =
      true;


    /*
      内部切替ではView Transitionも不要。
      DOM自体が消えないため旧UIちらつきも起こさない。
    */
    partyViewTransitionRunning =
      true;


    section.classList.add(
      "party-friends-fixed-dom"
    );


    try {

      return await
        ascendOriginalShowPartyFriendsMainPage(
          user,
          tab
        );

    }

    finally {

      ascendPartyFriendsSoftRender =
        previousSoftRender;


      partyViewTransitionRunning =
        previousTransitionState;

    }

  };


// ASCEND PARTY FRIENDS FIXED DOM END

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    showAuth();

  try {

<script type="module" id="profile-password-module-v1">

import {
  getAuth,
  EmailAuthProvider,
  reauthenticateWithCredential,
  updatePassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


function mountProfilePasswordUI() {

  const saveButton =
    document.querySelector(".profile-save");

  if (!saveButton) return;

  if (
    document.querySelector(
      ".profile-password-panel"
    )
  ) return;


  const panel =
    document.createElement("div");

  panel.className =
    "profile-password-panel";

  panel.innerHTML = `

    <h3 class="profile-password-title">
      パスワード変更
    </h3>

    <label>
      現在のパスワード

      <input
        id="profile-current-password"
        type="password"
        autocomplete="current-password"
        placeholder="現在のパスワード"
      >
    </label>

    <label>
      新しいパスワード

      <input
        id="profile-new-password"
        type="password"
        autocomplete="new-password"
        placeholder="新しいパスワード"
      >
    </label>

    <label>
      新しいパスワード（確認）

      <input
        id="profile-new-password-confirm"
        type="password"
        autocomplete="new-password"
        placeholder="もう一度入力"
      >
    </label>

    <button
      type="button"
      id="profile-password-save"
    >
      パスワードを変更
    </button>

    <p
      class="profile-password-status"
      id="profile-password-status"
    ></p>

  `;

  saveButton.parentElement.insertBefore(
    panel,
    saveButton
  );
}


/*
  page() が body の中身を差し替えるので
  body直下だけ監視。
  subtree監視はしないので軽量。
*/

const profileObserver =
  new MutationObserver(() => {
    mountProfilePasswordUI();
  });

profileObserver.observe(
  document.body,
  {
    childList:true
  }
);

mountProfilePasswordUI();


document.addEventListener(
  "click",
  async (event) => {

    const button =
      event.target.closest(
        "#profile-password-save"
      );

    if (!button) return;


    const currentInput =
      document.querySelector(
        "#profile-current-password"
      );

    const newInput =
      document.querySelector(
        "#profile-new-password"
      );

    const confirmInput =
      document.querySelector(
        "#profile-new-password-confirm"
      );

    const status =
      document.querySelector(
        "#profile-password-status"
      );


    const currentPassword =
      currentInput?.value ?? "";

    const newPassword =
      newInput?.value ?? "";

    const confirmPassword =
      confirmInput?.value ?? "";


    status.style.color = "#9da6b7";


    if (
      !currentPassword ||
      !newPassword ||
      !confirmPassword
    ) {
      status.textContent =
        "すべて入力してください。";

      return;
    }


    if (newPassword.length < 6) {
      status.textContent =
        "新しいパスワードは6文字以上にしてください。";

      return;
    }


    if (
      newPassword !==
      confirmPassword
    ) {
      status.textContent =
        "新しいパスワードが一致していません。";

      return;
    }


    button.disabled = true;

    status.textContent =
      "変更中…";


    try {

      const auth = getAuth();

      const user =
        auth.currentUser;


      if (
        !user ||
        !user.email
      ) {
        throw new Error(
          "NO_LOGIN_USER"
        );
      }


      /*
        現在のパスワードで本人確認
      */

      const credential =
        EmailAuthProvider.credential(
          user.email,
          currentPassword
        );


      await reauthenticateWithCredential(
        user,
        credential
      );


      /*
        Firebase Auth のパスワード更新
      */

      await updatePassword(
        user,
        newPassword
      );


      currentInput.value = "";
      newInput.value = "";
      confirmInput.value = "";


      status.style.color =
        "#59f0b5";

      status.textContent =
        "✓ パスワードを変更しました。";


    } catch (error) {

      console.error(
        "password change error:",
        error
      );


      status.style.color =
        "#ff7b8b";


      if (
        error?.code ===
        "auth/invalid-credential" ||
        error?.code ===
        "auth/wrong-password"
      ) {

        status.textContent =
          "現在のパスワードが違います。";


      } else if (
        error?.code ===
        "auth/weak-password"
      ) {

        status.textContent =
          "新しいパスワードが弱すぎます。";


      } else if (
        error?.code ===
        "auth/too-many-requests"
      ) {

        status.textContent =
          "試行回数が多すぎます。少し時間を置いてください。";


      } else if (
        error?.code ===
        "auth/requires-recent-login"
      ) {

        status.textContent =
          "一度ログアウトして再ログインしてから変更してください。";


      } else {

        status.textContent =
          "パスワードを変更できませんでした。";

      }

    } finally {

      button.disabled = false;

    }

  }
);

</script>

<style id="safe-intense-neon-v7b">

/* =========================================================
   SAFE INTENSE NEON
   背景・枠線・グラデーションには触らない
========================================================= */

:root {
  --safe-purple:#9b7cff;
  --safe-cyan:#35d9ff;
  --safe-pink:#ff5cac;
  --safe-green:#45e0a3;
  --safe-gold:#ffd35c;
}


/* ===== 見出し ===== */

.screen-header h2,
body > main > section h1 {
  color:#f8f5ff !important;

  text-shadow:
    0 0 10px rgba(155,124,255,.38);
}


/* ===== HOME ===== */

.home-player-title {
  color:#c6b5ff !important;
}

.home-player-level strong {
  color:#b89cff !important;

  text-shadow:
    0 0 12px rgba(155,124,255,.42);
}

.home-player-avatar {
  color:#d8ccff !important;
}

.home-xp-fill {
  background:#8f6fff !important;

  box-shadow:
    0 0 10px rgba(143,111,255,.45) !important;
}

.home-study-time {
  color:#ddf9ff !important;

  text-shadow:
    0 0 13px rgba(53,217,255,.30);
}


/* ===== QUEST ===== */

#quest-main-tabs button.active {
  color:#fff !important;
  background-color:rgba(155,124,255,.28) !important;

  text-shadow:
    0 0 8px rgba(155,124,255,.40);

  box-shadow:none !important;
}


/* ===== PARTY ===== */

#party-main-tabs button.active {
  color:#fff !important;
  background-color:rgba(53,217,255,.20) !important;

  text-shadow:
    0 0 8px rgba(53,217,255,.35);

  box-shadow:none !important;
}


/* ===== SHOP ===== */

.shop-tab.active {
  color:#fff !important;
  background-color:rgba(155,124,255,.30) !important;

  box-shadow:none !important;
}

.shop-buy {
  background:#7658e8 !important;
}


/* ===== LOCKER ===== */

.locker-action {
  background:#7257db !important;
}

.locker-reserved strong {
  color:#cbbcff !important;
}


/* ===== PROFILE ===== */

.subject-chip.active {
  color:#fff !important;

  background-color:
    rgba(155,124,255,.30) !important;

  box-shadow:none !important;
}

.profile-track-btn.active {
  color:#fff !important;

  background-color:
    rgba(53,217,255,.20) !important;

  box-shadow:none !important;
}

.profile-save {
  background:#7658e8 !important;
}


/* ===== OTHER ===== */

.other-card:nth-child(1) .other-card-icon {
  color:var(--safe-cyan) !important;
  background-color:rgba(53,217,255,.14) !important;
}

.other-card:nth-child(2) .other-card-icon {
  color:var(--safe-purple) !important;
  background-color:rgba(155,124,255,.16) !important;
}

.other-card:nth-child(3) .other-card-icon {
  color:var(--safe-green) !important;
  background-color:rgba(69,224,163,.13) !important;
}

.other-card:nth-child(4) .other-card-icon {
  color:var(--safe-gold) !important;
  background-color:rgba(255,211,92,.13) !important;
}


/* ===== 軽量操作感 ===== */

body > main > section button {
  transition:
    transform 90ms ease,
    filter 90ms ease !important;
}

@media (hover:hover) {
  body > main > section button:not(:disabled):hover {
    filter:
      brightness(1.10)
      saturate(1.15);
  }
}

body > main > section button:not(:disabled):active {
  transform:scale(.985);
}


/* ===== ページ切替 ===== */

body > main > section {
  animation:
    safeFadeIn
    140ms ease-out both;
}

@keyframes safeFadeIn {
  from {
    opacity:.55;
  }

  to {
    opacity:1;
  }
}

</style>

<script id="ranked-dom-check">
setTimeout(()=>{
 const e=document.getElementById("home-player-status");
 if(!e)return;
 const d=document.createElement("div");
 d.id="ranked-dom-result";
 d.textContent=`RANKED=${e.dataset.rankedActive} / ${e.dataset.rankedFamily}`;
 d.style="color:#0f0;font-size:10px;padding:4px";
 e.prepend(d);
},500);
</script>
