    `;


    const toggle =
      panel.querySelector(
        "#study-link-invite-toggle-v1"
      );


    const list =
      panel.querySelector(
        "#study-link-invite-list-v1"
      );


    toggle.onclick =
      () => {

        list.hidden =
          !list.hidden;

      };


    try {

      const friendshipQueryA =
        query(
          collection(
            db,
            "friends"
          ),
          where(
            "userA",
            "==",
            user.uid
          )
        );


      const friendshipQueryB =
        query(
          collection(
            db,
            "friends"
          ),
          where(
            "userB",
            "==",
            user.uid
          )
        );


      const [
        friendSnapA,
        friendSnapB,
        memberSnap
      ] =
        await Promise.all([
          getDocs(
            friendshipQueryA
          ),
          getDocs(
            friendshipQueryB
          ),
          getDocs(
            collection(
              db,
              "studyLinkRooms",
              code,
              "members"
            )
          )
        ]);


      const friendUids =
        new Set();


      friendSnapA.docs.forEach(
        d => {

          const data =
            d.data();

          if (data.userB) {
            friendUids.add(
              data.userB
            );
          }

        }
      );


      friendSnapB.docs.forEach(
        d => {

          const data =
            d.data();

          if (data.userA) {
            friendUids.add(
              data.userA
            );
          }

        }
      );


      const memberUids =
        new Set(
          memberSnap.docs.map(
            d => d.id
          )
        );


      if (!friendUids.size) {

        list.innerHTML = `
          <div style="
            color:#667286;
            font-size:10px;
          ">
            フレンドがいません
          </div>
        `;

        return;

      }


      const friends =
        await Promise.all(
          [...friendUids].map(
            async uid => {

              const snap =
                await getDoc(
                  doc(
                    db,
                    "users",
                    uid
                  )
                );


              if (!snap.exists()) {
                return null;
              }


              return {
                uid,
                data:
                  snap.data()
              };

            }
          )
        );


      list.innerHTML =
        friends
          .filter(Boolean)
          .map(
            friend => {

              const inRoom =
                memberUids.has(
                  friend.uid
                );


              return `
                <div
                  class="study-link-invite-friend-v1"
                >
                  <strong>
                    ${escapeStudyLinkInviteHtmlV1(
                      friend.data.username ??
                      friend.data.displayName ??
                      "ユーザー"
                    )}
                  </strong>

                  <button
                    type="button"
                    data-study-link-invite="${friend.uid}"
                    ${inRoom ? "disabled" : ""}
                  >
                    ${inRoom ? "IN ROOM" : "INVITE"}
                  </button>
                </div>
              `;

            }
          )
          .join("");


      const own =
        await getStudyLinkV2User(
          user
        );


      const fromUsername =
        String(
          own.data.username ??
          own.data.displayName ??
          "PLAYER"
        );


      list
        .querySelectorAll(
          "[data-study-link-invite]"
        )
        .forEach(
          button => {

            button.onclick =
              async () => {

                const toUid =
                  button.dataset
                    .studyLinkInvite;


                button.disabled =
                  true;

                button.textContent =
                  "SENDING";


                try {

                  await setDoc(
                    doc(
                      db,
                      "studyLinkInvites",
                      `${code}_${toUid}`
                    ),
                    {
                      roomCode:code,
                      fromUid:user.uid,
                      fromUsername,
                      toUid,
                      createdAt:
                        serverTimestamp()
                    },
                    {
                      merge:true
                    }
                  );


                  button.textContent =
                    "SENT";

                }

                catch (error) {

                  console.error(
                    error
                  );

                  button.disabled =
                    false;

                  button.textContent =
                    "INVITE";

                  setStatus(
                    "招待の送信に失敗しました",
                    "error"
                  );

                }

              };

          }
        );

    }

    catch (error) {

      console.error(
        error
      );

      list.innerHTML = `
        <div style="
          color:#ff8b8b;
          font-size:10px;
        ">
          フレンドを読み込めません
        </div>
      `;

    }

  }


  async function renderStudyLinkIncomingInvitesV1() {

    let panel =
      document.getElementById(
        "study-link-incoming-invites-v1"
      );


    if (!panel) {

      panel =
        document.createElement(
          "section"
        );

      panel.id =
        "study-link-incoming-invites-v1";

      lobby.appendChild(
        panel
      );

    }


    try {

      const inviteQuery =
        query(
          collection(
            db,
            "studyLinkInvites"
          ),
          where(
            "toUid",
            "==",
            user.uid
          )
        );


      const inviteSnap =
        await getDocs(
          inviteQuery
        );


      if (!inviteSnap.size) {

        panel.hidden =
          true;

        return;

      }


      panel.hidden =
        false;


      panel.innerHTML = `
        <div
          class="study-link-incoming-title-v1"
        >
          ROOM INVITES
        </div>

        ${
          inviteSnap.docs.map(
            inviteDoc => {

              const invite =
                inviteDoc.data();


              return `
                <div
                  class="study-link-incoming-card-v1"
                >

                  <div
                    class="study-link-incoming-user-v1"
                  >
                    <strong>
                      ${escapeStudyLinkInviteHtmlV1(
                        invite.fromUsername ??
                        "PLAYER"
                      )}
                    </strong>

                    <span>
                      ROOM ${escapeStudyLinkInviteHtmlV1(
                        invite.roomCode ??
                        "------"
                      )}
                    </span>
                  </div>

                  <button
                    type="button"
                    class="study-link-incoming-join-v1"
                    data-study-link-join-invite="${invite.roomCode ?? ""}"
                  >
                    JOIN
                  </button>

                  <button
                    type="button"
                    class="study-link-incoming-decline-v1"
                    data-study-link-decline-invite="${inviteDoc.id}"
                  >
                    ×
                  </button>

                </div>
              `;

            }
          ).join("")
        }
      `;


      panel
        .querySelectorAll(
          "[data-study-link-join-invite]"
        )
        .forEach(
          button => {

            button.onclick =
              () => {

                const code =
                  normalizeStudyLinkV2Code(
                    button.dataset
                      .studyLinkJoinInvite ??
                    ""
                  );


                input.value =
                  code;


                join.click();

              };

          }
        );


      panel
        .querySelectorAll(
          "[data-study-link-decline-invite]"
        )
        .forEach(
          button => {

            button.onclick =
              async () => {

                await deleteDoc(
                  doc(
                    db,
                    "studyLinkInvites",
                    button.dataset
                      .studyLinkDeclineInvite
                  )
                );


                await renderStudyLinkIncomingInvitesV1();

              };

          }
        );

    }

    catch (error) {

      console.warn(
        "STUDY LINK INVITES:",
        error
      );

      panel.hidden =
        true;

    }

  }


  async function render() {

    const own =
      await getStudyLinkV2User(
        user
      );

    const code =
      normalizeStudyLinkV2Code(
        own.data.studyLinkRoomCode ||
        ""
      );


    if (!code) {

      stopStudyLinkStatusPollingV1();

      disableStudyLinkRoomModeV1();

      lobby.classList.remove(
        "hidden"
      );

      active.classList.add(
        "hidden"
      );

      roomCode.textContent =
        "------";

      await renderStudyLinkIncomingInvitesV1();

      return;

    }


    const roomSnap =
      await getDoc(
        studyLinkV2RoomRef(code)
      );


    if (!roomSnap.exists()) {

      await setDoc(
        own.ref,
        {
          studyLinkRoomCode:""
        },
        {
          merge:true
        }
      );

      lobby.classList.remove(
        "hidden"
      );

      active.classList.add(
        "hidden"
      );

      await renderStudyLinkIncomingInvitesV1();

      return;

    }


    lobby.classList.add(
      "hidden"
    );

    active.classList.remove(
      "hidden"
    );

    roomCode.textContent =
      code;

    enableStudyLinkRoomModeV1(
      code
    );

    await mountStudyLinkRoomTimerV1(
      user,
      code
    );

    await mountStudyLinkStatusV1(
      user,
      code
    );

    await mountStudyLinkBoostFundV1(
      user,
      code
    );

    await renderStudyLinkMembersV2(
      code,
      user
    );

    await renderStudyLinkFriendInvitesV1(
      code
    );

  }


  input.oninput =
    () => {

      input.value =
        normalizeStudyLinkV2Code(
          input.value
        );

    };


  create.onclick =
    async () => {

      create.disabled = true;

      setStatus(
        "ルーム作成中..."
      );

      try {

        const own =
          await getStudyLinkV2User(
            user
          );

        let code = "";
        let ref = null;


        for (
          let i = 0;
          i < 12;
          i++
        ) {

          const candidate =
            generateStudyLinkV2Code();

          const candidateRef =
            studyLinkV2RoomRef(
              candidate
            );

          const snap =
            await getDoc(
              candidateRef
            );

          if (!snap.exists()) {

            code =
              candidate;

            ref =
              candidateRef;

            break;

          }

        }


        if (!ref) {

          throw new Error(
            "ROOM CODEを作成できませんでした"
          );

        }


        const username =
          String(
            own.data.username ||
            own.data.displayName ||
            "PLAYER"
          );


        await setDoc(
          ref,
          {
            code,
            createdBy:user.uid,
            createdAt:
              serverTimestamp(),

            active:true,

            boostPool:0,
            boostTargetLevel:1,
            boostActiveLevel:0,
            boostActiveUntil:0
          }
        );


        await setDoc(
          studyLinkV2MemberRef(
            code,
            user.uid
          ),
          {
            uid:user.uid,
            username,
            state:"idle",
            joinedAt:
              serverTimestamp()
          }
        );


        await setDoc(
          own.ref,
          {
            studyLinkRoomCode:code
          },
          {
            merge:true
          }
        );


        await render();

        setStatus(
          `ROOM ${code} を作成しました`,
          "success"
        );

      }

      catch (error) {

        console.error(error);

        setStatus(
          error?.message ||
          "ルーム作成に失敗しました",
          "error"
        );

      }

      finally {

        create.disabled = false;

      }

    };


  join.onclick =
    async () => {

      const code =
        normalizeStudyLinkV2Code(
          input.value
        );


      if (code.length !== 6) {

        setStatus(
          "6桁のROOM CODEを入力してください",
          "error"
        );

        return;

      }


      join.disabled = true;


      try {

        const roomSnap =
          await getDoc(
            studyLinkV2RoomRef(
              code
            )
          );


        if (!roomSnap.exists()) {

          throw new Error(
            "ルームが見つかりません"
          );

        }


        const own =
          await getStudyLinkV2User(
            user
          );

        const username =
          String(
            own.data.username ||
            own.data.displayName ||
            "PLAYER"
          );


        await setDoc(
          studyLinkV2MemberRef(
            code,
            user.uid
          ),
          {
            uid:user.uid,
            username,
            state:"idle",
            joinedAt:
              serverTimestamp()
          },
          {
            merge:true
          }
        );


        await setDoc(
          own.ref,
          {
            studyLinkRoomCode:code
          },
          {
            merge:true
          }
        );


        try {

          await deleteDoc(
            doc(
              db,
              "studyLinkInvites",
              `${code}_${user.uid}`
            )
          );

        }

        catch {}


        await render();

        setStatus(
          `ROOM ${code} に参加しました`,
          "success"
        );

      }

      catch (error) {

        console.error(error);

        setStatus(
          error?.message ||
          "参加に失敗しました",
          "error"
        );

      }

      finally {

        join.disabled = false;

      }

    };


  input.onkeydown =
    event => {

      if (
        event.key === "Enter"
      ) {

        join.click();

      }

    };


  copy.onclick =
    async () => {

      const code =
        roomCode.textContent.trim();

      try {

        await navigator.clipboard
          .writeText(code);

        setStatus(
          "ROOM CODEをコピーしました",
          "success"
        );

      }

      catch {

        setStatus(code);

      }

    };


  leave.onclick =
    async () => {

      const code =
        roomCode.textContent.trim();


      try {

        await deleteDoc(
          studyLinkV2MemberRef(
            code,
            user.uid
          )
        );

      }

      catch (error) {

        console.warn(error);

      }


      await setDoc(
        doc(
          db,
          "users",
          user.uid
        ),
        {
          studyLinkRoomCode:""
        },
        {
          merge:true
        }
      );


      disableStudyLinkRoomModeV1();

      await render();

      await showStudyMainPage(
        user
      );

    };


  await render();


  if (
    window.__studyLinkInvitePollV1
  ) {

    clearInterval(
      window.__studyLinkInvitePollV1
    );

  }


  window.__studyLinkInvitePollV1 =
    setInterval(
      async () => {

        const liveCard =
          document.getElementById(
            "study-link-card-v2"
          );


        if (
          !liveCard ||
          !liveCard.isConnected
        ) {

          clearInterval(
            window.__studyLinkInvitePollV1
          );

          window.__studyLinkInvitePollV1 =
            null;

          return;

        }


        if (
          !lobby.classList.contains(
            "hidden"
          )
        ) {

          await renderStudyLinkIncomingInvitesV1();

        }

      },
      3000
    );


  const memberRefreshTimer =
    setInterval(
      async () => {

        const card =
          document.getElementById(
            "study-link-card-v2"
          );

        if (!card) {

          clearInterval(
            memberRefreshTimer
          );

          return;

        }


        const code =
          normalizeStudyLinkV2Code(
            roomCode.textContent
          );


        if (
          code &&
          code !== "------"
        ) {

          await renderStudyLinkMembersV2(
            code,
            user
          );

        }

      },
      3000
    );

}

async function showQuestBossMainPage(
  user,
  tab = "daily"
) {

  currentMainTab = "quest";
  classicNavUser = user;


  // ========================================================
  // DAILY ⇄ WEEKLY FAST SWITCH
  // ========================================================

  const cachedDaily =
    document.getElementById(
      "quest-daily-content"
    );

  const cachedWeekly =
    document.getElementById(
      "quest-weekly-content"
    );

  const cachedQuestTabs =
    document.getElementById(
      "quest-main-tabs"
    );

  /*
    DAILY / WEEKLY のDOMが既にある場合は
    Firestoreを一切読まず表示だけ変更する
  */
  if (
    (
      tab === "daily" ||
      tab === "weekly"
    ) &&
    cachedDaily &&
    cachedWeekly &&
    cachedQuestTabs
  ) {

    cachedDaily.style.display =
      tab === "daily"
        ? "grid"
        : "none";

    cachedWeekly.style.display =
      tab === "weekly"
        ? "grid"
        : "none";


    const currentCard =
      document.querySelector(
        "body > main > section"
      );

    const currentTitle =
      currentCard?.querySelector(
        ":scope > h1"
      );

    if (currentTitle) {

      currentTitle.textContent =
        tab === "daily"
          ? "デイリークエスト"
          : "ウィークリークエスト";

    }


    cachedQuestTabs
      .querySelectorAll(
        "[data-quest-tab]"
      )
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.questTab === tab
        );

      });


    updateClassicNavigationActive();

    return;
  }


  // ========================================================
  // BOSS
  // ========================================================

  if (tab === "boss") {

    await showBossPage(user);

  } else {

    // 既存クエストロジック
    await showQuestPage(user);


    const daily =
      document.getElementById(
        "quest-daily-content"
      );


    const weekly =
      document.getElementById(
        "quest-weekly-content"
      );


    if (daily) {
      daily.style.display =
        tab === "daily"
          ? "grid"
          : "none";
    }


    if (weekly) {
      weekly.style.display =
        tab === "weekly"
          ? "grid"
          : "none";
    }

  }


  // ========================================================
  // 下部ナビ
  // ========================================================

  mountClassicNavigation(user);


  // ========================================================
  // 上部3タブ
  // ========================================================

  const pageRoot =
    document.querySelector(
      "body > main"
    );


  const pageCard =
    pageRoot?.querySelector(
      ":scope > section"
    );


  if (!pageRoot || !pageCard) {

    console.warn(
      "Quest page root not found"
    );

    return;
  }


  document
    .getElementById(
      "quest-main-tabs"
    )
    ?.remove();


  const tabs = `
    <div id="quest-main-tabs">

      <button
        type="button"
        data-quest-tab="daily"
        class="${
          tab === "daily"
            ? "active"
            : ""
        }"
      >
        デイリー
      </button>

      <button
        type="button"
        data-quest-tab="weekly"
        class="${
          tab === "weekly"
            ? "active"
            : ""
        }"
      >
        ウィークリー
      </button>

      <button
        type="button"
        data-quest-tab="boss"
        class="${
          tab === "boss"
            ? "active"
            : ""
        }"
      >
        ボスバトル
      </button>

    </div>
  `;


  /*
    card()で生成されたページ本体の
    一番上にタブを置く
  */

  const pageTitle =
    pageCard.querySelector(
      ":scope > h1"
    );


  // タブに応じてページタイトルを変更
  if (pageTitle) {

    if (tab === "daily") {
      pageTitle.textContent =
        "デイリークエスト";
    }

    else if (tab === "weekly") {
      pageTitle.textContent =
        "ウィークリークエスト";
    }

    // bossはshowBossPage側の
    // 「ボス戦」表記をそのまま使用
  }


  if (pageTitle) {

    /*
      タイトルのすぐ下
    */
    pageTitle.insertAdjacentHTML(
      "afterend",
      tabs
    );

  } else {

    /*
      タイトルが無い場合だけ
      カード最上部
    */
    pageCard.insertAdjacentHTML(
      "afterbegin",
      tabs
    );

  }


  document
    .querySelectorAll(
      "#quest-main-tabs [data-quest-tab]"
    )
    .forEach(button => {

      button.onclick =
        async () => {

          const next =
            button.dataset.questTab;


          // ==================================================
          // DAILY / WEEKLY
          // ==================================================

          if (
            next === "daily" ||
            next === "weekly"
          ) {

            const daily =
              document.getElementById(
                "quest-daily-content"
              );


            const weekly =
              document.getElementById(
                "quest-weekly-content"
              );


            // ----------------------------------------------
            // デイリー/ウィークリー画面にいる場合
            // → DOMをその場で切替
            // ----------------------------------------------

            if (daily && weekly) {

              daily.style.display =
                next === "daily"
                  ? "grid"
                  : "none";


              weekly.style.display =
                next === "weekly"
                  ? "grid"
                  : "none";


              document
                .querySelectorAll(
                  "#quest-main-tabs [data-quest-tab]"
                )
                .forEach(x => {

                  x.classList.toggle(
                    "active",
                    x.dataset.questTab === next
                  );

                });


              return;

            }


            // ----------------------------------------------
            // ボス画面にいる場合
            //
            // daily / weekly のDOMが存在しないので
            // クエスト画面を再描画する
            // ----------------------------------------------

            await showQuestBossMainPage(
              user,
              next
            );

            return;

          }


          // ==================================================
          // BOSS
          // ==================================================

          await showQuestBossMainPage(
            user,
            "boss"
          );

        };

    });

}

let partyFriendsActiveTab = "party";

let partyViewTransitionRunning = false;



function mountPartyFriendsTabs(
  user,
  tab = "party"
) {

  const cardEl =
    document.querySelector(
      "body > main > section"
    );


  if (!cardEl) {

    console.warn(
      "party card not found"
    );

    return;

  }


  if (
    ![
      "friends",
      "party",
      "requests",
    ].includes(tab)
  ) {

    tab = "party";

  }


  partyFriendsActiveTab =
    tab;


  // ==========================================================
  // TITLE
  // ==========================================================

  const title =
    cardEl.querySelector(
      "h1"
    );


  if (title) {

    if (tab === "friends") {

      title.textContent =
        "フレンド";

    }

    else if (tab === "party") {

      title.textContent =
        "パーティー";

    }

    else {

      title.textContent =
        "申請";

    }


    /*
      PARTY画面には元から英語ラベルがある場合がある。
      その場合は既存Nodeを再利用して二重表示を防ぐ。
    */

    const englishText =
      tab === "friends"
        ? "FRIENDS"
        : tab === "party"
          ? "PARTY"
          : "REQUESTS";


    const existingEnglish =
      Array.from(
        cardEl.querySelectorAll(
          ".main-screen-english"
        )
      )
      .find(
        element =>
          element.id !==
          "party-main-english"
      );


    let english =
      cardEl.querySelector(
        "#party-main-english"
      );


    if (existingEnglish) {

      existingEnglish.textContent =
        englishText;


      if (
        english &&
        english !== existingEnglish
      ) {

        english.remove();

      }


      english =
        existingEnglish;

    }

    else {

      if (!english) {

        english =
          document.createElement(
            "div"
          );


        english.id =
          "party-main-english";


        english.className =
          "main-screen-english";


        title.insertAdjacentElement(
          "beforebegin",
          english
        );

      }


      english.textContent =
        englishText;

    }

  }


  // ==========================================================
  // TABS
  //
  // ★存在する場合は絶対に削除しない
  // ==========================================================

  let tabs =
    cardEl.querySelector(
      "#party-main-tabs"
    );


  if (!tabs) {

    tabs =
      document.createElement(
        "div"
      );


    tabs.id =
      "party-main-tabs";


    tabs.innerHTML = `
      <button
        type="button"
        data-party-tab="friends"
      >
        フレンド
      </button>

      <button
        type="button"
        data-party-tab="party"
      >
        パーティー
      </button>

      <button
        type="button"
        data-party-tab="requests"
      >
        申請
      </button>
    `;


    if (title) {

      title.insertAdjacentElement(
        "afterend",
        tabs
      );

    }

    else {

      cardEl.prepend(
        tabs
      );

    }

  }


  /*
    Fixed DOMによって位置が変わっていても、
    削除→再生成ではなく
    同じNodeを正しい場所へ移動するだけ。
  */

  if (
    title &&
    title.nextElementSibling !== tabs
  ) {

    title.insertAdjacentElement(
      "afterend",
      tabs
    );

  }


  // ==========================================================
  // FRIEND / REQUEST CONTENT
  // ==========================================================

  if (
    tab === "friends" ||
    tab === "requests"
  ) {

    const searchInput =
      document.getElementById(
        "friend-search-id"
      );


    const searchBlock =
      searchInput?.parentElement;


    const searchResult =
      document.getElementById(
        "friend-search-result"
      );


    const friendList =
      document.getElementById(
        "friend-list"
      );


    const friendListBlock =
      friendList?.parentElement;


    const requestList =
      document.getElementById(
        "incoming-friend-requests"
      );


    const requestBlock =
      requestList?.parentElement;


    const message =
      document.getElementById(
        "friend-message"
      );


    const openParty =
      document.getElementById(
        "open-party-btn"
      );


    const back =
      document.getElementById(
        "friend-back-btn"
      );


    /*
      activeクラスを変える前に
      内容の表示状態を完成させる。
    */

    if (tab === "friends") {

      if (searchBlock) {
        searchBlock.style.display =
          "grid";
      }

      if (searchResult) {
        searchResult.style.display =
          "block";
      }

      if (friendListBlock) {
        friendListBlock.style.display =
          "grid";
      }

      if (requestBlock) {
        requestBlock.style.display =
          "none";
      }

      if (message) {
        message.style.display =
          "block";
      }

    }


    else {

      if (searchBlock) {
        searchBlock.style.display =
          "none";
      }

      if (searchResult) {
        searchResult.style.display =
          "none";
      }

      if (friendListBlock) {
        friendListBlock.style.display =
          "none";
      }

      if (requestBlock) {
        requestBlock.style.display =
          "grid";
      }

      if (message) {
        message.style.display =
          "none";
      }

    }


    if (openParty) {
      openParty.style.display =
        "none";
    }


    if (back) {
      back.style.display =
        "none";
    }

  }


  // ==========================================================
  // ACTIVE STATE
  //
  // Nodeはそのまま。
  // classだけ変更。
  // ==========================================================

  tabs
    .querySelectorAll(
      "[data-party-tab]"
    )
    .forEach(button => {

      const buttonTab =
        button.dataset.partyTab;


      button.classList.toggle(
        "active",
        buttonTab === tab
      );


      button.setAttribute(
        "aria-selected",
        buttonTab === tab
          ? "true"
          : "false"
      );


      button.onclick =
        async () => {

          const next =
            button.dataset.partyTab;


          if (
            !next ||
            next ===
              partyFriendsActiveTab
          ) {

            return;

          }


          /*
            FRIENDS ⇄ REQUESTS

            同じshowFriendsPage DOMなので
            画面生成なし。
            class/display変更だけ。
          */

          const currentIsFriendSide =
            partyFriendsActiveTab ===
              "friends" ||
            partyFriendsActiveTab ===
              "requests";


          const nextIsFriendSide =
            next === "friends" ||
            next === "requests";


          if (
            currentIsFriendSide &&
            nextIsFriendSide &&
            document.getElementById(
              "friend-list"
            ) &&
            document.getElementById(
              "incoming-friend-requests"
            )
          ) {

            /*
              タブDOMはそのまま。
              activeだけ変更する。
            */

            mountPartyFriendsTabs(
              user,
              next
            );

            return;

          }


          await showPartyFriendsMainPage(
            user,
            next
          );

        };

    });


  // ==========================================================
  // BOTTOM NAV
  // ==========================================================

  currentMainTab =
    "party";


  /*
    毎回ナビを作り直さない
  */

  if (
    !document.getElementById(
      "main-navigation"
    )
  ) {

    mountClassicNavigation(
      user
    );

  }


  updateClassicNavigationActive();

}
async function showPartyFriendsMainPage(
  user,
  tab = "party"
) {

  /*
    前画面を残したまま、
    次画面のDOMが完成してから切り替える。

    再帰防止のため、
    View Transition内部では通常描画する。
  */
  if (
    !partyViewTransitionRunning &&
    typeof document.startViewTransition === "function" &&
    document.querySelector("body > main")
  ) {

    partyViewTransitionRunning = true;

    try {

      const transition =
        document.startViewTransition(
          async () => {

            await showPartyFriendsMainPage(
              user,
              tab
            );

          }
        );


      await transition.updateCallbackDone;

    } finally {

      partyViewTransitionRunning = false;

    }


    return;

  }



  if (
    ![
      "friends",
      "party",
      "requests",
    ].includes(tab)
  ) {
    tab = "party";
  }


  partyFriendsActiveTab = tab;
  currentMainTab = "party";
  classicNavUser = user;


  if (tab === "party") {

    await showPartyPage(user);

  }

  else {

    await showFriendsPage(user);

  }


  mountPartyFriendsTabs(
    user,
    tab
  );


  if (tab === "party") {

    document
      .querySelector(
        "body > main > section"
      )
      ?.classList.remove(
        "party-page-preparing"
      );

  }


}

              inventory[itemName] ?? 0
            );

          const selected =

          const effect =

          const description =
            effect.durationMinutes == null

              : `XP ${effect.multiplier}倍 / ${effect.durationMinutes}分`;


          return `

              <div class="locker-item-info">

                <div class="locker-item-name">
                  ${itemName} ×${count}
                </div>

                <div class="locker-item-desc">
                  ${description}
                </div>

              </div>


              <button
                type="button"

                class="
                  locker-action
                  ${selected ? "active" : ""}
                "

                data-locker-xp="${itemName}"

                ${
                  count <= 0 && !selected
                    ? "disabled"
                    : ""
                }
              >
                ${
                  selected
                    ? "予約解除"
                    : "次回使用"
                }
              </button>

            </div>

        }).join("")}

      </section>


      <section class="locker-section">

        <div class="locker-section-title">

        </div>


        <div class="locker-note">

        </div>


        ${bossItems.map(itemName => {

          const count =
            Number(
              inventory[itemName] ?? 0
            );

          return `

            <div class="locker-item">

              <div class="locker-item-info">

                <div class="locker-item-name">
                  ${itemName} ×${count}
                </div>

                <div class="locker-item-desc">
                  ${
                    count > 0
                      ? "使用可能"
                      : "未所持"
                  }
                </div>

              </div>


              <button
                type="button"
                class="locker-action locker-open-boss"
                ${count <= 0 ? "disabled" : ""}
              >
                ボス戦へ
              </button>

            </div>

          `;

        }).join("")}

      </section>


      <p
        id="locker-message"
        style="
          margin:0;
          min-height:1.2em;
          color:#9fd3a9;
          font-size:.8rem;
        "
      ></p>

    `)
  );


  $("locker-back").onclick =
    async () => {

      await showOtherPage(user);

    };


  document
    .querySelectorAll(
      "[data-locker-xp]"
    )
    .forEach(button => {

      button.onclick =
        async () => {

          const itemName =
            button.dataset.lockerXp;

          try {

            const latestSnap =
              await getDoc(ref);

            if (!latestSnap.exists()) {
              throw new Error(
                "ユーザーデータが見つかりません。"
              );
            }


            const latest =
              latestSnap.data();


            const currentQueued =
              String(
                latest.queuedXpItem ?? ""
              );


            // 同じアイテムなら予約解除
            if (
              currentQueued === itemName
            ) {

              await setDoc(
                ref,
                {
                  queuedXpItem: "",
                  updatedAt:
                    serverTimestamp(),
                },
                { merge:true }
              );

              await showLockerPage(user);
              return;

            }


            const owned =
              Number(
                latest.inventory?.[
                  itemName
                ] ?? 0
              );


            if (owned <= 0) {
              throw new Error(
                "このアイテムを所持していません。"
              );
            }


            await setDoc(
              ref,
              {
                queuedXpItem:
                  itemName,

                updatedAt:
                  serverTimestamp(),
              },
              { merge:true }
            );


            await showLockerPage(user);

          }

          catch (error) {

            const message =
              $("locker-message");

            if (message) {

              message.style.color =
                "#ff8b8b";

              message.textContent =
                error?.message ||
                "予約に失敗しました。";

            }

          }

        };

    });


  document
    .querySelectorAll(
      ".locker-open-boss"
    )
    .forEach(button => {

      button.onclick =
        async () => {

          await showQuestBossMainPage(
            user,
            "boss"
          );

        };

    });

}

        document
          .querySelectorAll("[data-track]")
          .forEach(el => {

            el.classList.toggle(
              "active",
              el.dataset.track === track
            );

          });

      };

    });


  // 教科
  document
    .querySelectorAll("[data-subject]")
    .forEach(button => {

      button.onclick = () => {

        const subject =
          button.dataset.subject;


        if (selected.has(subject)) {

          selected.delete(subject);

          button.classList.remove(
            "active"
          );

        } else {

          selected.add(subject);

          button.classList.add(
            "active"
          );

        }


        updateCount();

      };

    });


  // 保存
  $("profile-save").onclick =
    async () => {

      const message =
        $("profile-message");

      try {

        message.textContent = "";
        message.style.color =
          "#9fd3a9";


        const username =
          $("profile-name")
            .value
            .trim();


        if (!username) {
          throw new Error(
            "表示名を入力してください。"
          );
        }


        if (!track) {
          throw new Error(
            "文系か理系を選択してください。"
          );
        }


        if (selected.size === 0) {
          throw new Error(
            "教科を1つ以上選択してください。"
          );
        }


        await setDoc(
          ref,
          {
            username,
            track,

            selectedSubjects:
              [...selected],

            updatedAt:
              serverTimestamp(),
          },
          {
            merge:true,
          }
        );


        await showOtherPage(user);

      }

      catch (error) {

        message.style.color =
          "#ff8b8b";

        message.textContent =
          error?.message ||
          "保存に失敗しました。";

      }

    };

async function updateLoginStats(user, suppliedData = null) {
  const userRef = doc(db, "users", user.uid);

  let data = suppliedData;

  if (!data) {
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
      throw new Error("ユーザーデータが見つかりません。");
    }

    data = snap.data();
  }

  const todayKey = getJstDateKey();

  if (data.lastLoginDate === todayKey) {
    return false;
  }

  await setDoc(
    userRef,
    {
      loginDays:
        Number(data.loginDays ?? 0) + 1,

      lastLoginDate: todayKey,

      updatedAt: serverTimestamp(),
    },
    { merge: true }
  );

  return true;
}



let ascendHomeMaintenancePromise = null;
let ascendHomeMaintenanceLastRun = 0;

function scheduleHomeMaintenance(user, data) {

  const now = Date.now();

  /*
    30秒以内の連打では再通信しない
  */
  if (
    ascendHomeMaintenancePromise ||
    now - ascendHomeMaintenanceLastRun < 30000
  ) {
    return;
  }

  ascendHomeMaintenanceLastRun = now;

  /*
    まずHOMEを描画させ、
    通信は次のイベントループで開始
  */
  setTimeout(() => {

    if (ascendHomeMaintenancePromise) {
      return;
    }

    ascendHomeMaintenancePromise =
      (async () => {

        await updateLoginStats(
          user,
          data
        );

        await checkAllTitles(
          user
        );

      })()
      .catch(error => {

        console.error(
          "HOME background maintenance failed:",
          error
        );

      })
      .finally(() => {

        ascendHomeMaintenancePromise =
          null;

      });

  }, 0);

}


async function showHome(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    throw new Error("ユーザーデータが見つかりません。");
  }

  let data = snap.data();

  const todayKey = getJstDateKey();

  if (
    data.dailyXpDate &&
    data.dailyXpDate !== todayKey
  ) {
    await setDoc(
      ref,
      {
        dailyXpDate: todayKey,
        dailyXpEarned: 0,
        rareXpBoostActive: false,
        updatedAt: serverTimestamp(),
      },
      { merge: true }
    );

    data = {
      ...data,
      dailyXpDate: todayKey,
      dailyXpEarned: 0,
      rareXpBoostActive: false,
    };
  }

  const now = new Date();

  const currentSeasonKey =
    `${now.getFullYear()}-${String(
      now.getMonth() + 1
    ).padStart(2, "0")}`;

  if (data.rankSeasonKey !== currentSeasonKey) {
    const previousMinutes =
      Math.max(
        0,
        Number(
          data.monthlyStudyMinutes ?? 0
        )
      )
      +
      Math.max(
        0,
        Number(
          data.monthlyStudyLinkBonusMinutes ?? 0
        )
      );

    const previousRank =
      calculateRank(previousMinutes);

    const reward =
      RANK_REWARDS[previousRank] ||
      { xp: 0, coins: 0 };

    const previousXp =
      Number(data.xp ?? 0);

    const previousCoins =
      Number(data.coins ?? 0);

    const rewardedSeason =
      data.rankRewardedSeasonKey || "";

    const shouldReward =
      Boolean(data.rankSeasonKey) &&
      rewardedSeason !== data.rankSeasonKey;

    const newXp =
      previousXp +
      (shouldReward ? reward.xp : 0);

    const newCoins =
      previousCoins +
      (shouldReward ? reward.coins : 0);

    await setDoc(
      ref,
      {
        monthlyStudyMinutes: 0,
        monthlyStudyLinkBonusMinutes: 0,
        rankSeasonKey: currentSeasonKey,

        xp: newXp,
        coins: newCoins,

        lifetimeCoinsEarned:
          Number(data.lifetimeCoinsEarned ?? 0) +
          (shouldReward ? reward.coins : 0),

        ...(shouldReward
          ? {
              rankRewardedSeasonKey:
                data.rankSeasonKey,

              lastSeasonRank:
                previousRank,

              lastSeasonRewardXp:
                reward.xp,

              lastSeasonRewardCoins:
                reward.coins,
            }
          : {}),

        updatedAt: serverTimestamp(),
      },
      { merge: true }
    );

    data = {
      ...data,
      monthlyStudyMinutes: 0,
      monthlyStudyLinkBonusMinutes: 0,
      rankSeasonKey: currentSeasonKey,
      xp: newXp,
      coins: newCoins,

      ...(shouldReward
        ? {
            rankRewardedSeasonKey:
              data.rankSeasonKey,

            lastSeasonRank:
              previousRank,

            lastSeasonRewardXp:
              reward.xp,

            lastSeasonRewardCoins:
              reward.coins,
          }
        : {}),
    };
  }

  /*
    HOME表示を通信で止めない。
    ログイン統計・称号判定はバックグラウンド処理。
  */
  scheduleHomeMaintenance(
    user,
    data
  );

  const totalXp =
    Number(data.xp ?? 0);

  const levelInfo =
    calculateLevelFromTotalXp(totalXp);

  const level =
    levelInfo.level;

  const currentXp =
    levelInfo.currentXp;

  const neededXp =
    levelInfo.neededXp;

  const stars =
    Number(data.stars ?? 0);

  const coins =
    Number(data.coins ?? 0);

  const totalStudyMinutes =
    Number(data.totalStudyMinutes ?? 0);

  const monthlyStudyMinutes =
    Number(data.monthlyStudyMinutes ?? 0);


  const homeRankMonthlyMinutes =
    monthlyStudyMinutes +
    Math.max(
      0,
      Number(
        data.monthlyStudyLinkBonusMinutes ?? 0
      )
    );


  const todayStudyMinutes =
    data.dailyStudyDate === todayKey
      ? Number(data.todayStudyMinutes ?? 0)
      : 0;

    );

function getBossBaseReward(level) {
  const safeLevel = Math.min(10, Math.max(1, Number(level || 1)));

  return {
    xp: Math.floor(500 * Math.pow(1.5, safeLevel - 1)),
    coins: Math.floor(750 * Math.pow(1.5, safeLevel - 1)),
  };
}

function getBossSystemForSubject(subject) {
  return SUBJECT_BOSS_SYSTEM[subject] ?? null;
}

function getPlayerBossLevel(data) {
  const stars = Number(data.stars ?? 0);

  if (stars >= 1) {
    return 10;
  }

  const totalXp = Number(data.xp ?? 0);
  const info = calculateLevelFromTotalXp(totalXp);

  return Math.min(
    10,
    Math.max(1, Math.floor(info.level / 10) + 1)
  );
}

async function calculatePartyBossLevel(memberUids) {
  const levels = [];

  for (const uid of memberUids || []) {
    const snap = await getDoc(doc(db, "users", uid));

    if (!snap.exists()) continue;

    levels.push(
      getPlayerBossLevel(snap.data())
    );
  }

  if (!levels.length) return 1;

  const average =
    levels.reduce((a, b) => a + b, 0) / levels.length;

  return Math.min(
    10,
    Math.max(1, Math.round(average))
  );
}

function deterministicBossSystem(partyId, cycleKey) {
  const seed =
    seededNumberFromString(
      `boss-system-${partyId}-${cycleKey}`
    );

  const index =
    Math.floor(seed * BOSS_SYSTEMS.length);

  return BOSS_SYSTEMS[index];
}

async function ensureBossForParty(party) {
  const cycle = getPartyCycleInfo();

  if (cycle.phase !== "boss") {
    return party;
  }

  if (
    party.bossCycleKey === cycle.cycleKey &&
    party.boss &&
    Number(party.boss.maxHp) > 0
  ) {
    return party;
  }

  const bossLevel =
    await calculatePartyBossLevel(
      party.memberUids || []
    );

  const memberCount =
    Math.min(
      10,
      Math.max(
        1,
        Array.isArray(party.memberUids)
          ? party.memberUids.length
          : 1
      )
    );

  const hpMultiplier =
    PARTY_BOSS_HP_MULTIPLIER[memberCount] || 1;

  const baseMaxHp =
    BOSS_HP_TABLE[bossLevel] || BOSS_HP_TABLE[1];

  const maxHp =
    Math.floor(baseMaxHp * hpMultiplier);

  const weaknessSystem =
    deterministicBossSystem(
      party.id,
      cycle.cycleKey
    );

  const boss = {
    level: bossLevel,
    name: BOSS_NAMES[weaknessSystem] || "Unknown Boss",
    maxHp,
    currentHp: maxHp,
    weaknessSystem,
    defeated: false,
  };

  await setDoc(
    doc(db, "parties", party.id),
    {
      boss,
      bossCycleKey: cycle.cycleKey,
      updatedAt: serverTimestamp(),
    },
    { merge: true }
  );

  return {
    ...party,
    boss,
    bossCycleKey: cycle.cycleKey,
  };
}

        if (claimedRewards[rewardKey]) {
          throw new Error("このボスの報酬は受取済みです。");
        }

        const contributions =
          latestParty.bossContributions || {};

        const myDamage =
          Number(contributions[user.uid] ?? 0);

        if (myDamage <= 0) {
          throw new Error(
            "このボス戦でダメージを与えていないため、報酬は受け取れません。"
          );
        }

        const totalDamage =
          Object.values(contributions)
            .reduce(
              (sum, value) => sum + Number(value || 0),
              0
            );

        const contributionRate =
          totalDamage > 0
            ? Math.min(1, myDamage / totalDamage)
            : 0;

        const baseReward =
          getBossBaseReward(latestBoss.level);

        const bonusRate =
          Math.min(0.6, contributionRate * 0.6);

        const bonusXp =
          Math.floor(baseReward.xp * bonusRate);

        const bonusCoins =
          Math.floor(baseReward.coins * bonusRate);

        const rewardXp =
          baseReward.xp + bonusXp;

        const rewardCoins =
          baseReward.coins + bonusCoins;

        const titles = Array.isArray(userData.titles)
          ? [...userData.titles]
          : [];

        let earnedTitle = "";

        if (Number(latestBoss.level) === 10) {
          const title =
            BOSS_LEVEL10_TITLES[
              latestBoss.weaknessSystem
            ];

          if (title && !titles.includes(title)) {
            titles.push(title);
            earnedTitle = title;
          }
        }

        claimedRewards[rewardKey] = {
          xp: rewardXp,
          coins: rewardCoins,
          bossLevel: latestBoss.level,
          bossSystem: latestBoss.weaknessSystem,
        };

        // ============================================
        // ボス戦績：撃破系
        // 報酬は1回しか受け取れないため二重加算されない
        // ============================================

        const bossStats = {
          ...(userData.bossStats || {}),
        };

        bossStats.defeats =
          Number(bossStats.defeats || 0) + 1;

        const memberCount =
          Array.isArray(latestParty.memberUids)
            ? latestParty.memberUids.length
            : 0;

        if (memberCount === 1) {
          bossStats.soloDefeats =
            Number(bossStats.soloDefeats || 0) + 1;
        }

        const contributionValues =
          Object.values(contributions)
            .map(value => Number(value || 0));

        const maxContribution =
          contributionValues.length
            ? Math.max(...contributionValues)
            : 0;

        if (
          myDamage > 0 &&
          myDamage === maxContribution
        ) {
          bossStats.mvp =
            Number(bossStats.mvp || 0) + 1;
        }

        const defeatedSystems =
          Array.isArray(bossStats.defeatedSystems)
            ? [...bossStats.defeatedSystems]
            : [];

        if (
          latestBoss.weaknessSystem &&
          !defeatedSystems.includes(
            latestBoss.weaknessSystem
          )
        ) {
          defeatedSystems.push(
            latestBoss.weaknessSystem
          );
        }

        bossStats.defeatedSystems =
          defeatedSystems;

        const defeatedLv10Systems =
          Array.isArray(bossStats.defeatedLv10Systems)
            ? [...bossStats.defeatedLv10Systems]
            : [];

        if (
          Number(latestBoss.level) === 10 &&
          latestBoss.weaknessSystem &&
          !defeatedLv10Systems.includes(
            latestBoss.weaknessSystem
          )
        ) {
          defeatedLv10Systems.push(
            latestBoss.weaknessSystem
          );
        }

        bossStats.defeatedLv10Systems =
          defeatedLv10Systems;

        await setDoc(
          userRef,
          {
            xp:
              Number(userData.xp ?? 0) +
              rewardXp,

            coins:
              Number(userData.coins ?? 0) +
              rewardCoins,

            lifetimeCoinsEarned:
              Number(userData.lifetimeCoinsEarned ?? 0) +
              rewardCoins,

            titles,
            claimedBossRewards: claimedRewards,
            bossStats,

            updatedAt: serverTimestamp(),
          },
          { merge: true }
        );

        messageEl.style.color = "#9fd3a9";

        messageEl.textContent =
          `XP +${rewardXp} / コイン +${rewardCoins}` +
          (
            earnedTitle
              ? ` / 称号「${earnedTitle}」獲得！`
              : ""
          );

        $("claim-boss-reward-btn").disabled = true;
        $("claim-boss-reward-btn").textContent =
          "受取済み";

      } catch (error) {
        messageEl.style.color = "#ff8b8b";
        messageEl.textContent =
          error?.message || "報酬受取に失敗しました。";
      }
    };
  }


}


const PARTY_CYCLE_START = "2026-08-31";

function getJstNowDateOnly() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).formatToParts(new Date());

  const values = Object.fromEntries(
    parts.map(part => [part.type, part.value])
  );

  return new Date(
    `${values.year}-${values.month}-${values.day}T00:00:00+09:00`
  );
}

function getPartyCycleInfo() {
  const start =
    new Date(`${PARTY_CYCLE_START}T00:00:00+09:00`);

  const today = getJstNowDateOnly();

  const diffDays =
    Math.floor((today - start) / 86400000);

  const safeDiff = Math.max(0, diffDays);

  const cycleIndex =
    Math.floor(safeDiff / 14);

  const dayInCycle =
    safeDiff % 14;

  const phase =
    dayInCycle < 7 ? "formation" : "boss";

  const cycleStart =
    new Date(start.getTime() + cycleIndex * 14 * 86400000);

  const bossWeekStart =
    new Date(cycleStart.getTime() + 7 * 86400000);

  const nextCycleStart =
    new Date(cycleStart.getTime() + 14 * 86400000);

  const dateKey = date =>
    new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).format(date);

  return {
    cycleIndex,
    dayInCycle,
    phase,
    cycleKey: `cycle-${cycleIndex}`,
    cycleStart: dateKey(cycleStart),
    bossWeekStart: dateKey(bossWeekStart),
    nextCycleStart: dateKey(nextCycleStart),
  };
}


async function getMyParty(user) {
  const q = query(
    collection(db, "parties"),
    where("memberUids", "array-contains", user.uid)
  );

  const snap = await getDocs(q);

  if (snap.empty) return null;

  const partyDoc = snap.docs[0];
  const party = {
    id: partyDoc.id,
    ...partyDoc.data(),
  };

  const cycle = getPartyCycleInfo();

  // 旧データにはcycleKeyが無いので現在のサイクルとして補完
  if (!party.cycleKey) {
    await setDoc(
      doc(db, "parties", party.id),
      {
        cycleKey: cycle.cycleKey,
        updatedAt: serverTimestamp(),
      },
      { merge: true }
    );

    party.cycleKey = cycle.cycleKey;
  }

  // 2週間サイクルが終了していたら自動解散
  if (party.cycleKey !== cycle.cycleKey) {
    await deleteDoc(
      doc(db, "parties", party.id)
    );

    return null;
  }

  return party;
}

      collection(db, "friends"),

    );

    );

      getDocs(friendshipQueryA),
      getDocs(friendshipQueryB),
    ]);

    const friendUids = new Set();

    aSnap.docs.forEach(d => {
      const f = d.data();
      if (f.userB) friendUids.add(f.userB);
    });

    bSnap.docs.forEach(d => {
      const f = d.data();
      if (f.userA) friendUids.add(f.userA);
    });

    const cards = [];

      [...friendUids].filter(
        uid =>
          !myParty.memberUids
            ?.includes(uid)
      );

    /*
      フレンド情報を直列ではなく
      一斉に取得
    */
    const friendSnaps =
      await Promise.all(
        inviteableFriendUids.map(
          uid =>
            getDoc(
              doc(
                db,
                "users",

            )

      cards.join("") ||

      button.onclick = async () => {

            existing.data().status === "pending") {

            "すでに招待済みです。";
          return;
        }

        await setDoc(inviteRef, {
          partyId: myParty.id,

          fromUid: user.uid,
          fromUsername: myData.username,

          toUid,
          toUsername: button.dataset.username,

// ASCEND FRIEND PRESENCE FINAL START

const FRIEND_PRESENCE_HEARTBEAT_MS =
  60000;

const FRIEND_PRESENCE_ONLINE_MS =
  135000;


let friendPresenceOwnTimer =
  null;

let friendPresencePollTimer =
  null;

let friendPresenceCurrentUser =
  null;

let activeFriendPresenceUids =
  [];


// ------------------------------------------------------------
// 自分の状態
// ------------------------------------------------------------

async function writeOwnFriendPresence(
  online
) {

  const user =
    friendPresenceCurrentUser;


  if (!user) {
    return;
  }


  try {

    await setDoc(
      doc(
        db,
        "presence",
        user.uid
      ),
      {
        state:
          online
            ? "online"
            : "offline",

        lastActiveAt:
          serverTimestamp(),
      },
      {
        merge:true,
      }
    );

  }

  catch (error) {

    console.warn(
      "presence write failed",
      error
    );

  }

}


function stopOwnFriendPresence() {

  if (
    friendPresenceOwnTimer
  ) {

    clearInterval(
      friendPresenceOwnTimer
    );

    friendPresenceOwnTimer =
      null;

  }

}


function startOwnFriendPresence(
  user
) {

  stopOwnFriendPresence();


  friendPresenceCurrentUser =
    user;


  if (
    document.visibilityState ===
    "visible"
  ) {

    void writeOwnFriendPresence(
      true
    );

  }


  friendPresenceOwnTimer =
    setInterval(
      () => {

        if (
          document.visibilityState ===
          "visible"
        ) {

          void writeOwnFriendPresence(
            true
          );

        }

      },
      FRIEND_PRESENCE_HEARTBEAT_MS
    );

}


// ------------------------------------------------------------
// 相手の表示
// ------------------------------------------------------------

function setFriendPresenceUi(
  uid,
  online
) {

  document
    .querySelectorAll(
      `[data-friend-presence="${uid}"]`
    )
    .forEach(element => {

      element.classList.toggle(
        "online",
        online
      );


      const text =
        element.querySelector(
          ".friend-presence-text"
        );


      if (text) {

        text.textContent =
          online
            ? "オンライン"
            : "オフライン";

      }

    });

}


async function refreshFriendPresence() {

  const uids =
    [
      ...new Set(
        activeFriendPresenceUids
      )
    ]
      .filter(Boolean);


  if (!uids.length) {
    return;
  }


  /*
    FRIENDSパネルが存在していて
    hiddenならFirestoreを読まない
  */

  const friendsPanel =
    document.getElementById(
      "friends-panel"
    );


  if (
    friendsPanel &&
    friendsPanel.hidden
  ) {

    return;

  }


  const results =
    await Promise.all(
      uids.map(
        async uid => {

          try {

            const snap =
              await getDoc(
                doc(
                  db,
                  "presence",
                  uid
                )
              );


            if (!snap.exists()) {

              return {
                uid,
                online:false,
              };

            }


            const data =
              snap.data();


            const lastActive =
              data.lastActiveAt
                ?.toMillis?.() || 0;


            const fresh =
              Date.now() -
                lastActive <=
              FRIEND_PRESENCE_ONLINE_MS;


            return {
              uid,

              online:
                data.state ===
                  "online" &&
                fresh,
            };

          }

          catch {

            return {
              uid,
              online:false,
            };

          }

        }
      )
    );


  results.forEach(
    result => {

      setFriendPresenceUi(
        result.uid,
        result.online
      );

    }
  );

}


// ------------------------------------------------------------
// FRIENDS画面用 polling
// ------------------------------------------------------------

function clearFriendPresenceListeners() {

  if (
    friendPresencePollTimer
  ) {

    clearInterval(
      friendPresencePollTimer
    );


    friendPresencePollTimer =
      null;

  }


  activeFriendPresenceUids =
    [];

}


function mountFriendPresenceListeners(
  friendUids
) {

  clearFriendPresenceListeners();


  activeFriendPresenceUids =
    Array.isArray(friendUids)
      ? [...friendUids]
      : [];


  if (
    !activeFriendPresenceUids.length
  ) {

    return;

  }


  void refreshFriendPresence();


  friendPresencePollTimer =
    setInterval(
      refreshFriendPresence,
      FRIEND_PRESENCE_HEARTBEAT_MS
    );

}


// ------------------------------------------------------------
// App visibility
// ------------------------------------------------------------

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      !friendPresenceCurrentUser
    ) {

      return;

    }


    if (
      document.visibilityState ===
      "visible"
    ) {

      void writeOwnFriendPresence(
        true
      );


      void refreshFriendPresence();

    }

    else {

      void writeOwnFriendPresence(
        false
      );

    }

  }
);


// ------------------------------------------------------------
// AUTH
//
// 既存onAuthStateChangedとは別listener。
// 既存ログイン処理を変更しない。
// ------------------------------------------------------------

onAuthStateChanged(
  auth,
  user => {

    stopOwnFriendPresence();


    if (!user) {

      friendPresenceCurrentUser =
        null;

      clearFriendPresenceListeners();

      return;

    }


    startOwnFriendPresence(
      user
    );

  }
);

      const friendSnap = await getDoc(doc(db, "users", uid));

      const friendData = friendSnap.data();

      // FRIEND CARD DISPLAY DATA
      // 追加通信なし。既存friendDataだけ使用。
      // ============================================

      const friendLevel =
        calculateLevelFromTotalXp(
          Number(friendData.xp ?? 0)
        ).level;


      const friendRank =
        calculateRank(
          Math.max(
            0,
            Number(
              friendData.monthlyStudyMinutes ?? 0
            )
          )
          +
          Math.max(
            0,
            Number(
              friendData.monthlyStudyLinkBonusMinutes ?? 0
            )
          )
        );


      /*
        todayStudyMinutesは
        今日の日付と一致する場合だけ表示。
        昨日の値が残っていても0分扱い。
      */
      const friendTodayMinutes =
        friendData.dailyStudyDate ===
          getJstDateKey()

          ? Number(
              friendData.todayStudyMinutes ?? 0

          : 0;

        friendTodayMinutes >= 60

          ? (
              `${Math.floor(
                friendTodayMinutes / 60

              `${friendTodayMinutes % 60}m`
            )

          : `${friendTodayMinutes}m`;

        過去版フィールドが残っていても対応。

          friendData.equippedTitle ??
          friendData.equippedTitleName ??
          friendData.selectedTitle ??
          friendData.activeTitle ??
          friendData.currentTitle ??

          friendData.track ?? ""
        ).trim();

        String(
          friendData.rankedSeason ?? ""
        ) ===
        getCurrentRankedSeasonKeyV1();

        friendRankedActiveV1
          ? (

                friendRank

          class="friend-card-rich"

            <div class="friend-card-rich-user">

              <strong class="friend-card-rich-name">

                <span

                    "Silver I": "silver-i.png",

                ${friendTodayText}

          </div>

    }

    friendListEl.innerHTML =
      friendCards.join("") ||
      `<div style="color:#9aa6ba">まだフレンドはいません。</div>`;
  }


  /*
    フレンドカード描画完了後に
    オンライン状態を取得
  */
  mountFriendPresenceListeners(
    [...friendUids]
  );


  const incomingQuery = query(
    collection(db, "friendRequests"),
    where("toUid", "==", user.uid)
  );

  const incomingSnap = await getDocs(incomingQuery);

  const incomingPending = incomingSnap.docs.filter(
    d => d.data().status === "pending"
  );

  const incomingEl = $("incoming-friend-requests");

  if (!incomingPending.length) {
    incomingEl.innerHTML = `
      <div style="color:#9aa6ba;font-size:.9rem">
        申請はありません。
      </div>
    `;
  } else {
    incomingEl.innerHTML = incomingPending.map((requestDoc) => {
      const request = requestDoc.data();

      return `
        <div style="
          padding:14px;
          background:#0b1019;
          border:1px solid #263247;
          border-radius:12px;
          display:grid;
          gap:8px;
          margin-bottom:8px;
        ">
          <strong>${request.fromUsername ?? "ユーザー"}</strong>

          <div style="color:#9aa6ba;font-size:.9rem">
            ID：${request.fromGlobalId ?? "-"}
          </div>

          <button
            class="accept-friend-btn"
            data-request-id="${requestDoc.id}"
            style="${buttonStyle(true)}"
          >
            承認
          </button>

          <button
            class="reject-friend-btn"
            data-request-id="${requestDoc.id}"
            style="${buttonStyle(false)}"
          >
            拒否
          </button>
        </div>
      `;
    }).join("");
  }

  document.querySelectorAll(".accept-friend-btn").forEach((button) => {
    button.onclick = async () => {
      const requestId = button.dataset.requestId;
      const requestRef = doc(db, "friendRequests", requestId);
      const requestSnap = await getDoc(requestRef);

      if (!requestSnap.exists()) return;

      const request = requestSnap.data();

      const friendshipId =
        [request.fromUid, request.toUid].sort().join("_");

      await setDoc(
        doc(db, "friends", friendshipId),
        {
          userA: request.fromUid,
          userB: request.toUid,
          createdAt: serverTimestamp(),
        }
      );

      await setDoc(
        requestRef,
        {
          status: "accepted",
          updatedAt: serverTimestamp(),
        },
        { merge: true }
      );

      await showPartyFriendsMainPage(
        user,
        partyFriendsActiveTab === "requests"
          ? "requests"
          : "friends"
      );
    };
  });

  document.querySelectorAll(".reject-friend-btn").forEach((button) => {

      const requestId = button.dataset.requestId;

      await setDoc(
        doc(db, "friendRequests", requestId),
        {
          status: "rejected",
          updatedAt: serverTimestamp(),
        },
        { merge: true }
      );

      await showPartyFriendsMainPage(
        user,
        partyFriendsActiveTab === "requests"
          ? "requests"
          : "friends"
      );
    };
  });


  $("open-party-btn").onclick = async () => {
    await showPartyFriendsMainPage(user, "party");
  };

  $("friend-search-btn").onclick = async () => {
    const resultEl = $("friend-search-result");
    const messageEl = $("friend-message");

    resultEl.innerHTML = "";
    messageEl.textContent = "";
    messageEl.style.color = "#ff8b8b";

    const globalId =
      normalizeId($("friend-search-id").value);

    if (!validId(globalId)) {
      messageEl.textContent =
        "正しいGlobal IDを入力してください。";
      return;
    }

    if (globalId === normalizeId(myData.globalId)) {
      messageEl.textContent =
        "自分自身にはフレンド申請できません。";
      return;
    }

    try {
      const q = query(
        collection(db, "users"),
        where("globalId", "==", globalId)
      );

      const snap = await getDocs(q);

      if (snap.empty) {
        messageEl.textContent =
          "ユーザーが見つかりませんでした。";
        return;
      }

      const targetDoc = snap.docs[0];
      const target = targetDoc.data();

      resultEl.innerHTML = `
        <div style="
          margin-top:8px;
          padding:16px;
          background:#0b1019;
          border:1px solid #263247;
          border-radius:14px;
          display:grid;
          gap:10px;
        ">
          <div>
            <strong>${target.username ?? "ユーザー"}</strong>
          </div>

          <div style="color:#9aa6ba;font-size:.9rem">
            ID：${target.globalId ?? "-"}
          </div>

          <button
            id="send-friend-request-btn"
            style="${buttonStyle(true)}"
          >
            フレンド申請
          </button>
        </div>
      `;

      $("send-friend-request-btn").onclick = async () => {
        try {
          const requestId =
            `${user.uid}_${targetDoc.id}`;

          const requestRef =
            doc(db, "friendRequests", requestId);

          const existing =
            await getDoc(requestRef);

          if (existing.exists()) {
            throw new Error(
              "すでにフレンド申請を送っています。"
            );
          }

          await setDoc(requestRef, {
            fromUid: user.uid,
            fromGlobalId: myData.globalId,
            fromUsername: myData.username,

            toUid: targetDoc.id,
            toGlobalId: target.globalId,
            toUsername: target.username,

            status: "pending",

            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
          });

          messageEl.style.color = "#9fd3a9";
          messageEl.textContent =
            `${target.username ?? target.globalId} にフレンド申請を送りました。`;

          $("send-friend-request-btn").disabled = true;
          $("send-friend-request-btn").textContent =
            "申請済み";

        } catch (error) {
          messageEl.style.color = "#ff8b8b";
          messageEl.textContent =
            error?.message ||
            "フレンド申請に失敗しました。";
        }
      };

    } catch (error) {
      messageEl.textContent =
        error?.message ||
        "ユーザー検索に失敗しました。";
    }
  };

  $("friend-back-btn").onclick = async () => {
    await showHome(user);
  };
}

function addCoinStatsPatch(data, earnedCoins) {
  const amount = Number(earnedCoins || 0);

  return {
    coins:
      Number(data.coins || 0) + amount,

    lifetimeCoinsEarned:
      Number(data.lifetimeCoinsEarned || 0) + amount,
  };
}

function getOwnedTitleNames(data) {
  return new Set(
    Array.isArray(data.titles)
      ? data.titles
      : []
  );
}

function titleCategoryName(category) {
  return {
    normal: "通常称号",
    rank: "ランク称号",
    boss: "ボス称号",
    hidden: "隠し称号",
    shop: "ショップ称号",
  }[category] || category;
}



function getTitleDefById(id) {
  return ALL_TITLE_DEFS.find(title => title.id === id);
}

function getOwnedTitlesArray(data) {
  return Array.isArray(data.titles)
    ? [...data.titles]
    : [];
}

function addOwnedTitleById(owned, id) {
  const def = getTitleDefById(id);

  if (!def) return false;
  if (owned.includes(def.name)) return false;

  owned.push(def.name);
  return true;
}

function getSubjectMinutesEntries(data) {
  const map = data.subjectStudyMinutes || {};

  return Object.entries(map)
    .map(([subject, minutes]) => ({
      subject,
      minutes: Number(minutes || 0),
      level: Math.floor(Number(minutes || 0) / 45) + 1,
    }));
}

function normalTitleCountFromNames(owned) {
  const normalNames = new Set(
    ALL_TITLE_DEFS
      .filter(t => t.category === "normal")
      .map(t => t.name)
  );

  return owned.filter(name => normalNames.has(name)).length;
}

function subjectSystemForTitle(subject) {
  if (
    ["数学IA", "数学IIBC", "数学III"].includes(subject)
  ) {
    return "数学";
  }

  if (
    ["現代文", "古文", "漢文"].includes(subject)
  ) {
    return "国語";
  }

  if (
    [
      "日本史",
      "世界史",
      "地理",
      "政治・経済",
      "倫理",
      "公共",
    ].includes(subject)
  ) {
    return "地歴公民";
  }

  if (
    [
      "化学",
      "化学基礎",
      "物理",
      "物理基礎",
      "生物",
      "生物基礎",
      "地学",
      "地学基礎",
    ].includes(subject)
  ) {
    return "理科";
  }

  if (subject === "英語") {
    return "英語";
  }

  return null;
}




async function checkHiddenTitles(user, suppliedData = null) {
  const userRef = doc(db, "users", user.uid);

  let data = suppliedData;

  if (!data) {
    const snap = await getDoc(userRef);
    if (!snap.exists()) return [];
    data = snap.data();
  }

  const owned =
    Array.isArray(data.titles)
      ? [...data.titles]
      : [];

  const before = new Set(owned);

  const unlock = (id) => {
    const def =
      ALL_TITLE_DEFS.find(t => t.id === id);

    if (def && !owned.includes(def.name)) {
      owned.push(def.name);
    }
  };

  const level =
    calculateLevelFromTotalXp(
      Number(data.xp || 0)
    ).level;

  const bossStats =
    data.bossStats || {};

  const selectedSubjects =
    Array.isArray(data.selectedSubjects)
      ? data.selectedSubjects
      : [];

  const subjectStudyMinutes =
    data.subjectStudyMinutes || {};

  const subjectLevels =
    selectedSubjects.map(subject =>
      Math.floor(
        Number(subjectStudyMinutes[subject] || 0) / 45
      ) + 1
    );

  const dailyQuests =
    Array.isArray(data.dailyQuests)
      ? data.dailyQuests
      : [];

  const todayKey =
    getJstDateKey();

  const isStudyToday =
    data.dailyStudyDate === todayKey;

  const isXpToday =
    data.dailyXpDate === todayKey;

  const isRewardFlagToday =
    data.dailyRewardFlagDate === todayKey;

  const todayMinutes =
    isStudyToday
      ? Number(data.todayStudyMinutes || 0)
      : 0;

  const todayXp =
    isXpToday
      ? Number(data.dailyXpEarned || 0)
      : 0;

  const todaySubjectMinutes =
    isStudyToday
      ? (data.todaySubjectStudyMinutes || {})
      : {};

  // hidden-01
  if (
    (Number(data.stars || 0) >= 1 || level >= 100) &&
    calculateRank(
      Number(data.monthlyStudyMinutes || 0)
    ) === "Legend" &&
    new Set(
      bossStats.defeatedLv10Systems || []
    ).size >= 5
  ) {
    unlock("hidden-01");
  }

  // hidden-02
  if (todayMinutes >= 600) {
    unlock("hidden-02");
  }

  // hidden-03
  if (todayXp >= 1000) {
    unlock("hidden-03");
  }

  // hidden-04
  if (
    Object.values(todaySubjectMinutes)
      .some(minutes => Number(minutes || 0) >= 300)
  ) {
    unlock("hidden-04");
  }

  // hidden-05
  if (
    subjectLevels.length > 0 &&
    subjectLevels.every(level => level >= 50)
  ) {
    unlock("hidden-05");
  }

  // hidden-06
  if (
    dailyQuests.length === 3 &&
    dailyQuests.every(
      quest =>
        quest.completed === true ||
        quest.rewardGranted === true
    )
  ) {
    unlock("hidden-06");
  }

  // hidden-07
  if (
    isRewardFlagToday &&
    data.todayEarnedXpFlag === true &&
    data.todayEarnedCoinsFlag === true &&
    data.todayEarnedItemFlag === true
  ) {
    unlock("hidden-07");
  }

  // hidden-08
  if (selectedSubjects.length > 0 && todayMinutes > 0) {
    const levels =
      selectedSubjects.map(subject => ({
        subject,
        level:
          Math.floor(
            Number(subjectStudyMinutes[subject] || 0) / 45
          ) + 1,
      }));

    const lowest =
      Math.min(...levels.map(x => x.level));

    const lowestSubjects =
      levels
        .filter(x => x.level === lowest)
        .map(x => x.subject);

    const lowToday =
      lowestSubjects.reduce(
        (sum, subject) =>
          sum +
          Number(todaySubjectMinutes[subject] || 0),
        0
      );

    if (lowToday / todayMinutes >= 0.5) {
      unlock("hidden-08");
    }
  }

  // hidden-09
  if (
    Number(data.lifetimeCoinsSpent || 0) >= 100000
  ) {
    unlock("hidden-09");
  }

  // hidden-10
  const rareHistory =
    Array.isArray(data.rareHistory)
      ? data.rareHistory
      : [];

  if (
    rareHistory.length >= 3 &&
    rareHistory
      .slice(-3)
      .every(entry =>
        Number(entry.targetMinutes || 0) === 180
      )
  ) {
    unlock("hidden-10");
  }

  const newlyUnlocked =
    owned.filter(name => !before.has(name));

  if (newlyUnlocked.length > 0) {
    await setDoc(
      userRef,
      {
        titles: owned,
        updatedAt: serverTimestamp(),
      },
      { merge: true }
    );
  }

  return newlyUnlocked;
}
