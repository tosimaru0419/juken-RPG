<style id="juken-rpg-dark-fantasy-theme">

/* =========================================================
   ASCEND
   Dark Fantasy × Study RPG
   CURRENT THEME OVERRIDE
========================================================= */

:root {
  --bg-dark: #080a10;
  --bg-main: #0c0f17;
  --bg-card: #121722;
  --bg-card-hover: #171d2b;
  --bg-input: #0b0e15;

  --border: rgba(255,255,255,.08);
  --border-light: rgba(255,255,255,.13);

  --text-main: #f3f5f8;
  --text-sub: #a8afbd;
  --text-muted: #6f7786;

  --accent: #7c5cff;
  --accent-light: #9b83ff;
  --accent-dark: #5940d8;

  --cyan: #35c9ff;
  --green: #42d392;
  --yellow: #ffd166;
  --orange: #ff9f43;
  --red: #ff5d73;

  --shadow:
    0 12px 40px rgba(0,0,0,.35);

  --radius: 18px;
  --radius-small: 12px;

  --transition:
    180ms cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   BASE
========================================================= */

html {
  min-height: 100%;
  background: var(--bg-dark) !important;
}

body {
  margin: 0 !important;
  min-height: 100vh;

  color: var(--text-main) !important;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(124,92,255,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 30%,
      rgba(53,201,255,.06),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #080a10 0%,
      #0b0e16 50%,
      #090b11 100%
    ) !important;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif !important;

  -webkit-font-smoothing:
    antialiased;

  text-rendering:
    optimizeLegibility;
}


body::before {
  content: "";

  position: fixed;
  inset: 0;

  pointer-events: none;
  z-index: -1;

  background-image:
    radial-gradient(
      rgba(255,255,255,.035) 1px,
      transparent 1px
    );

  background-size:
    26px 26px;

  mask-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.8),
      transparent 90%
    );

  opacity: .35;
}


button,
input,
select,
textarea {
  font: inherit;
}


button {
  cursor: pointer;
}


.hidden {
  display: none !important;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
  width: 7px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background:
    rgba(255,255,255,.12);

  border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
  background:
    rgba(255,255,255,.22);
}


/* =========================================================
   APP / PAGE WIDTH
========================================================= */

#app {
  min-height: 100vh;

  padding-bottom:
    calc(
      76px +
      env(safe-area-inset-bottom)
    ) !important;
}


#app > div,
#app > main {
  width:
    min(
      calc(100% - 28px),
      1080px
    );

  margin-left: auto !important;
  margin-right: auto !important;
}


/* =========================================================
   GENERIC CARD
========================================================= */

.card,
#app > div > div {
  color: var(--text-main);
}


.card {
  background:
    linear-gradient(
      145deg,
      rgba(18,23,34,.96),
      rgba(13,17,26,.96)
    ) !important;

  border:
    1px solid var(--border) !important;

  border-radius:
    var(--radius) !important;

  box-shadow:
    0 8px 28px rgba(0,0,0,.16),
    inset 0 1px rgba(255,255,255,.035) !important;
}


/* =========================================================
   CONTENT SECTIONS
========================================================= */

#app section {
  position: relative;

  margin-bottom: 18px !important;

  border-radius:
    var(--radius) !important;

  border:
    1px solid var(--border) !important;

  background:
    linear-gradient(
      145deg,
      rgba(18,23,34,.94),
      rgba(13,17,26,.94)
    ) !important;

  box-shadow:
    0 8px 28px rgba(0,0,0,.16),
    inset 0 1px rgba(255,255,255,.035) !important;

  overflow: hidden;

  transition:
    border-color var(--transition),
    transform var(--transition),
    box-shadow var(--transition);
}


#app section:hover {
  border-color:
    rgba(255,255,255,.105) !important;
}


/* =========================================================
   HEADINGS
========================================================= */

#app h1,
#app h2,
#app h3,
#app h4 {
  color: var(--text-main);
}


#app h1 {
  letter-spacing: -.02em;
}


#app h2 {
  font-weight: 850;
}


/* =========================================================
   INPUTS
========================================================= */

#app input,
#app select,
#app textarea {
  width: 100%;

  color:
    var(--text-main) !important;

  background:
    var(--bg-input) !important;

  border:
    1px solid var(--border) !important;

  border-radius:
    11px !important;

  padding:
    12px 13px !important;

  outline: none;

  transition:
    border-color var(--transition),
    box-shadow var(--transition),
    background var(--transition);
}


#app input:focus,
#app select:focus,
#app textarea:focus {
  border-color:
    rgba(124,92,255,.65) !important;

  box-shadow:
    0 0 0 3px rgba(124,92,255,.12),
    0 0 24px rgba(124,92,255,.08) !important;

  background:
    #0d1019 !important;
}


/* =========================================================
   BUTTONS
========================================================= */

#app button:not(
  .persistent-main-nav-btn
):not(
  .persistent-top-tab
) {
  border-radius:
    11px !important;

  transition:
    transform var(--transition),
    box-shadow var(--transition),
    filter var(--transition),
    background var(--transition),
    border-color var(--transition);
}


#app button:not(
  .persistent-main-nav-btn
):not(
  .persistent-top-tab
):hover {
  transform:
    translateY(-2px);
}


/* =========================================================
   PLAYER / HOME STYLE
========================================================= */

#app section:first-of-type {
  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(124,92,255,.16),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      #151a28,
      #0e121c
    ) !important;
}


/* XPっぽい横バー */
#app div[style*="height:7px"],
#app div[style*="height: 7px"],
#app div[style*="height:8px"],
#app div[style*="height: 8px"] {
  background:
    rgba(0,0,0,.42) !important;

  border-radius:
    999px !important;
}


/* 紫〜シアンの進捗 */
#app div[style*="width:${xpPercent}%"] {
  background:
    linear-gradient(
      90deg,
      #694cf1,
      #a994ff,
      #35c9ff
    ) !important;

  box-shadow:
    0 0 15px
    rgba(124,92,255,.4) !important;
}


/* =========================================================
   TOP TAB NAVIGATION
========================================================= */

#persistent-top-tabs {
  position: sticky !important;

  top: -12px !important;

  z-index: 80 !important;

  width:
    min(
      calc(100% - 28px),
      1080px
    ) !important;

  margin:
    0 auto
    18px !important;

  padding:
    5px !important;

  gap:
    7px !important;

  background:
    rgba(0,0,0,.18) !important;

  border:
    1px solid
    var(--border) !important;

  border-radius:
    13px !important;

  box-shadow:
    none !important;

  backdrop-filter:
    blur(16px);
}


.persistent-top-tab {
  min-height:
    42px !important;

  border:
    0 !important;

  border-radius:
    9px !important;

  padding:
    10px 13px !important;

  color:
    var(--text-muted) !important;

  background:
    transparent !important;

  font-size:
    12px !important;

  font-weight:
    800 !important;

  transition:
    background var(--transition),
    color var(--transition),
    transform var(--transition) !important;
}


.persistent-top-tab:hover {
  color:
    var(--text-main) !important;

  background:
    rgba(255,255,255,.05) !important;
}


.persistent-top-tab.active {
  color:
    white !important;

  background:
    linear-gradient(
      135deg,
      rgba(124,92,255,.85),
      rgba(89,64,216,.85)
    ) !important;

  border:
    0 !important;

  box-shadow:
    0 5px 16px
    rgba(124,92,255,.18) !important;
}


/* =========================================================
   BOTTOM NAVIGATION
   ★ 浮かせない
========================================================= */

#persistent-bottom-nav {
  position:
    fixed !important;

  left:
    0 !important;

  right:
    0 !important;

  bottom:
    0 !important;

  transform:
    none !important;

  z-index:
    9999 !important;

  width:
    100% !important;

  max-width:
    none !important;

  min-height:
    70px !important;

  display:
    grid !important;

  grid-template-columns:
    repeat(
      6,
      minmax(0,1fr)
    ) !important;

  gap:
    4px !important;

  padding:
    7px
    max(
      7px,
      calc(
        (100vw - 1080px) / 2
      )
    )
    calc(
      7px +
      env(safe-area-inset-bottom)
    ) !important;

  background:
    rgba(11,14,21,.96) !important;

  border:
    0 !important;

  border-top:
    1px solid
    var(--border-light) !important;

  border-radius:
    0 !important;

  box-shadow:
    0 -8px 30px
    rgba(0,0,0,.35) !important;

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);
}


.persistent-main-nav-btn {
  min-width: 0 !important;

  min-height:
    56px !important;

  display:
    flex !important;

  flex-direction:
    column !important;

  align-items:
    center !important;

  justify-content:
    center !important;

  gap:
    3px !important;

  padding:
    5px 2px !important;

  border:
    0 !important;

  border-radius:
    13px !important;

  color:
    var(--text-muted) !important;

  background:
    transparent !important;

  transition:
    color var(--transition),
    background var(--transition),
    transform var(--transition) !important;
}


.persistent-main-nav-btn:hover {
  color:
    var(--text-main) !important;

  background:
    rgba(255,255,255,.045) !important;
}


.persistent-main-nav-btn
.nav-icon {
  font-size:
    19px !important;

  line-height:
    1 !important;

  transition:
    transform .25s
    cubic-bezier(.16,1,.3,1);
}


.persistent-main-nav-btn
.nav-label {
  font-size:
    9px !important;

  line-height:
    1 !important;

  font-weight:
    800 !important;
}


.persistent-main-nav-btn.active {
  color:
    #fff !important;

  background:
    linear-gradient(
      145deg,
      rgba(124,92,255,.28),
      rgba(124,92,255,.09)
    ) !important;

  box-shadow:
    inset 0 0 0 1px
    rgba(124,92,255,.15) !important;
}


.persistent-main-nav-btn.active
.nav-icon {
  transform:
    translateY(-1px)
    scale(1.08);

  filter:
    drop-shadow(
      0 0 8px
      rgba(124,92,255,.45)
    ) !important;
}


/* 以前の青い上ラインを削除 */
.persistent-main-nav-btn.active::before {
  display:
    none !important;
}


/* =========================================================
   QUEST / LIST ITEMS
========================================================= */

#app [style*="background:#0b1019"],
#app [style*="background: #0b1019"],
#app [style*="background:#111722"],
#app [style*="background: #111722"] {
  background:
    rgba(255,255,255,.025) !important;

  border-color:
    var(--border) !important;
}


/* =========================================================
   BOSS
========================================================= */

#app [style*="255,56,100"],
#app [style*="255, 56, 100"] {
  border-color:
    rgba(255,93,115,.18) !important;
}


/* =========================================================
   OTHER MENU BUTTONS
========================================================= */

#other-profile,
#other-shop,
#other-locker,
#other-titles,
#other-settings {
  min-height:
    64px !important;

  padding:
    15px 17px !important;

  text-align:
    left !important;

  color:
    var(--text-main) !important;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.018)
    ) !important;

  border:
    1px solid
    var(--border) !important;

  box-shadow:
    none !important;
}


#other-profile:hover,
#other-shop:hover,
#other-locker:hover,
#other-titles:hover,
#other-settings:hover {
  background:
    linear-gradient(
      145deg,
      rgba(124,92,255,.1),
      rgba(255,255,255,.025)
    ) !important;

  border-color:
    rgba(124,92,255,.25) !important;
}


/* =========================================================
   AUTH
========================================================= */

#auth-screen {
  min-height:
    100vh;

  background:
    transparent !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  #app > div,
  #app > main {
    width:
      min(
        calc(100% - 18px),
        1080px
      );
  }


  #persistent-top-tabs {
    width:
      calc(100% - 18px) !important;

    margin-bottom:
      14px !important;
  }


  #persistent-bottom-nav {
    padding-left:
      3px !important;

    padding-right:
      3px !important;
  }


  .persistent-main-nav-btn {
    min-height:
      53px !important;
  }


  .persistent-main-nav-btn
  .nav-icon {
    font-size:
      17px !important;
  }


  .persistent-main-nav-btn
  .nav-label {
    font-size:
      8px !important;
  }

}


/* =========================================================
   VERY SMALL
========================================================= */

@media (max-width: 380px) {

  .persistent-main-nav-btn
  .nav-icon {
    font-size:
      16px !important;
  }


  .persistent-main-nav-btn
  .nav-label {
    font-size:
      7px !important;
  }

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes rpgScreenEnter {

  from {
    opacity: 0;
    transform:
      translateY(8px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}


#app > div {
  animation:
    rpgScreenEnter
    .35s
    cubic-bezier(.16,1,.3,1);
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (
  prefers-reduced-motion:
  reduce
) {

  *,
  *::before,
  *::after {
    animation-duration:
      .01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      .01ms !important;
  }

}

</style>

  width: 128px;
  height: 128px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  color: var(--boss-color);

  font-size: 54px;
  font-weight: 1000;

  background:
    radial-gradient(
      circle at 40% 30%,
      rgba(255,255,255,.09),
      rgba(var(--boss-color-rgb), .11) 45%,
      rgba(0,0,0,.15) 70%
    );

  border:
    1px solid
    rgba(var(--boss-color-rgb), .32);

  box-shadow:
    0 0 24px rgba(var(--boss-color-rgb), .18),
    0 0 65px rgba(var(--boss-color-rgb), .08),
    inset 0 0 24px rgba(var(--boss-color-rgb), .08);

  text-shadow:
    0 0 18px rgba(var(--boss-color-rgb), .55);

  animation:
    bossFloat
    3.2s ease-in-out infinite;
}


/* =========================================================
   HEADER
========================================================= */

.boss-main-info {
  display: grid;
  gap: 15px;

  padding: 18px;
}


.boss-name-row {
  display: flex;

  align-items: flex-start;
  justify-content: space-between;

  gap: 12px;
}


.boss-name-wrap {
  min-width: 0;
}


.boss-caption {
  margin-bottom: 4px;

  color: var(--boss-color);

  font-size: 9px;
  font-weight: 900;

  letter-spacing: .18em;

  opacity: .8;
}


.boss-ui-name {
  display: block;

  color: #f5f7ff;

  font-size: 1.38rem;
  font-weight: 950;

  line-height: 1.25;

  text-shadow:
    0 0 22px rgba(var(--boss-color-rgb), .15);
}


.boss-level-badge {
  flex: 0 0 auto;

  padding: 7px 10px;

  border-radius: 9px;

  color: var(--boss-color);

  background:
    rgba(var(--boss-color-rgb), .08);

  border:
    1px solid
    rgba(var(--boss-color-rgb), .20);

  font-size: 11px;
  font-weight: 900;
}


/* =========================================================
   WEAKNESS
========================================================= */

.boss-weakness-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0,1fr));

  gap: 8px;
}


.boss-info-chip {
  min-width: 0;

  padding: 10px 11px;

  border-radius: 11px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(255,255,255,.07);
}


.boss-info-chip span {
  display: block;

  margin-bottom: 4px;

  color: #6f7786;

  font-size: 9px;

  font-weight: 800;
}


.boss-info-chip strong {
  display: block;

  overflow: hidden;

  text-overflow: ellipsis;

  color: #e9edf5;

  font-size: 12px;

  white-space: nowrap;
}


.boss-info-chip.weakness strong {
  color: var(--boss-color);
}


/* =========================================================
   HP
========================================================= */

.boss-hp-area {
  display: grid;
  gap: 7px;
}


.boss-hp-label {
  display: flex;

  justify-content: space-between;

  gap: 15px;

  color: #a8afbd;

  font-size: 11px;

  font-weight: 800;
}


.boss-hp-label strong {
  color: #f3f5f8;

  font-variant-numeric:
    tabular-nums;
}


.boss-hp-track {
  position: relative;

  height: 15px;

  padding: 2px;

  overflow: hidden;

  border-radius: 999px;

  background:
    rgba(0,0,0,.48);

  border:
    1px solid
    rgba(255,255,255,.055);
}


.boss-hp-fill {
  position: relative;

  height: 100%;

  overflow: hidden;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      var(--boss-color-2),
      var(--boss-color)
    );

  box-shadow:
    0 0 15px
    rgba(var(--boss-color-rgb), .28);

  transition:
    width .8s cubic-bezier(.16,1,.3,1);
}


.boss-hp-fill::after {
  content: "";

  position: absolute;

  top: 0;
  bottom: 0;

  width: 45%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.28),
      transparent
    );

  transform:
    skewX(-20deg);

  animation:
    bossHpShine
    2.5s linear infinite;
}


/* =========================================================
   CONTRIBUTION
========================================================= */

.boss-contribution-grid {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0,1fr));

  gap: 8px;

  padding-top: 13px;

  border-top:
    1px solid
    rgba(255,255,255,.07);
}


.boss-contribution-item {
  min-width: 0;

  text-align: center;

  padding: 8px 4px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.018);
}


.boss-contribution-item span {
  display: block;

  margin-bottom: 4px;

  color: #6f7786;

  font-size: 8px;

  font-weight: 800;
}


.boss-contribution-item strong {
  display: block;

  overflow: hidden;

  color: #f3f5f8;

  font-size: 12px;

  text-overflow: ellipsis;

  white-space: nowrap;
}


.boss-contribution-item.rate strong {
  color: var(--boss-color);
}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes bossCardEnter {

  from {
    opacity: 0;

    transform:
      translateY(12px)
      scale(.975);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }

}


@keyframes bossFloat {

  0%,
  100% {
    transform:
      translateY(0)
      scale(1);
  }

  50% {
    transform:
      translateY(-9px)
      scale(1.025);
  }

}


@keyframes bossAuraPulse {

  0%,
  100% {
    transform:
      scale(.92);

    opacity: .55;
  }

  50% {
    transform:
      scale(1.12);

    opacity: 1;
  }

}


@keyframes bossAuraRing {

  0%,
  100% {
    transform:
      scale(.86)
      rotate(0deg);

    opacity: .35;
  }

  50% {
    transform:
      scale(1.06)
      rotate(8deg);

    opacity: .8;
  }

}


@keyframes bossHpShine {

  from {
    left: -60%;
  }

  to {
    left: 130%;
  }

}


/* 英語ボスだけ少し機械的に */
.boss-theme-english .boss-visual {

  animation:
    bossEnglishFloat
    3.4s steps(1,end) infinite;

}


@keyframes bossEnglishFloat {

  0%,
  88%,
  100% {
    transform:
      translate(0,0);
  }

  90% {
    transform:
      translate(-2px,1px);
  }

  92% {
    transform:
      translate(2px,-1px);
  }

  94% {
    transform:
      translate(-1px,0);
  }

}


/* 理科ボスはたまに閃光 */
.boss-theme-science .boss-visual {

  animation:
    bossScienceFloat
    3s linear infinite;

}


@keyframes bossScienceFloat {

  0%,
  8%,
  12%,
  100% {
    transform:
      translateY(0);

    filter:
      brightness(1);
  }

  9% {
    transform:
      translateY(-2px);

    filter:
      brightness(1.8);
  }

  10% {
    transform:
      translateY(1px);

    filter:
      brightness(1.15);
  }

  55% {
    transform:
      translateY(-8px);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:600px) {

  .boss-stage {
    min-height: 205px;
  }


  .boss-visual {
    width: 110px;
    height: 110px;

    font-size: 46px;
  }


  .boss-main-info {
    padding: 15px;
  }


  .boss-ui-name {
    font-size: 1.18rem;
  }


  .boss-weakness-grid {
    grid-template-columns: 1fr;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  .boss-battle-card,
  .boss-stage::before,
  .boss-aura,
  .boss-visual,
  .boss-hp-fill::after {
    animation: none !important;
  }

}

</style>

<script id="ascend-auto-update-v1">
(() => {
  const IS_STANDALONE =
    window.matchMedia?.("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  if (!IS_STANDALONE) return;

  const KEY = "ascend_latest_html_hash_v1";

  function hashText(text) {
    let h = 2166136261;

    for (let i = 0; i < text.length; i++) {
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }

    return (h >>> 0).toString(16);
  }

  async function checkAscendUpdate() {
    try {
      const url =
        new URL("./index.html", location.href);

      url.searchParams.set(
        "__ascend_check",
        Date.now().toString()
      );

      const response =
        await fetch(url.href, {
          cache: "no-store"
        });

      if (!response.ok) return;

      const html =
        await response.text();

      const latestHash =
        hashText(html);

      const previousHash =
        localStorage.getItem(KEY);

      if (!previousHash) {
        localStorage.setItem(
          KEY,
          latestHash
        );
        return;
      }

      if (previousHash === latestHash) {
        return;
      }

      localStorage.setItem(
        KEY,
        latestHash
      );

      const reloadUrl =
        new URL("./", location.href);

      reloadUrl.searchParams.set(
        "__ascend_version",
        latestHash
      );

      location.replace(
        reloadUrl.href
      );

    } catch (error) {
      console.warn(
        "ASCEND UPDATE CHECK:",
        error
      );
    }
  }

  window.addEventListener(
    "pageshow",
    () => {
      setTimeout(
        checkAscendUpdate,
        800
      );
    },
    { once: true }
  );
})();
</script>

function xpNeededForLevel(level) {
  if (level >= 100) return 0;

function calculateLevelFromTotalXp(totalXp) {
  let level = 1;
  let remainingXp = Math.max(0, Number(totalXp || 0));

  while (level < 100) {
    const needed = xpNeededForLevel(level);

    if (remainingXp < needed) break;

    remainingXp -= needed;
    level++;
  }

  return {
    level,
    currentXp: remainingXp,
    neededXp: level >= 100 ? 0 : xpNeededForLevel(level),
  };
}

function normalizeDisplayedTitle(text) {

  return String(text || "")
    .trim()
    .replace(
      /^称号\s*[:：]\s*/,
      ""
    )
    .replace(
      /^『/,
      ""
    )
    .replace(
      /』$/,
      ""
    )
    .trim();

}


// ============================================================
// APPLY BOSS TITLE EFFECT
// ============================================================

function decorateBossTitles() {

  /*
    「装備中の称号表示」に使われそうな
    要素だけを見る。

    称号一覧そのものには基本的に
    エフェクトを付けない。
  */

  const selectors = [

    ".home-player-title",

    ".player-title",

    ".profile-title",

    ".locker-player-title",

    ".friend-profile-title",

    "#home-equipped-title",

    "#profile-equipped-title",

    "#locker-equipped-title",

    "[data-equipped-title]",

  ];


  document
    .querySelectorAll(
      selectors.join(",")
    )
    .forEach(element => {

      const title =
        normalizeDisplayedTitle(
          element.textContent
        );


      const animationClass =
        BOSS_TITLE_ANIMATION_MAP[
          title
        ];


      /*
        一旦ボス称号用クラスだけ消す
      */

      element.classList.remove(

        "boss-title-animated",

        "boss-title-math",

        "boss-title-japanese",

        "boss-title-history",

        "boss-title-science",

        "boss-title-english"

      );


      if (!animationClass) {
        return;
      }


      element.classList.add(
        "boss-title-animated",
        animationClass
      );


      element.dataset.bossTitle =
        title;

    });

}

function startBossTitleAnimationSystem() {

  // 初回だけ確認
  if (document.querySelector(".boss-battle-card")) {

  if (bossTitleObserver) {

  bossTitleObserver =
    new MutationObserver(() => {

      // ボス画面以外では何もしない
      if (
        !document.querySelector(
          ".boss-battle-card"
        )
      ) {
        return;
      }

      decorateBossTitles();

    });


  bossTitleObserver.observe(
    document.body,
    {
      childList: true,
      subtree: true,
    }
  );

}

async function showRankPage(user) {

  const ref =
    doc(db, "users", user.uid);

  const snap =
    await getDoc(ref);

  if (!snap.exists()) {
    throw new Error(
      "ユーザーデータが見つかりません。"
    );
  }

  const data =
    snap.data();


  // ==========================================================
  // CURRENT DATA
  // ==========================================================

  const monthlyMinutes =
    Math.max(
      0,
      Number(
        data.monthlyStudyMinutes ?? 0
      )
    );


  const rankMonthlyMinutes =
    monthlyMinutes +
    Math.max(
      0,
      Number(
        data.monthlyStudyLinkBonusMinutes ?? 0
      )
    );


  const currentRank =
    calculateRank(
      rankMonthlyMinutes
    );


  const rankSteps = [

    ["Bronze III", 0],
    ["Bronze II", 120],
    ["Bronze I", 240],

    ["Silver III", 480],
    ["Silver II", 720],
    ["Silver I", 960],

    ["Gold III", 1320],
    ["Gold II", 1680],
    ["Gold I", 2040],

    ["Platinum III", 2520],
    ["Platinum II", 3000],
    ["Platinum I", 3480],

    ["Diamond III", 4080],
    ["Diamond II", 4680],
    ["Diamond I", 5280],

    ["Master", 6600],
    ["Grandmaster", 8400],
    ["Legend", 10200],

  ].map(
    ([name, minutes]) => ({
      name,
      minutes,
    })
  );


  let currentIndex =
    rankSteps.findIndex(
      step =>
        step.name === currentRank
    );


  if (currentIndex < 0) {
    currentIndex = 0;
  }


  const currentStep =
    rankSteps[currentIndex];


  const nextStep =
    rankSteps[
      currentIndex + 1
    ] ?? null;


  let progress = 100;
  let remaining = 0;


  if (nextStep) {

    const range =
      nextStep.minutes -
      currentStep.minutes;


    const gained =
      rankMonthlyMinutes -
      currentStep.minutes;


    progress =
      Math.max(
        0,
        Math.min(
          100,
          gained / range * 100
        )
      );


    remaining =
      Math.max(
        0,
        nextStep.minutes -
        rankMonthlyMinutes
      );

  }


  function formatTime(minutes) {

    const safe =
      Math.max(
        0,
        Number(minutes || 0)
      );

    const hours =
      Math.floor(
        safe / 60
      );

    const mins =
      safe % 60;


    if (!mins) {
      return `${hours}h`;
    }


    if (!hours) {
      return `${mins}m`;
    }


    return `${hours}h ${mins}m`;

  }


  const remainingText =
    nextStep
      ? (
          remaining >= 60
            ? `あと ${formatTime(remaining)}`
            : `あと ${remaining}分`
        )
      : "最高ランク到達";


  const now =
    new Date();


  const seasonLabel =
    `${now.getFullYear()}.${String(
      now.getMonth() + 1
    ).padStart(2, "0")}`;



  const rankedSeasonKeyV1 =
    getCurrentRankedSeasonKeyV1();

  const rankedEnteredV1 =

  const getRankedScoreV1 = userData => {

    const stored =
      Number(
        userData.rankedScoreMinutes
      );

    if (Number.isFinite(stored)) {
      return Math.max(0, stored);
    }

    return (
      Math.max(

        Number(

        )

        0,

          userData.monthlyStudyLinkBonusMinutes ?? 0

  const rankPageV1 =

    rankTabV1.onclick = () => {

      );

    document.getElementById("asc-lb-global-tab-v1");

    document.getElementById("asc-lb-friends-panel-v1");

  const lbGlobalPanelV1 =
    document.getElementById("asc-lb-global-panel-v1");

  if (
    lbFriendsTabV1 &&
    lbGlobalTabV1 &&
    lbFriendsPanelV1 &&
    lbGlobalPanelV1
  ) {
    lbFriendsTabV1.onclick = () => {
      lbFriendsTabV1.classList.add("active");
      lbGlobalTabV1.classList.remove("active");
      lbFriendsPanelV1.hidden = false;
      lbGlobalPanelV1.hidden = true;
    };

    lbGlobalTabV1.onclick = () => {
      lbGlobalTabV1.classList.add("active");
      lbFriendsTabV1.classList.remove("active");
      lbGlobalPanelV1.hidden = false;
      lbFriendsPanelV1.hidden = true;
    };
  }


  // ==========================================================
  // GLOBAL RANKED LEADERBOARD
  // ==========================================================

  const globalLeaderboardV1 =
    document.getElementById(
      "asc-lb-global-list-v1"
    );

  if (globalLeaderboardV1) {

    try {

      const globalSnapV1 =
        await getDocs(
          query(
            collection(db, "users"),
            where(
              "rankedSeason",
              "==",
              rankedSeasonKeyV1
            )
          )
        );


      const globalRowsV1 = [];


      globalSnapV1.forEach(userDoc => {

        const userData =
          userDoc.data();


        if (
          String(
            userData.rankedVisibility ??
            "global"
          ) !== "global"
        ) {
          return;
        }


        const score =
          getRankedScoreV1(
            userData
          );


        globalRowsV1.push({

          uid:
            userDoc.id,

          username:
            userData.username ??
            "ユーザー",

          score,

          rank:
            calculateRank(score),

          level:
            calculateLevelFromTotalXp(
              Number(
                userData.xp ?? 0
              )
            ).level,

          isYou:
            userDoc.id === user.uid

        });

      });


      globalRowsV1.sort(
        (a, b) =>
          b.score - a.score ||
          String(a.username)
            .localeCompare(
              String(b.username),
              "ja"
            )
      );


      const ownGlobalIndexV1 =
        globalRowsV1.findIndex(
          row => row.uid === user.uid
        );


      const ownGlobalPositionV1 =
        ownGlobalIndexV1 >= 0
          ? ownGlobalIndexV1 + 1
          : null;


      let nextGlobalHtmlV1 = "";


      if (ownGlobalIndexV1 === 0) {

        nextGlobalHtmlV1 = "";

      }

      else if (ownGlobalIndexV1 > 0) {

        const you =
          globalRowsV1[
            ownGlobalIndexV1
          ];

        const next =
          globalRowsV1[
            ownGlobalIndexV1 - 1
          ];

        const difference =
          Math.max(
            0,
            next.score - you.score
          );


        nextGlobalHtmlV1 = `
          <div class="asc-lb-next-v1">

            <span>
              CURRENT
              <strong>
                #${ownGlobalPositionV1}
              </strong>
            </span>

              <strong>
                #${ownGlobalPositionV1 - 1}
              </strong>
            </span>

            <span>
              GAP
              <strong>
                ${formatRankedTimeV1(
                  difference
                )}
              </strong>
            </span>

          </div>
        `;

      }


      const renderGlobalRowV1 =
        (row, index, outside = false) => {

          const position =
            index + 1;

          return `
            <div
              class="
                asc-lb-row-v1
                ${
                  position <= 3
                    ? `top-${position}`
                    : ""
                }
                ${
                  row.isYou
                    ? "is-you"
                    : ""
                }
                ${
                  outside
                    ? "outside-top-v1"
                    : ""
                }

function mountMainScreenEnglishLabel() {

  const labels = {
    home: "HOME",
    study: "STUDY",
    quest: "QUEST",
    party: "PARTY",
    rank: "RANK",
    other: "OTHERS",
  };


  const label =
    labels[currentMainTab];

  if (!label) {
    return;
  }


  const card =
    document.querySelector(
      "body > main > section"
    );

  if (!card) {
    return;
  }


  const title =
    card.querySelector(
      ".screen-header h2, :scope > h1, h1"
    );

  if (!title) {
    return;
  }


  /*
    その他画面には既に
    OTHER の表記があるので再利用する
  */

  const previous =
    title.previousElementSibling;

  const previousText =
    previous?.textContent
      ?.trim()
      ?.toUpperCase();


  if (
    previous &&
    [
      "OTHER",
      "OTHERS",
      "HOME",
      "STUDY",
      "QUEST",
      "PARTY",
      "RANK",
    ].includes(previousText)
  ) {

    previous.textContent =
      label;

    previous.classList.add(
      "main-screen-english"
    );

    return;
  }


  card
    .querySelectorAll(
      ".main-screen-english"
    )
    .forEach(element => {
      element.remove();
    });


  const element =
    document.createElement(
      "div"
    );

  element.className =
    "main-screen-english";

  element.textContent =
    label;


  title.insertAdjacentElement(
    "beforebegin",
    element
  );

}

const STUDY_LINK_V2_CHARS =
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


function normalizeStudyLinkV2Code(value) {

  return String(value || "")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .slice(0, 6);

}


function generateStudyLinkV2Code() {

  let code = "";

  for (let i = 0; i < 6; i++) {

    code +=
      STUDY_LINK_V2_CHARS[
        Math.floor(
          Math.random() *
          STUDY_LINK_V2_CHARS.length
        )
      ];

  }

  return code;

}


function studyLinkV2RoomRef(code) {

  return doc(
    db,
    "studyLinkRooms",
    code
  );

}


function studyLinkV2MemberRef(
  code,
  uid
) {

  return doc(
    db,

    uid
  );

}


async function getStudyLinkV2User(user) {

  const ref =
    doc(
      db,

  const snap =

  return {

  };

}



async function renderStudyLinkMembersV2(
  code,
  user
) {

  const container =
    document.getElementById(
      "study-link-v2-members"
    );

  const count =
    document.getElementById(
      "study-link-v2-member-count"
    );


  if (!container || !count) {
    return;
  }


  try {

    const snap =
      await getDocs(
        collection(
          db,
          "studyLinkRooms",
          code,
          "members"
        )
      );


    const members =
      snap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    members.sort(
      (a,b) => {

        if (
          a.id === user.uid &&
          b.id !== user.uid
        ) {
          return -1;
        }

        if (
          b.id === user.uid &&
          a.id !== user.uid
        ) {
          return 1;
        }

        return String(
          a.username || ""
        ).localeCompare(
          String(
            b.username || ""
          ),
          "ja"
        );

      }
    );


    count.textContent =
      String(members.length);


    if (!members.length) {

      container.innerHTML = `
        <div class="study-link-v2-members-empty">
          メンバーはいません
        </div>
      `;

      return;

    }


    container.innerHTML =
      members.map(member => {

        const name =
          String(
            member.username ||
            "PLAYER"
          );

        const isYou =
          member.id === user.uid;

        const state =
          String(
            member.state ||
            "idle"
          ).toLowerCase();

        let stateLabel =
          "IDLE";

        let stateClass =
          "";

        let detail =
          "待機中";


        if (state === "studying") {

          stateLabel =
            "STUDYING";

          stateClass =
            "studying";

          detail =
            member.subject
              ? String(member.subject)
              : "勉強中";

        }

        else if (state === "paused") {

          stateLabel =
            "PAUSED";

          stateClass =
            "paused";

          detail =
            member.subject
              ? String(member.subject)
              : "一時停止中";

        }


        const safeName =
          name
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");

        const safeDetail =
          detail
            .replaceAll("&","&amp;")
            .replaceAll("<","&lt;")
            .replaceAll(">","&gt;")
            .replaceAll('"',"&quot;")
            .replaceAll("'","&#039;");


        return `

          <div class="study-link-v2-member">

            <div class="study-link-v2-member-main">

              <div class="study-link-v2-member-name">

                ${safeName}

                ${
                  isYou
                    ? '<span class="study-link-v2-you">YOU</span>'
                    : ''
                }

              </div>

              <div class="study-link-v2-member-sub">
                ${safeDetail}
              </div>

            </div>


            <div
              class="
                study-link-v2-member-state
                ${stateClass}
              "
            >
              ${stateLabel}
            </div>

          </div>

        `;

      }).join("");

  }

  catch (error) {

    console.error(
      "STUDY LINK members:",
      error
    );

    container.innerHTML = `
      <div class="study-link-v2-members-empty">
        メンバーを取得できませんでした
      </div>
    `;

  }

}

  try {

    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          user.uid
        )
      );


    if (!userSnap.exists()) {
      return;
    }


    const data =
      userSnap.data();


    const code =
      normalizeStudyLinkV2Code(
        data.studyLinkRoomCode ||
        ""
      );


    if (!code) {

      disableStudyLinkRoomModeV1();

      return;

    }


    const roomSnap =
      await getDoc(
        studyLinkV2RoomRef(
          code
        )
      );


    if (
      !roomSnap.exists() ||
      roomSnap.data().active === false
    ) {

      await setDoc(
        doc(
          db,
          "users",
          user.uid
        ),
        {
          studyLinkRoomCode:""
        },
        {
          merge:true
        }
      );


      disableStudyLinkRoomModeV1();

      return;

    }


    const existingRoomCard =
      document.getElementById(
        "study-link-card-v2"
      );


    if (existingRoomCard) {

      enableStudyLinkRoomModeV1(
        code
      );

      return;

    }


    studyLinkRoomModeRedirectingV1 =
      true;


    await showStudyMainPage(
      user
    );


    enableStudyLinkRoomModeV1(
      code
    );

  }

  catch (error) {

    console.error(
      "STUDY LINK room restore:",
      error
    );

  }

  finally {

    studyLinkRoomModeRedirectingV1 =
      false;

  }

}

function startStudyLinkRoomTimerIntervalV1() {

    );

function escapeStudyLinkRoomTimerHtmlV1(
  value
) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

) {

async function mountStudyLinkRoomTimerV1(
  user,
  code
) {

    document.getElementById(
      "study-link-v2-active"
    );


  if (!active) {

    console.warn(
      "STUDY LINK ROOM TIMER: active panel not found"
    );

    return;

  }


  let box =
    document.getElementById(
      "study-link-room-timer-v1"
    );


  if (!box) {

    box =
      document.createElement(
        "div"
      );

    box.id =
      "study-link-room-timer-v1";


    const members =
      active.querySelector(
        ".study-link-v2-members-wrap"
      );


    if (members) {

      active.insertBefore(
        box,
        members
      );

    }

    else {

      active.appendChild(
        box
      );

    }

  }


  const userRef =
    doc(
      db,
      "users",
      user.uid
    );


  const results =
    await Promise.all([
      getDoc(userRef),
      loadActiveTimer(user)
    ]);


  const userSnap =
    results[0];

  const restoredTimer =
    results[1];


  if (!userSnap.exists()) {

    box.innerHTML =
      "ユーザーデータを取得できませんでした。";

    return;

  }


  if (
    restoredTimer &&
    !timerState.subject
  ) {

    timerState =
      restoredTimer;

  }


  const userData =
    userSnap.data();


  const subjects =
    Array.isArray(
      userData.selectedSubjects
    )
      ? userData.selectedSubjects
      : [];


  const subjectOptions =
    subjects.map(
      subject => {

        const safe =
          escapeStudyLinkRoomTimerHtmlV1(
            subject
          );

        return `
          <option value="${safe}">
            ${safe}
          </option>
        `;

      }
    ).join("");


  box.innerHTML = `

    <div class="study-link-room-timer-label-v1">
      SUBJECT
    </div>


    <select id="study-link-room-subject-v1">

      <option value="">
        教科を選択
      </option>

      ${subjectOptions}

    </select>


    <div id="study-link-room-clock-v1">
      ${formatTimer(currentElapsedMs())}
    </div>


    <div id="study-link-room-timer-state-v1">

      <span
        class="study-link-room-timer-dot-v1"
      ></span>

      <span id="study-link-room-timer-state-text-v1">
        IDLE
      </span>

    </div>


    <div class="study-link-room-timer-buttons-v1">

      <button
        type="button"
        id="study-link-room-start-v1"
      >
        START
      </button>


      <button
        type="button"
        id="study-link-room-pause-v1"
        disabled
      >
        PAUSE
      </button>


      <button
        type="button"
        id="study-link-room-finish-v1"
        disabled
      >
        FINISH
      </button>

    </div>


    <div id="study-link-room-timer-error-v1"></div>

  `;


  const subjectEl =
    document.getElementById(
      "study-link-room-subject-v1"
    );

  const startEl =
    document.getElementById(
      "study-link-room-start-v1"
    );

  const pauseEl =
    document.getElementById(
      "study-link-room-pause-v1"
    );

  const finishEl =
    document.getElementById(
      "study-link-room-finish-v1"
    );

  const stateEl =
    document.getElementById(
      "study-link-room-timer-state-v1"
    );

  const stateText =
    document.getElementById(
      "study-link-room-timer-state-text-v1"
    );

  const errorEl =
    document.getElementById(
      "study-link-room-timer-error-v1"
    );


  function renderControls() {

    const hasTimer =
      Boolean(
        timerState.subject
      );


    if (!hasTimer) {

      subjectEl.disabled =
        false;

      startEl.disabled =
        false;

      pauseEl.disabled =
        true;

      finishEl.disabled =
        true;

      pauseEl.textContent =
        "PAUSE";

      stateEl.className =
        "";

      stateText.textContent =
        "IDLE";

      return;

    }


    subjectEl.value =
      timerState.subject;

    subjectEl.disabled =
      true;

    startEl.disabled =
      true;

    pauseEl.disabled =
      false;

    finishEl.disabled =
      false;


    if (timerState.paused) {

      pauseEl.textContent =
        "RESUME";

      stateEl.className =
        "paused";

      stateText.textContent =
        "PAUSED";

    }

    else {

      pauseEl.textContent =
        "PAUSE";

      stateEl.className =
        "studying";

      stateText.textContent =
        "STUDYING";

    }

  }


  renderControls();

  startStudyLinkRoomTimerIntervalV1();


  await syncStudyLinkRoomTimerMemberV1(
    user,
    code
  );


  // ==========================================================
  // START
  // ==========================================================

  startEl.onclick =
    async () => {

      const subject =
        subjectEl.value;


      if (!subject) {

        errorEl.textContent =
          "教科を選択してください。";

        return;

      }


      errorEl.textContent =
        "";

      startEl.disabled =
        true;


      try {

        const freshSnap =
          await getDoc(
            userRef
          );


        if (!freshSnap.exists()) {

          throw new Error(
            "ユーザーデータが見つかりません。"
          );

        }


        const fresh =
          freshSnap.data();


        const queuedXpItem =
          String(
            fresh.queuedXpItem ??
            ""
          );


        const queuedItemCount =
          Number(
            fresh.inventory?.[
              queuedXpItem
            ] ?? 0
          );


        timerState.subject =
          subject;


        timerState.xpItem =
          (
            queuedXpItem &&
            XP_ITEM_EFFECTS[
              queuedXpItem

            queuedItemCount > 0
          )
            ? queuedXpItem

        if (timerState.xpItem) {

            userRef,

              updatedAt:

          false;


        timerState.studyLinkRankEligibleMs =

        timerState.studyLinkRankEligibleStartedAt =
          null;


        await saveActiveTimer(
          user
        );


        await syncStudyLinkRoomTimerMemberV1(
          user,
          code
        );


        await refreshStudyLinkStatusV1(
          user,
          code
        );


        renderControls();

        startStudyLinkRoomTimerIntervalV1();

      }

      catch (error) {

        console.error(
          "ROOM TIMER START:",
          error
        );


        errorEl.textContent =
          error?.message ||
          "タイマーを開始できませんでした.";


        if (!timerState.subject) {

          startEl.disabled =
            false;

        }

      }

    };


  // ==========================================================
  // PAUSE / RESUME
  // ==========================================================

  pauseEl.onclick =
    async () => {

      if (!timerState.subject) {
        return;
      }


      errorEl.textContent =
        "";


      try {

        if (!timerState.paused) {

          await setStudyLinkEligibilityV1(
            user,
            false
          );

        }


        if (timerState.paused) {

          timerState.startedAt =
            Date.now();

          timerState.paused =
            false;

        }

        else {

          timerState.elapsedBeforePause =
            currentElapsedMs();

          timerState.startedAt =
            null;

          timerState.paused =
            true;

        }


        await saveActiveTimer(
          user
        );


        await syncStudyLinkRoomTimerMemberV1(
          user,
          code
        );


        await refreshStudyLinkStatusV1(
          user,
          code
        );


        renderControls();

        startStudyLinkRoomTimerIntervalV1();

      }

      catch (error) {

        console.error(
          "ROOM TIMER PAUSE:",
          error
        );


        errorEl.textContent =
          error?.message ||
          "タイマー状態を変更できませんでした。";

      }

    };


  // ==========================================================
  // FINISH
  // ==========================================================

  finishEl.onclick =
    async () => {

      if (!timerState.subject) {
        return;
      }


      finishEl.disabled =
        true;

      pauseEl.disabled =
        true;

      errorEl.textContent =
        "";


      try {

        await setStudyLinkEligibilityV1(
          user,
          false
        );


        const elapsedMs =
          currentElapsedMs();


        timerState.elapsedBeforePause =
          elapsedMs;

        timerState.startedAt =
          null;

        timerState.paused =
          true;


        await saveActiveTimer(
          user
        );


        await syncStudyLinkRoomTimerMemberV1(
          user,
          code
        );


        stopStudyLinkRoomTimerIntervalV1();


        /*
          保存ロジックは新造せず、
          既存タイマーへ状態を渡す。
        */
        disableStudyLinkRoomModeV1();


        await showTimerPage(
          user
        );


        const endButton =
          document.getElementById(
            "timer-end"
          );


        if (!endButton) {

          throw new Error(
            "既存タイマー終了処理が見つかりません。"
          );

        }


        endButton.disabled =
          false;

        endButton.click();

      }

      catch (error) {

        console.error(
          "ROOM TIMER FINISH:",
          error
        );


        await showStudyMainPage(
          user
        );

      }

    };

}

// ============================================================
// STUDY LINK
// LINK ACTIVE TIME TRACKER v1
//
// この段階では時間を測るだけ。
// RANK / XP / GOLD / BOSSにはまだ反映しない。
// ============================================================

function normalizeStudyLinkBoostLevelV1(
  value
) {

  return Math.max(
    0,
    Math.min(
      3,
      Math.floor(
        Number(
          value || 0
        )
      )
    )
  );

}


function getStudyLinkEligibleTimeMsByBoostV1() {

  const source =
    timerState.studyLinkEligibleMsByBoost ||
    {};


  const result = {
    0: Math.max(
      0,
      Number(source[0] ?? 0)
    ),

    1: Math.max(
      0,
      Number(source[1] ?? 0)
    ),

    2: Math.max(
      0,
      Number(source[2] ?? 0)
    ),

    3: Math.max(
      0,
      Number(source[3] ?? 0)
    ),
  };


  const startedAt =
    Number(
      timerState.studyLinkRankEligibleStartedAt ||
      0
    );


  if (startedAt > 0) {

    const level =
      normalizeStudyLinkBoostLevelV1(
        timerState.studyLinkEligibleBoostLevel
      );


    result[level] +=
      Math.max(
        0,
        Date.now() -
        startedAt
      );

  }


  return result;

}


function getStudyLinkEligibleTimeMsV1() {

  let total =
    Math.max(
      0,
      Number(
        timerState.studyLinkRankEligibleMs ||
        0
      )
    );


  const startedAt =
    Number(
      timerState.studyLinkRankEligibleStartedAt ||
      0
    );


  if (startedAt > 0) {

    total +=
      Math.max(
        0,
        Date.now() - startedAt
      );

  }


  return total;

}


async function setStudyLinkBoostTrackingLevelV1(
  user,
  nextLevel
) {

  nextLevel =
    normalizeStudyLinkBoostLevelV1(
      nextLevel
    );


  const previousCurrentLevel =
    normalizeStudyLinkBoostLevelV1(
      timerState.studyLinkCurrentBoostLevel
    );


  const startedAt =
    Number(
      timerState.studyLinkRankEligibleStartedAt ||
      0
    );


  timerState.studyLinkCurrentBoostLevel =
    nextLevel;


  if (startedAt > 0) {

    const previousEligibleLevel =
      normalizeStudyLinkBoostLevelV1(
        timerState.studyLinkEligibleBoostLevel
      );


    if (
      previousEligibleLevel !==
      nextLevel
    ) {

      const now =
        Date.now();


      const elapsed =
        Math.max(
          0,
          now -
          startedAt
        );


      timerState.studyLinkRankEligibleMs =
        Math.max(
          0,
          Number(
            timerState.studyLinkRankEligibleMs ||
            0
          )
        ) +
        elapsed;


      const buckets = {
        0: Math.max(
          0,
          Number(
            timerState.studyLinkEligibleMsByBoost?.[0] ?? 0
          )
        ),

        1: Math.max(
          0,
          Number(
            timerState.studyLinkEligibleMsByBoost?.[1] ?? 0
          )
        ),

        2: Math.max(
          0,
          Number(
            timerState.studyLinkEligibleMsByBoost?.[2] ?? 0
          )
        ),

        3: Math.max(
          0,
          Number(
            timerState.studyLinkEligibleMsByBoost?.[3] ?? 0
          )
        ),
      };


      buckets[
        previousEligibleLevel
      ] +=
        elapsed;


      timerState.studyLinkEligibleMsByBoost =
        buckets;


      timerState.studyLinkRankEligibleStartedAt =
        now;


      timerState.studyLinkEligibleBoostLevel =
        nextLevel;


      await saveActiveTimer(
        user
      );


      return;

    }

  }


  if (
    previousCurrentLevel !==
    nextLevel
  ) {

    await saveActiveTimer(
      user
    );

  }

}


async function setStudyLinkEligibilityV1(
  user,
  eligible
) {

  eligible =
    Boolean(
      eligible &&
      timerState.subject &&
      !timerState.paused
    );


  const currentStart =
    Number(
      timerState.studyLinkRankEligibleStartedAt ||
      0
    );


  // LINK START
  if (
    eligible &&
    !currentStart
  ) {

    timerState.studyLinkEligibleBoostLevel =
      normalizeStudyLinkBoostLevelV1(
        timerState.studyLinkCurrentBoostLevel
      );


    timerState.studyLinkRankEligibleStartedAt =
      Date.now();


    await saveActiveTimer(
      user
    );


    return;

  }


  // LINK END
  if (
    !eligible &&
    currentStart
  ) {

    const elapsed =
      Math.max(
        0,
        Date.now() -
        currentStart
      );


    const level =
      normalizeStudyLinkBoostLevelV1(
        timerState.studyLinkEligibleBoostLevel
      );


    timerState.studyLinkRankEligibleMs =
      Math.max(
        0,
        Number(
          timerState.studyLinkRankEligibleMs ||
          0
        )
      ) +
      elapsed;


    const buckets = {
      0: Math.max(
        0,
        Number(
          timerState.studyLinkEligibleMsByBoost?.[0] ?? 0
        )
      ),

      1: Math.max(
        0,
        Number(
          timerState.studyLinkEligibleMsByBoost?.[1] ?? 0
        )
      ),

      2: Math.max(
        0,
        Number(
          timerState.studyLinkEligibleMsByBoost?.[2] ?? 0
        )
      ),

      3: Math.max(
        0,
        Number(
          timerState.studyLinkEligibleMsByBoost?.[3] ?? 0
        )
      ),
    };


    buckets[level] +=
      elapsed;


    timerState.studyLinkEligibleMsByBoost =
      buckets;


    timerState.studyLinkRankEligibleStartedAt =
      null;


    timerState.studyLinkEligibleBoostLevel =
      0;


    await saveActiveTimer(
      user
    );

  }

}



async function refreshStudyLinkStatusV1(
  user,
  code
) {

  const panel =
    document.getElementById(
      "study-link-status-panel-v1"
    );


  if (
    !panel ||
    !code
  ) {

    return;

  }


  try {

    const snap =
      await getDocs(
        collection(
          db,
          "studyLinkRooms",
          code,
          "members"
        )
      );


    const members =
      snap.docs.map(
        docSnap => ({
          uid: docSnap.id,
          ...docSnap.data()
        })
      );


    const studyingMembers =
      members.filter(
        member =>
          member.state === "studying"
      );


    const studyingCount =
      studyingMembers.length;


    const linkActive =
      studyingCount >= 2;


    const ownMember =
      members.find(
        member =>
          member.uid === user.uid
      );


    const ownStudying =
      ownMember?.state ===
      "studying";


    const personalEligible =
      linkActive &&
      ownStudying;


    await setStudyLinkEligibilityV1(
      user,
      personalEligible
    );


    const state =
      document.getElementById(
        "study-link-status-state-v1"
      );


    const count =
      document.getElementById(
        "study-link-status-count-v1"
      );


    const detail =
      document.getElementById(
        "study-link-status-detail-v1"
      );


    const personal =
      document.getElementById(
        "study-link-status-personal-v1"
      );


    if (
      !state ||
      !count ||
      !detail ||
      !personal
    ) {

      return;

    }


    count.innerHTML = `
      <strong>${studyingCount}</strong>
      / ${members.length}
      STUDYING
    `;


    if (linkActive) {

      panel.classList.add(
        "active"
      );


      state.innerHTML = `

        <span class="study-link-status-dot-v1"></span>

        LINK ACTIVE

      `;


      detail.innerHTML = `

            </div>

          <div class="study-link-status-bonus-v1">

            <div class="study-link-status-bonus-name-v1">
              XP
            </div>

            <div class="study-link-status-bonus-value-v1">
              ×1.10
            </div>

          </div>


          <div class="study-link-status-bonus-v1">

            <div class="study-link-status-bonus-name-v1">
              GOLD
            </div>

            <div class="study-link-status-bonus-value-v1">
              ×1.10
            </div>

          </div>


          <div class="study-link-status-bonus-v1">

            <div class="study-link-status-bonus-name-v1">
              BOSS
            </div>

            <div class="study-link-status-bonus-value-v1">
              ×1.15
            </div>

          </div>

        </div>

      `;


      if (personalEligible) {

        personal.className =

        personal.textContent =

      }

      else {

        personal.className =

      }

    else {

      panel.classList.remove(
        "active"
      );


      state.innerHTML = `

        <span class="study-link-status-dot-v1"></span>

      `;

        );

          ${
            needed === 1
              ? "あと1人が勉強を開始するとLINKします。"
              : "2人以上が勉強を開始するとLINKします。"
          }

        </div>

// ============================================================
// STUDY LINK BOOST FUND v1
//
// pooled contribution system
//
// BOOST I   1,000 COINS
// BOOST II  3,000 COINS
// BOOST III 7,500 COINS
//
// Activation:
//   target reached -> active for 60 minutes
//
// NOTE:
//   Multipliers themselves are NOT applied here yet.
// ============================================================

const STUDY_LINK_BOOST_COSTS_V1 = {
  1: 1000,
  2: 3000,
  3: 7500,
};


let studyLinkBoostFundIntervalV1 =
  null;


function stopStudyLinkBoostFundPollingV1() {

  if (
    studyLinkBoostFundIntervalV1
  ) {

    clearInterval(
      studyLinkBoostFundIntervalV1
    );

    studyLinkBoostFundIntervalV1 =
      null;

  }

}


function getStudyLinkBoostStateV1(
  roomData
) {

  const now =
    Date.now();


  const storedActiveLevel =
    Math.max(
      0,
      Math.min(
        3,
        Number(
          roomData?.boostActiveLevel ??
          0
        )
      )
    );


  const activeUntil =
    Math.max(
      0,
      Number(
        roomData?.boostActiveUntil ??
        0
      )
    );


  const activeLevel =
    normalizeStudyLinkBoostLevelV1(
      roomData?.boostActiveLevel ?? 0
    );


  let targetLevel =
    Number(
      roomData?.boostTargetLevel ??
      1
    );


  if (
    ![1, 2, 3].includes(
      targetLevel
    )
  ) {

    targetLevel = 1;

  }


  const pool =
    Math.max(
      0,
      Number(
        roomData?.boostPool ??
        0
      )
    );


  const targetCost =
    STUDY_LINK_BOOST_COSTS_V1[
      targetLevel
    ];


  const remaining =
    Math.max(
      0,
      targetCost - pool
    );


  return {
    now,
    activeLevel,
    activeUntil,
    targetLevel,
    targetCost,
    pool,
    remaining,
  };

}


function formatStudyLinkBoostTimeV1(
  ms
) {

  const totalSeconds =
    Math.max(
      0,
      Math.ceil(
        Number(ms || 0) /
        1000
      )
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  return (
    String(minutes) +
    ":" +
    String(seconds).padStart(
      2,
      "0"
    )
  );

}


async function contributeStudyLinkBoostV1(
  user,
  code,
  requestedAmount
) {

  const normalizedCode =
    normalizeStudyLinkV2Code(
      code
    );


  const requested =
    Math.floor(
      Number(
        requestedAmount || 0
      )
    );


  if (!normalizedCode) {

    throw new Error(
      "ROOM CODEが無効です"
    );

  }


  if (
    !Number.isFinite(
      requested
    ) ||
    requested <= 0
  ) {

    throw new Error(
      "出資額を入力してください"
    );

  }


  return await runTransaction(
    db,
    async (transaction) => {

      const roomRef =
        studyLinkV2RoomRef(
          normalizedCode
        );


      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      // Firestore transaction:
      // READ phase first
      const roomSnap =
        await transaction.get(
          roomRef
        );


      const userSnap =
        await transaction.get(
          userRef
        );


      if (!roomSnap.exists()) {

        throw new Error(
          "ROOMが存在しません"
        );

      }


      if (!userSnap.exists()) {

        throw new Error(
          "ユーザーデータがありません"
        );

      }


      const roomData =
        roomSnap.data();


      const userData =
        userSnap.data();


      if (
        roomData.active === false
      ) {

        throw new Error(
          "このROOMは終了しています"
        );

      }


      const ownRoomCode =
        normalizeStudyLinkV2Code(
          userData.studyLinkRoomCode ||
          ""
        );


      if (
        ownRoomCode !==
        normalizedCode
      ) {

        throw new Error(
          "このROOMのメンバーではありません"
        );

      }


      const state =
        getStudyLinkBoostStateV1(
          roomData
        );


      const userCoins =
        Math.max(
          0,
          Math.floor(
            Number(
              userData.coins ??
              0
            )
          )
        );


      if (
        state.remaining <= 0
      ) {

        throw new Error(
          "BOOST FUNDはすでに満額です"
        );

      }


      const amount =
        Math.min(
          requested,
          state.remaining
        );


      if (
        userCoins < amount
      ) {

        throw new Error(
          "COINSが足りません"
        );

      }


      const nextPool =
        state.pool +
        amount;


      const activated =
        nextPool >=
        state.targetCost;


      const roomUpdate = {

        boostPool:
          activated
            ? 0
            : nextPool,

        boostTargetLevel:
          activated
            ? (
                state.targetLevel < 3
                  ? state.targetLevel + 1
                  : 3
              )
            : state.targetLevel,

        updatedAt:
          serverTimestamp(),

      };


      if (activated) {

        roomUpdate.boostActiveLevel =
          state.targetLevel;

        roomUpdate.boostActiveUntil = 0;

        roomUpdate.boostActivatedBy =
          user.uid;

        roomUpdate.boostActivatedAt =
          serverTimestamp();

      }


      transaction.set(
        roomRef,
        roomUpdate,
        {
          merge:true
        }
      );


      transaction.set(
        userRef,
        {

          coins:
            userCoins -
            amount,

          lifetimeCoinsSpent:
            Number(
              userData.lifetimeCoinsSpent ??
              0
            ) +
            amount,

          updatedAt:
            serverTimestamp(),

        },
        {
          merge:true
        }
      );


      return {

        amount,

        activated,

        activatedLevel:
          activated
            ? state.targetLevel
            : 0,

      };

    }
  );

}


async function refreshStudyLinkBoostFundV1(
  user,
  code
) {

  const panel =
    document.getElementById(
      "study-link-boost-fund-v1"
    );


  if (!panel) {

    stopStudyLinkBoostFundPollingV1();

    return;

  }


  const roomRef =
    studyLinkV2RoomRef(
      code
    );


  const userRef =
    doc(
      db,
      "users",
      user.uid
    );


  const [
    roomSnap,
    userSnap
  ] =
    await Promise.all([
      getDoc(roomRef),
      getDoc(userRef),
    ]);


  if (
    !roomSnap.exists() ||
    !userSnap.exists()
  ) {

    return;

  }


  const roomData =
    roomSnap.data();


  const userData =
    userSnap.data();


  const state =
    getStudyLinkBoostStateV1(
      roomData
    );


  await setStudyLinkBoostTrackingLevelV1(
    user,
    state.activeLevel
  );


  const coins =
    Math.max(
      0,
      Math.floor(
        Number(
          userData.coins ??
          0
        )
      )
    );


  const title =
    panel.querySelector(
      "[data-boost-title]"
    );


  const activeText =
    panel.querySelector(
      "[data-boost-active]"
    );


  const progress =
    panel.querySelector(
      "[data-boost-progress]"
    );


  const fill =
    panel.querySelector(
      "[data-boost-fill]"
    );


  const coinsText =
    panel.querySelector(
      "[data-boost-coins]"
    );


  const input =
    panel.querySelector(
      "[data-boost-input]"
    );


  if (title) {

    title.textContent =
      `BOOST ${["","I","II","III"][state.targetLevel]} FUND`;

  }


  if (activeText) {

    if (
      state.activeLevel > 0
    ) {

      activeText.textContent =
        `BOOST ${["","I","II","III"][state.activeLevel]} ACTIVE`;

    }

    else {

      activeText.textContent =
        "BOOST OFF";

    }

  }


  if (progress) {

    progress.textContent =
      `${Math.floor(state.pool).toLocaleString()} / ${state.targetCost.toLocaleString()} COINS`;

  }


  if (fill) {

    const percent =
      Math.max(
        0,
        Math.min(
          100,
          (
            state.pool /
            state.targetCost
          ) *
          100
        )
      );


    fill.style.width =
      `${percent}%`;

  }


  if (coinsText) {

    coinsText.textContent =
      `YOUR COINS ${coins.toLocaleString()}`;

  }


  if (input) {

    input.max =
      String(
        Math.max(
          0,
          Math.min(
            coins,
            state.remaining
          )
        )
      );

  }


  panel.dataset.remaining =
    String(
      state.remaining
    );


  panel.dataset.coins =
    String(
      coins
    );

}
