<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受験RPG - 勉強を冒険に変えよう</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- 1. ログイン / 新規登録画面 -->
    <div id="screen-auth" class="screen">
      <div class="page-container">
        <div class="card register-card">
          <div class="register-logo">⚔️</div>
          <h2>受験RPG</h2>
          <p style="margin-bottom: 20px;">勉強を冒険に変えよう</p>
          
          <!-- タブ切替 -->
          <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" type="button">ログイン</button>
            <button class="auth-tab" id="tab-signup" type="button">新規登録</button>
          </div>

          <form id="auth-form" class="register-form">
            <!-- ユーザーID -->
            <input type="text" id="auth-user-id" placeholder="ユーザーID (例: hero_001)" required />
            
            <!-- 新規登録時のみ表示 -->
            <input type="text" id="auth-player-name" placeholder="プレイヤー名 (例: 勇者タロウ)" class="hidden" />
            
            <!-- 文理コース選択（新規登録時のみ） -->
            <select id="auth-track" class="input-field hidden" style="margin-bottom: 12px;">
              <option value="science" selected>🧪 理系（物理・化学・生物・数ⅢC重視）</option>
              <option value="humanities">📚 文系（国語・地歴公民・理科基礎重視）</option>
              <option value="general">🎓 標準・共通（全教科バランス型）</option>
            </select>
            
            <!-- パスワード -->
            <input type="password" id="auth-password" placeholder="パスワード" required />
            <button type="submit" class="primary-button large-button" id="auth-submit-btn">ログインして開始</button>
          </form>
        </div>
      </div>
    </div>

    <!-- 2. メインアプリ画面 -->
    <div id="screen-main" class="screen hidden">
      <!-- 共通ヘッダー -->
      <header class="top-header">
        <div class="header-left" id="btn-open-profile" style="cursor: pointer;">
          <div class="header-avatar" id="header-avatar">🧙‍♂️</div>
          <div class="header-user-info">
            <div class="header-name-row">
              <span class="header-name" id="header-player-name">---</span>
              <span class="star-badge hidden" id="header-star">⭐</span>
            </div>
            <div class="header-level" id="header-level">Lv.1</div>
          </div>
        </div>

        <div class="header-right">
          <div class="season-badge-mini">SEASON 1 (残り12日)</div>
          <div class="header-currency">
            <span class="rank-badge-mini" id="header-rank">Bronze</span>
            <span class="coin-display" id="header-coins">🪙 0</span>
          </div>
        </div>
      </header>

      <!-- 【ページ1】ホーム -->
      <div id="page-home" class="page active">
        <div class="page-container">
          <!-- ヒーローカード -->
          <div class="hero-card">
            <div class="hero-top">
              <div>
                <h1 class="player-display-name" id="hero-player-name">---</h1>
                <div class="user-id-badge" id="hero-user-id">ID: @---</div>
                <div style="display: flex; gap: 6px; align-items: center; margin-top: 6px;">
                  <span class="rank-badge" id="hero-rank-display">RANK: Bronze</span>
                  <span class="title-sub-badge" id="hero-title">新米受験生</span>
                </div>
              </div>
              <div class="hero-avatar" id="hero-avatar">🧙‍♂️</div>
            </div>
            
            <!-- 総合レベルXPゲージ -->
            <div class="level-display" style="margin-top: 16px;">
              <span id="hero-level-label">総合レベル (Lv.1)</span>
              <strong id="hero-xp-text">0 / 100 XP</strong>
            </div>
            <div class="xp-bar">
              <div class="xp-bar-fill" id="hero-xp-bar" style="width: 0%;"></div>
            </div>
          </div>

          <!-- スタッツ表示 -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value" id="stat-total-time">0分</div>
              <div class="stat-label">総勉強時間</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-streak">1日</div>
              <div class="stat-label">連続ログイン</div>
            </div>
          </div>

          <!-- クイックアクション -->
          <div class="quick-actions">
            <button class="quick-action" id="btn-quick-study">
              <span style="font-size: 1.5rem;">⏱️</span>
              <div style="text-align: left;">
                <div style="font-weight: 800; font-size: 0.95rem; color:#fff;">勉強タイマー</div>
                <div style="font-size: 0.7rem; color: #888;">自動計測＆XP獲得</div>
              </div>
            </button>
            <button class="quick-action" id="btn-quick-manual">
              <span style="font-size: 1.5rem;">📝</span>
              <div style="text-align: left;">
                <div style="font-weight: 800; font-size: 0.95rem; color:#fff;">手動学習記録</div>
                <div style="font-size: 0.7rem; color: #888;">時間を直接入力</div>
              </div>
            </button>
          </div>

          <!-- デイリークエスト -->
          <div class="section-title">デイリークエスト</div>
          <div id="quest-list"></div>
        </div>
      </div>

      <!-- 【ページ2】勉強 -->
      <div id="page-study" class="page">
        <div class="page-container">
          <h2>勉強の記録</h2>

          <div class="study-tabs">
            <button class="auth-tab active" id="tab-timer-mode" type="button">タイマー計測</button>
            <button class="auth-tab" id="tab-manual-mode" type="button">手動入力</button>
          </div>

          <!-- タイマーモード -->
          <div id="mode-timer-container" class="card">
            <div class="section-title" style="margin-bottom: 8px;">教科を選択</div>
            <div class="subject-grid" id="subject-selector"></div>
            <div id="current-subject-label" style="text-align:center; font-weight:bold; margin-bottom:12px;">選択中: 英語</div>

            <div class="timer-display" id="timer-display" style="font-size: 3rem; text-align: center; font-weight: bold; margin: 20px 0;">25:00</div>
            <div style="display: flex; gap: 8px;">
              <button class="primary-button large-button" id="btn-timer-toggle" style="flex: 2;">スタート</button>
              <button class="auth-tab" id="btn-timer-reset" style="flex: 1;">リセット</button>
            </div>
          </div>

          <!-- 手動入力モード -->
          <div id="mode-manual-container" class="card hidden">
            <form id="manual-study-form">
              <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; color: #888;">教科を選択</label>
                <select id="manual-subject-select" class="input-field" style="width:100%; padding:10px; margin-top:4px; background:#0f172a; color:#fff; border-radius:6px;"></select>
              </div>
              <div style="margin-bottom: 12px;">
                <label style="font-size: 0.85rem; color: #888;">勉強時間（分）</label>
                <input type="number" id="manual-minutes" class="input-field" placeholder="例: 45" min="1" required style="width:100%; padding:10px; margin-top:4px; background:#0f172a; color:#fff; border-radius:6px;" />
              </div>
              <button type="submit" class="primary-button large-button">学習を記録してXP獲得</button>
            </form>
          </div>
        </div>
      </div>

      <!-- 【ページ3】ショップ -->
      <div id="page-shop" class="page">
        <div class="page-container">
          <h2>ショップ</h2>
          <div class="shop-grid" id="shop-items-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;"></div>
        </div>
      </div>

      <!-- 下部ナビゲーションバー -->
      <nav class="bottom-nav">
        <button class="nav-button active" data-target="page-home">
          <span>🏠</span>
          <small>ホーム</small>
        </button>
        <button class="nav-button" data-target="page-study">
          <span>⏱️</span>
          <small>勉強</small>
        </button>
        <button class="nav-button" data-target="page-shop">
          <span>🛒</span>
          <small>ショップ</small>
        </button>
      </nav>
    </div>

    <!-- モーダル: プロフィール -->
    <div id="modal-profile" class="modal-overlay hidden">
      <div class="modal-card">
        <div style="text-align: right;"><button id="btn-close-profile" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button></div>
        <div style="text-align: center;">
          <div id="prof-avatar" style="font-size: 4rem;">🧙‍♂️</div>
          <h2 id="prof-player-name" style="margin: 8px 0 4px 0;">---</h2>
          <div id="prof-user-id" style="color:#888; font-size:0.85rem;">ID: @---</div>
          <div id="prof-title" style="color:var(--primary-color); font-weight:bold; margin-top:4px;">新米受験生</div>
          <div id="prof-star-badge" class="star-badge hidden" style="margin-top:8px;">⭐プレステージ完了</div>
        </div>
      </div>
    </div>

    <!-- モーダル: クエストクリア -->
    <div id="modal-quest-complete" class="modal-overlay hidden">
      <div class="modal-card" style="text-align: center;">
        <h2>🎉 クエストクリア！</h2>
        <div id="quest-complete-rewards" style="margin: 16px 0;"></div>
        <button class="primary-button" id="btn-close-quest-complete">受け取る</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
